<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="claude:viewport-fit-sides" content="cover"><title>__TITLE__</title>
<style id="theme">

</style>
<style id="base">
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;margin:0}
.wrap{margin:0 auto;padding-block:24px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.wrap.s-setup{max-width:820px}.wrap.s-quiz,.wrap.s-review{max-width:780px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h2{font-family:var(--hand);font-size:1.3rem;font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;transition:background .15s,border-color .15s,transform .1s}
button:hover{border-color:var(--hema)}
button:active{transform:translateY(1px)}
button:focus-visible,label:focus-within,summary:focus-visible{outline:3px solid var(--label);outline-offset:2px}
button.primary{background:var(--hema);border-color:var(--hema);color:var(--surface);font-weight:700;padding:11px 22px}
button.primary:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 10px}
button.ghost:hover{color:var(--hema);border-color:transparent;background:var(--hema-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:0 1px 0 var(--line)}

/* ---------- slide header ---------- */
.slide{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(20,40,90,.35)}
.slide .band{background:var(--label);color:var(--label-ink);font-family:var(--mono);font-weight:700;font-size:.78rem;letter-spacing:.06em;padding:10px 22px;display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.slide .glass{position:relative;padding:26px 22px 22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.slide h1{font-family:var(--hand);font-weight:700;font-size:clamp(2.1rem,6.4vw,3.4rem);letter-spacing:.02em;line-height:1.1}
.slide h1 em{font-style:normal;color:var(--eosin)}
.slide .lede{margin:10px 0 0;color:var(--muted);max-width:62ch;font-size:.95rem}
.tissue{width:132px;height:132px;border-radius:50%;flex:none;background:
 radial-gradient(circle at 30% 34%,var(--hema) 0 5px,transparent 6px),radial-gradient(circle at 58% 28%,var(--hema) 0 4px,transparent 5px),
 radial-gradient(circle at 70% 56%,var(--hema) 0 6px,transparent 7px),radial-gradient(circle at 40% 66%,var(--hema) 0 4px,transparent 5px),
 radial-gradient(circle at 22% 54%,var(--hema) 0 3px,transparent 4px),radial-gradient(circle at 52% 82%,var(--hema) 0 3px,transparent 4px),
 radial-gradient(circle at 50% 50%,var(--eosin-soft) 0 60%,transparent 61%),var(--surface2);
 box-shadow:inset 0 0 0 6px var(--surface),inset 0 0 0 7px var(--line)}
.slide details{grid-column:1/-1}
.pill{width:132px;height:132px;flex:none;border-radius:50%;background:var(--surface2);box-shadow:inset 0 0 0 6px var(--surface),inset 0 0 0 7px var(--line);display:flex;align-items:center;justify-content:center;transform:rotate(-35deg)}
.pill i{display:block;width:40px;height:34px;background:var(--hema);border-radius:17px 0 0 17px}
.pill i+i{background:var(--label);border-radius:0 17px 17px 0}
@media (max-width:560px){.slide .glass{grid-template-columns:1fr}.tissue,.pill{display:none}}

/* ---------- setup two-column ---------- */
.board{display:flex;flex-direction:column;gap:18px}
.dock{display:flex;flex-direction:column;gap:18px}
.picks{display:flex;flex-direction:column;gap:18px;min-width:0}
.ringrow{display:flex;gap:16px;align-items:center}
.ring{--p:0;width:108px;height:108px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--hema) calc(var(--p)*1%),var(--surface2) 0)}
.ring>div{width:82px;height:82px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-family:var(--mono);font-size:1.35rem}
.ring small{font-size:.7rem;color:var(--muted)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;flex:1}
.mini b{display:block;font-family:var(--mono);font-size:1.2rem;font-variant-numeric:tabular-nums;line-height:1.2}
.mini span{font-size:.78rem;color:var(--muted)}
.selbox{background:var(--label-soft);border:1px dashed var(--label);border-radius:12px;padding:12px 14px;font-size:.92rem}
.selbox b{font-family:var(--mono);font-size:1.15rem}
.actions{display:flex;flex-direction:column;gap:8px}
.actions button{width:100%}
.startcard{border:2px solid var(--hema)}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--eosin);color:var(--surface);font-family:var(--mono);font-size:.82rem;margin-right:8px;vertical-align:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.chips button .n{font-family:var(--mono);font-size:.76rem;margin-left:6px;opacity:.75}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.unit{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px 14px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);min-width:0}
.unit input{position:absolute;top:14px;right:14px;width:18px;height:18px;accent-color:var(--hema)}
.unit.on{border-color:var(--hema);background:var(--hema-soft)}
.unit .date{font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--label-ink);background:var(--label);border-radius:6px;padding:1px 8px;align-self:flex-start}
.unit b{font-weight:700;padding-right:26px;line-height:1.45}
.unit small{color:var(--muted);font-size:.78rem}
.unit .count{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--eosin)}
details.info{font-size:.9rem}
details.info summary{cursor:pointer;color:var(--hema);font-weight:700}
.cov{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
.cov th,.cov td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.cov th{font-family:var(--mono);font-size:.76rem;color:var(--muted);font-weight:500}
.cov td.n{font-family:var(--mono);white-space:nowrap}
.tablebox{overflow-x:auto}

/* ---------- quiz ---------- */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.dots{display:flex;gap:3px}
.dots i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--hema)}

.qno{font-family:var(--hand);font-weight:700;font-size:2.3rem;line-height:1;color:var(--eosin);min-width:2.2ch}

.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);width:100%;color:var(--ink)}
.opt:hover{border-color:var(--hema)}
.opt .L{font-family:var(--mono);font-weight:700;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface2);font-size:.9rem}
.opt.sel{border-color:var(--hema);background:var(--hema-soft)}
.opt.sel .L{background:var(--hema);border-color:var(--hema);color:var(--surface)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}

.opt.no{border-color:var(--bad);background:var(--bad-soft)}

.opt .t{min-width:0;padding-top:3px}
.exp{font-size:.9rem;color:var(--muted);margin-top:6px;display:block;line-height:1.65;border-top:1px dashed var(--line);padding-top:6px}
.opt.ok .exp,.opt.no .exp{color:var(--ink)}
.note{font-size:.9rem;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.verdict{font-family:var(--hand);font-weight:700;font-size:1.35rem}

.concepts{display:flex;flex-direction:column;gap:12px}
.ccard{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ccard h3{padding:10px 14px;background:var(--surface2);font-size:1rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.ccard h3 small{font-weight:400;color:var(--muted);font-size:.76rem;font-family:var(--mono)}
.ccard .sec{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.ccard .lab{font-size:.72rem;letter-spacing:.12em;font-weight:700;color:var(--hema);font-family:var(--mono)}
.ccard ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
.ccard .mix{background:var(--warn-soft);border-top:1px solid var(--line)}
.ccard .mix .lab{color:var(--warn)}
.ccard .ktxt{margin:0;font-size:.94rem}
.ccard.core{border:1.5px solid var(--label)}
.ccard.core h3{background:var(--label);color:var(--label-ink);font-family:var(--hand);font-size:1.1rem}
.src{font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.nextbar{display:flex;justify-content:flex-end;align-items:center;gap:10px}

/* ---------- review ---------- */
.scorecard{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.scorecard .ring{width:140px;height:140px}.scorecard .ring>div{width:108px;height:108px}.scorecard .ring b{font-size:1.9rem}
@media (max-width:480px){.scorecard{grid-template-columns:1fr;justify-items:center}}
.ub{display:flex;flex-direction:column;gap:10px;min-width:0}
.ub .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.88rem}
.ub .r .bar{grid-column:1/-1;height:6px}
.ub .r .bar i{background:var(--good)}
.rq{border-left:5px solid var(--line)}
.rq.ok{border-left-color:var(--good)}.rq.no{border-left-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- export & wrong-book ---------- */
.xbtn:disabled{opacity:.45;cursor:not-allowed}
.xbtn{background:var(--label);border-color:var(--label);color:var(--label-ink);font-weight:700;padding:7px 14px;font-size:.88rem}
.xbox{display:flex;flex-direction:column;gap:6px}
.xbox textarea{width:100%;min-height:180px;resize:vertical;font-family:var(--body);font-size:.85rem;line-height:1.6;padding:10px 12px;border-radius:10px;border:1.5px dashed var(--label);background:var(--label-soft);color:var(--ink)}
.wb-entry{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wb-entry b{font-family:var(--mono);font-size:1.4rem;color:var(--bad)}
.wrap.s-wrongs{max-width:980px}
.wtable{width:100%;border-collapse:collapse;font-size:.9rem}
.wtable th{position:sticky;top:0;background:var(--surface2);font-size:.78rem;color:var(--muted);font-weight:700;text-align:left;padding:9px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.wtable td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.wtable tr.on td{background:var(--hema-soft)}

.wtable .u{white-space:nowrap}

.wtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px}
.wtable .fix{text-align:center;font-weight:900;font-size:1.05rem}
.okm{color:var(--good)}
@media (max-width:560px){.wtable{font-size:.8rem;table-layout:fixed}.wtable th,.wtable td{padding:7px 4px}.wtable th{white-space:normal;font-size:.7rem}.wtable .src2{min-width:0;font-size:.72rem}.wtable col.c0{width:28px}.wtable col.c1{width:52px}.wtable col.c2{width:26%}.wtable col.c4,.wtable col.c5{width:40px}.wtable .u .tag{padding:1px 5px;font-size:.68rem}}.nom{color:var(--bad)}
.slide h1 .ver{font-family:var(--mono);font-size:.3em;font-weight:700;color:var(--muted);margin-left:.45em;vertical-align:.4em;letter-spacing:0;white-space:nowrap}
.cdcard{border:2px solid var(--label)}
.cd{display:flex;gap:16px;align-items:center}
.cdnum{width:108px;height:108px;flex:none;border-radius:16px;background:var(--label);color:var(--label-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.cdnum b{font-family:var(--mono);font-size:2.7rem;font-variant-numeric:tabular-nums}
.cdnum span{font-size:.8rem;font-weight:700;margin-top:4px}
.cdmeta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.cdmeta .cdd{font-size:1.15rem;font-weight:700}
.cdedit{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cdedit input{font:inherit;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.chips button.rec{border-color:var(--label)}
.chips button .rt{font-size:.7rem;background:var(--label);color:var(--label-ink);border-radius:999px;padding:0 6px;margin-left:6px;font-weight:700}
.sched{font-size:.9rem;color:var(--muted)}
.sched b{color:var(--ink)}
.guess{padding:4px 12px;font-size:.85rem}
.guess.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:700}
.ygrp{flex-basis:100%;font-size:.78rem;font-weight:700;color:var(--muted);margin-top:4px}
.infos{grid-column:1/-1;display:flex;flex-direction:column;gap:10px}
.infotxt p{margin:8px 0 0;font-size:.88rem}
.lecs{margin:8px 0 0;padding-left:1.2em;font-size:.86rem;font-family:var(--mono);color:var(--muted);display:flex;flex-direction:column;gap:3px}
.dots button{flex:1;min-width:0;height:12px;border-radius:4px;background:var(--line);border:0;padding:0;cursor:pointer}
.dots button.ok{background:var(--good)}.dots button.no{background:var(--bad)}
.dots button.now{outline:2.5px solid var(--hema);outline-offset:1px;background:var(--hema-soft)}
.dots.dense{gap:1px}.dots.dense button{border-radius:1px}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast.copied{background:var(--good);color:var(--surface);font-weight:700}
.promptbox{display:flex;flex-direction:column;gap:8px;margin-top:8px}.promptpre{margin:0;max-height:360px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:var(--body);font-size:.82rem;line-height:1.6;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.wrap.s-favs{max-width:980px}
.wbtns{display:flex;gap:8px}.wbtns button{flex:1;min-width:0;white-space:nowrap;padding-inline:10px}
.qtimer{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.wrap.s-bank{max-width:900px}
.bankcard{padding:0;border:2px solid var(--label);overflow:hidden}

const PROMPT=/*PROMPT*/"# 考古題刷題網站（通用版提示詞）\n\n請用我附上的 **template.html**（刷題網站「網頁提示詞」裡按「下載網站模板」取得）加上我的講義與考古題，做出同一套刷題網站，只是換成我的科目。全程台灣繁體中文。請在可以執行程式、上傳檔案的環境使用。\n\n**做法：模板已經包含全部功能與版面，不要重寫或修改模板程式。** 你只要寫兩個檔案：\n- `data.json`：這一科的題目與設定，格式照最下方「data.json 規範」。\n- `theme.css`：配色風格，只放 CSS 變數。\n\n再用程式把這兩個檔案填進模板，輸出成單一 HTML 網站。\n\n## 開始前一次問完\n1. **科目與考試**：科目名稱，這次是期中、期末或合併，以及考試日期（不確定可以先空著，網站上可以改）。合併（全範圍）時依今年大綱把每個單元歸到期中或期末，兩次都有教的單元兩邊都列，網站首頁會出現「考試範圍：期中考／期末考」篩選鈕。\n2. **資料**：請我上傳今年講義、課程大綱（有的話）、考古題，並問考古題有沒有參考答案；有共筆詳解、教科書節錄或老師補充檔也一起附上。我附的每一份都是有效來源，答案與詳解的依據以今年講義為優先、其他資料補充，每一處都要寫清楚依據哪一份；我也可能在對話裡直接口述補充。沒有 template.html 或沒有教材，就先跟我要，不要自己編題目。\n3. **風格**：請我用文字描述想要的感覺，例如「簡潔清爽」「柔和粉彩」「沉穩專業」，或給顏色碼、參考網站。先整理成配色摘要（主色、強調色、背景、主要按鈕色、深色模式）給我確認再開工。\n4. **標題區**：學校、系級、學期、作者署名；不想寫的留空，網站上就不顯示那一項。\n5. **版本號**：沒指定就用 v1.0。\n\n我說「開始製作」前，只確認收到哪些檔案、各歸哪一類。\n\n## 題庫規則\n1. 只收考古題（與講義內附的國考題）。不自己出題，也不收講義自編題。\n2. 範圍依今年講義實際內容判斷；題目與選項對不上、原卷缺頁的題目排除。每一份考卷都要逐題過一遍：往年期中卷裡考點屬這次期末範圍的題目也要收，反之亦然。\n3. 每份考卷列出收錄情形：原卷題數、收錄題數、排除題號與原因（寫進 `papers.raw`、`excluded`）。\n4. 題目依內容歸單元，單元代號用講義章節 L01、L02…。\n5. 重複題合併成一題並列出所有出處；改寫成情境題或選項換順序，但考點與正解相同的也合併；問法相反（屬於／不屬於）算新題。\n6. 答案依參考答案並對照詳解；和講義矛盾時依講義，`n` 以「⚠️」開頭說明。沒有參考答案的標「依講義判斷」。\n7. 題目標明「複選」或「多選」才做成多選（`m:1`，題幹結尾標「（多選）」）；沒標明但有多個正解的，選到任一個就算對。\n8. 題目 `id` 等於第一個出處，之後不能改；新出處只能加在 `src` 後面。\n9. **題幹與選項完全照原卷原文，不論原文是什麼語言**：全英文維持全英文，全中文維持全中文，中英混雜就照原樣；不改寫、不翻譯、不補中英對照、不統一格式、不修潤用字，標點與大小寫都照原卷（缺漏的處理見第 10 條）。非選題的題幹同一條規則。**只有詳解、核心觀念、觀念卡與非選題的參考答案**裡的專有名詞寫成「英文(中文)」，例：Levodopa(左旋多巴)。\n10. **缺漏自補**：原卷題幹或選項有缺字、印刷不清、漏印選項時，先用同一題的其他卷別補，沒有再依今年講義或參考答案補；補上的文字用〔 〕括起來，其餘照原文，`n` 寫明補了什麼、依據哪份資料的第幾頁。補不出可靠內容的題目不收，寫進 `excluded`。補過的題號都要在回報列出來讓我對照原卷。這是除了合併題之外，唯一可以動原卷文字的情況。\n11. 題目有附圖（例如「如下圖，哪一個是…」）時，**直接取出原卷裡的原始圖檔**放進該題的 `img`，畫質最好也不會截歪：docx 用 `pandoc --extract-media` 抽文字，圖會出現在題目原本的位置；PDF 先用 PyMuPDF 取出內嵌圖檔，依圖在頁面上的位置對到題號（每頁都出現的背景、校徽略過）。圖上另外疊了標號、文字框或箭頭時，原始圖檔裡沒有這些，改用 PyMuPDF 依那張圖在頁面上的位置、以原圖的解析度把那一區連同標註一起渲染出來（位置取自 PDF 本身，不會截歪）；圖不是獨立圖檔（掃描整頁、向量繪圖、被切成很多小塊）時也這樣渲染裁切。逐張看過確認對到正確題目，壓成寬 600px 以內的 JPEG，以 data URI 放進 `img`；真的取不到圖才排除，回報時請我對照原卷。**選項本身是圖**（例如「下列哪一張是…」）時，把各選項的圖照原卷順序排成一張（2×2 或一排），每張圖旁標上大字 A、B、C、D，合成一張圖放進 `img`（題幹本來也有圖就放在它後面），`o` 寫成 `[\"見圖 A\",\"見圖 B\",…]`，逐選項詳解先講那張圖是什麼再解釋對錯，`n` 註明選項原為圖片。\n\n## 題型判斷\n抽完考卷文字後，**自己逐題判斷是選擇題還是非選題，不要問我**：\n- 原卷的分段標題最準（「一、單選題」「三、非選題」「問答題」「填充題」），標題下的題目照那一段的題型。\n- 題幹後面有 (A)(B)(C)(D)、A. B. C. D.、①②③④ 之類的並列選項 → 選擇題。\n- 沒有選項、題幹是「試述／說明／比較／列舉／何謂／請寫出／名詞解釋」或帶配分要寫文字 → 非選題。\n- 參考答案是單一字母 → 選擇題；是一段文字或分點 → 非選題。\n- 是非題當選擇題（選項照原卷用字）；填充題當非選題（一格一個要點）；配對題當選擇題（名單當選項，每小題一題）；原卷標多選的用 `m:1`。\n- 一題裡又有選擇又有問答就拆成兩題，題號加 a／b，並在 `n` 說明來自同一題。\n- 判不出來的預設做成非選題，不要自己生選項，最後回報時列出來讓我對照原卷。\n\n## 非選題（簡答／問答）\n考卷有非選題（簡答、問答、試述…）時也要收，和選擇題放在同一個 `qs` 陣列，用 `w:1` 標記。非選題在網頁上是**單字卡**：看題幹 →自己答 →按「看參考答案」→自評「我答得出來／部分答對／答不出來」，自評結果和選擇題共用同一個錯題本與記憶曲線（部分答對和答不出來都算答錯）。\n\n非選題的欄位：`w:1`、`ans`（參考答案要點陣列，照得分點拆，一點一句，必填）、`kw`（關鍵字，可省）、`e`（整體詳解，一段一個字串，可省；不是逐選項詳解）、`ansImg`（參考答案的示意圖，翻卡後才顯示，可省；題目要看的圖放 `img`，答案圖放 `ansImg`，不要放錯讓人翻卡前就看到答案），**不要給 `o`、`a`、`m`**。出處題號用 E 開頭（例 `11401M-E1`），網頁會顯示成「非選第 1 題」。\n\n`ans` 要寫成自己對照得分的樣子：每一點是完整句子，看了就知道自己有沒有寫到，不要只寫一個名詞。\n\n## 組裝\n`site.storageKey` 與 `site.dbDoc` 取一個這個網站專用的名字（英數小寫加連字號），發布後永遠不要改，否則大家的作答紀錄會接不上。寫好之後用這段程式組成網站：\n\n```python\nimport json,re\nt=open('template.html',encoding='utf-8').read()\nD=json.load(open('data.json',encoding='utf-8'))\ndata=json.dumps(D,ensure_ascii=False,separators=(',',':')).replace('<','\\\\u003c')\ntheme=open('theme.css',encoding='utf-8').read()\ndef put(pat,new):\n    global t; t,n=re.subn(pat,lambda m:new,t,count=1,flags=re.S); assert n==1,pat\nput(r'(?<=\u003cscript id=\"site-data\" type=\"application/json\">).*?(?=<\/script>)',data)\nput(r'(?<=<style id=\"theme\">).*?(?=<\/style>)','\\n'+theme+'\\n')\nput(r'(?<=<title>).*?(?=<\/title>)',D['site']['title'])\nopen('index.html','w',encoding='utf-8').write(t)\n```\n\n## 完成前檢查\n1. 用程式檢查 data.json：題目 id 不重複、每題詳解數等於選項數、答案在選項內、單元／年份／答案來源／觀念卡都有對應。\n2. 用手機與電腦寬度實際點過：開始練習、作答、上一題、跳題、收藏、錯題本與收藏本的勾選與輸出、下載 PDF（錯題本、收藏本、完整題庫勾選、總檢討的這輪錯題都有，產生 A4 自我測驗 PDF：下載前選「考卷＋解答分開」或「題目與答案同頁（答案在虛線下方）」，兩種都要試、中文正常、一題不跨頁、可離線）、完整題庫（篩選考卷、搜尋、展開答案、勾選收藏與輸出）、清除紀錄與復原、考試倒數修改、進度備份的下載與上傳（合併、取代、復原），確認沒有錯誤訊息、沒有左右捲動，淺色與深色模式都好讀。\n3. 發布成可以分享的網頁（在 Claude 發布時，要開啟儲存作答紀錄的 db、user 與「下載網站模板」「下載離線版」用的 downloads 權限）。網站首頁的「下載離線版」會把整個網站打包成一個 HTML 檔，斷網也能用，模板已內建，不用另外做。首頁的「進度備份」可以把作答紀錄、收藏與考試日期下載成一個 .json 檔，上傳時選「合併」或「取代」（可復原，別的網站的進度檔會被拒收），用來換裝置或在線上版與離線版之間搬進度，同樣是模板內建、用同一個 downloads 權限，不用另外做。之後要修改時只改 data.json 或 theme.css 再重新組裝，並先問我新的版本號。\n4. 回報：總題數、各單元題數、各份考卷收錄情形、依講義改答的題目、需要我對照原卷的圖片題，以及測試過與沒測到的部分。\n\n## data.json 規範（exam-quiz-site/1）\n\n網站＝模板（固定程式）＋ data.json（這一科的內容）＋ theme.css（風格）。只寫 data.json 與 theme.css，不改模板。所有文字用台灣繁體中文；`info`、`coverageExtra.note`、`coverageNote` 可含簡單 HTML，其餘一律純文字。\n\n用工具組 build 時，`build.py` 會先跑 `scripts/validate.py` 檢查這份規範：❌ 錯誤（網站會壞掉或違反規範）就不輸出網站；⚠️ 提醒（例如相同的選項文字、正解詳解沒以「正確：」開頭）照樣輸出，確認是故意的就可以留著。\n\n### 最上層\n```json\n{\n \"schema\": \"exam-quiz-site/1\",\n \"site\": {...}, \"info\": [...], \"answerSources\": {...}, \"exams\": [...],\n \"units\": [...], \"lectures\": [...], \"yearGroups\": [...], \"yearLabels\": {...},\n \"papers\": {...}, \"excluded\": {...}, \"alias\": {}, \"coverageExtra\": [...], \"coverageNote\": \"\",\n \"qs\": [...], \"topics\": {...}\n}\n```\n**必填**：`site`、`units`、`exams`、`yearGroups`、`yearLabels`、`papers`、`answerSources`、`qs`。其餘可省略（省略時當成空的）。\n\n### site（網站設定）\n| 欄位 | 說明 |\n|---|---|\n| title | **必填**。網頁名稱（瀏覽器分頁與 Artifact 標題），例 `學校科目期中刷題_學期_作者_v1.0` |\n| h1 / h1em | h1 **必填**，h1em 可省。大標，h1em 會用強調色顯示，例 `\"病理學期中\"`、`\"刷題\"` |\n| version | **必填**。例 `v1.0`，顯示在大標後的小字；改版時與 title 一起改 |\n| band | **必填**，最多兩段文字的陣列。標籤帶左右兩段文字：`[\"學校・科目・系級・學期・by 作者\", \"期中範圍 L01–L07\"]`，空著的項目省略 |\n| deco | 可省（＝none）。大標右側裝飾：`\"pill\"`（膠囊）／`\"tissue\"`（玻片圓）／`\"none\"` |\n| storageKey | **必填**。瀏覽器存檔前綴，英數小寫加連字號，例 `school-patho-mid`。**發布後永遠不可改**，否則使用者進度會不見 |\n| dbDoc | **必填**。帳號存檔名稱，例 `progress-mid`。**發布後永遠不可改** |\n\n### info（「網頁說明」段落）\n`[{\"h\":\"收錄範圍\",\"t\":\"…共 {total} 題…\"}, {\"h\":\"答案來源\",\"t\":\"…\"}, {\"h\":\"功能\",\"t\":\"…\"}]`；`{total}` 會換成題數。\n\n### answerSources（答案來源標籤）\n每題的 `as` 指向這裡。每個來源都要有 `label`；`cls`：`ok` 綠、`multi` 黃、`chk` 灰（可省，＝chk）。\n```json\n{\"official\":{\"label\":\"已對照參考答案\",\"cls\":\"ok\"},\"lecture\":{\"label\":\"依講義判斷\",\"cls\":\"chk\"}}\n```\n\n### exams（考試倒數）\n`[{\"key\":\"mid\",\"name\":\"期中考\",\"date\":\"2026-11-18\",\"units\":[1,2,3]}]`。**至少要有一次考試**（倒數與記憶曲線靠它）；`key` 不可重複，`date` 寫成 `YYYY-MM-DD`。units 是這次考試包含的單元 id；只有一次考試可省略 units（＝全部單元）。\n有兩次以上考試都寫了 units 時（例：期中＋期末的全範圍網站），首頁「選擇範圍」卡會多一排「考試範圍」按鈕（按鈕文字＝name），點一下就改選那次考試的全部單元。期中期末都有教的單元，兩次考試的 units 都要列（例：腹部 `[...,5]` 同時出現在期中與期末）；記憶曲線排程以陣列中最後一次列到它的考試為準，所以 exams 依考試日期由早到晚排。\n\n### units（單元）\n`[{\"id\":1,\"code\":\"L01\",\"name\":\"細胞損傷\",\"sub\":\"9/10・講義全名・老師\"}]`。id 為整數（不是字串 `\"1\"`）、不可重複、排序依陣列順序；code、name 必填，code 用講義章節代號；sub 是單元卡上的說明小字，可省。\n\n### lectures\n「上課講義對照章節」每行一筆：`\"L01_講義章節全名_9/10\"`。\n\n### 年份與考卷\n- `yearLabels`：年份 key → 按鈕文字，例 `{\"1141\":\"1141 牙醫\",\"M1141\":\"1141中 牙醫\",\"N1141\":\"1141 國考\"}`。\n- `yearGroups`：年份按鈕分組與順序，每組要有 `label` 與 `years`，例 `[{\"label\":\"期中卷\",\"years\":[\"1141\",\"1132\"]},{\"label\":\"國考\",\"years\":[\"N1141\"]}]`；每個年份只能出現在一組。\n- `papers`：考卷代碼 → `{\"year\":\"1141\",\"raw\":50,\"suffix\":\"\"}`。代碼就是出處 `src` 的 `-` 前面那段（例 `11401M`）；代碼**不能含 `-`**；`year` 必填，要是 `yearLabels` 裡的 key；`raw` 是原卷題數（整數，不知道就填 null 或省略），有填的才會列在「各份考卷收錄情形」表格；`suffix` 接在出處名稱後（例國考填 `\"牙醫學（二）\"`）。\n- `excluded`：沒收錄的題目 `{\"11401M-36\":\"題幹與選項不符\"}`，會列在收錄情形。\n- `coverageExtra`：收錄情形表格的額外列（`name`、`prefix` 必填），算的是年份 key 以 `prefix` 開頭的題目：`{\"name\":\"國考\",\"prefix\":\"N\",\"papers\":\"10 份\",\"note\":\"…{units}…\"}`；`papers` 留 null 會自動算份數，`{units}` 換成涉及的單元代號，`{n}` 換成題數。\n- `coverageNote`：表格下方的說明。\n- `alias`：題目 id 改名時 `{\"舊id\":\"新id\"}`，讓舊紀錄接上；平常留 `{}`。\n\n### qs（題目）\n```json\n{\"id\":\"11401M-9\",\"u\":1,\"ys\":[\"1141\",\"1132\"],\"src\":[\"11401M-9\",\"11302M-8\"],\n \"q\":\"題幹（照原卷原文）\",\"o\":[\"選項A\",\"選項B\",\"選項C\",\"選項D\"],\"a\":[\"A\"],\n \"e\":[\"正確：…（引講義細節）\",\"…為什麼錯\",\"…\",\"…\"],\"m\":0,\n \"k\":{\"白\":\"白話說明\",\"專\":\"專業術語版\",\"錯\":\"易錯點\"},\"t\":[\"topicKey\"],\"n\":\"附註\",\"as\":\"lecture\"}\n```\n| 欄位 | 說明 |\n|---|---|\n| id | ＝第一個出處 `src[0]`，是作答紀錄的 key，**發布後不可改** |\n| u | 單元 id（要在 units 裡） |\n| ys | 出現過的年份 key，非空陣列，每個都要在 yearGroups 裡（選年份時只要其中一年被選就會出題） |\n| src | 所有出處，非空陣列，格式「考卷代碼-題號」（剛好一個 `-`，代碼要在 papers 裡）；新出處只能加在後面 |\n| q / o | 題幹與選項，照原卷原文，不改寫、不翻譯；2–5 個選項 |\n| a | 正解字母陣列 |\n| m | 1＝多選題（題幹結尾標「（多選）」，全選對才算對）；0＝單選。`m` 為 0 但 `a` 有多個時，選到任一正解即算對 |\n| e | 逐選項詳解，數量＝選項數；正解以「正確：」開頭（沒有會出 ⚠️ 提醒）；專有名詞寫成「英文(中文)」 |\n| k | 可省。核心觀念物件，只認三個 key：白（白話）、專（專業術語）、錯（易錯） |\n| t | 可省。相關觀念卡 key 陣列，每個都要在 topics 裡 |\n| n | 可省。附註文字；以「⚠️」開頭會加上「依講義改答」標籤 |\n| as | 答案來源，對應 answerSources |\n| w | `1`＝非選題（見下一節）；選擇題不給這個欄位。`ans`、`kw`、`ansImg` 只能用在非選題 |\n| img | 題目附圖（可省）：data URI 字串陣列（`data:image/jpeg;base64,…`），顯示在題幹下方；網站是單一檔案，圖片要內嵌，建議先壓成寬 600px 以內的 JPEG。圖要優先取原卷的原始圖檔（docx 的 word/media、PDF 的內嵌圖），不是獨立圖檔時才截圖裁切。選項本身是圖的題目，把選項圖照原卷順序合成一張（每張標上大字 A、B、C、D）放進 img，`o` 寫 `[\"見圖 A\",\"見圖 B\",…]`。選項是圖上標號（1、2、3…）的看圖題用它放原卷的圖 |\n\n### 非選題（簡答／問答，做成單字卡）\n同一個 `qs` 陣列裡用 `w:1` 標記；沒有選項與正解，改成「翻卡自評」。\n```json\n{\"id\":\"11401M-E1\",\"u\":1,\"w\":1,\"ys\":[\"1141\"],\"src\":[\"11401M-E1\"],\n \"q\":\"試述…（10 分）（照原卷原文）\",\n \"ans\":[\"要點一（完整句子，看得懂就能對照）\",\"要點二\",\"要點三\"],\n \"kw\":[\"necrosis\",\"apoptosis\"],\n \"e\":[\"整體詳解段落一\",\"段落二\"],\n \"k\":{\"白\":\"…\",\"專\":\"…\",\"錯\":\"…\"},\"t\":[],\"n\":\"\",\"as\":\"official\"}\n```\n| 欄位 | 說明 |\n|---|---|\n| w | `1`＝非選題。不給就是選擇題 |\n| ans | **必填**，參考答案的要點陣列，照得分點拆開，一點一句；網頁會編號列出 |\n| kw | 關鍵字（可省）。未翻卡前有「看關鍵字提示」按鈕，翻卡後列在參考答案下面 |\n| e | 整體詳解（可省）。**數量不必等於任何東西**，一段一個字串；不是逐選項詳解 |\n| ansImg | 參考答案附圖（可省）：data URI 字串陣列，翻卡後顯示在參考答案下面，**翻卡前看不到**。用來放參考答案的示意圖（例如窩洞修形圖、作圖題的解答圖）；題目本身要看的圖放 `img`，不要把答案圖放進 `img` 以免翻卡前就看到答案 |\n| o / a / m | **不可給**（連空陣列、`m:0` 都不要寫）。非選題沒有選項、沒有正解字母，也不能標多選 |\n| 其他 | `id`、`u`、`ys`、`src`、`k`、`t`、`n`、`as` 和選擇題完全一樣 |\n\n出處題號用 **`E` 開頭**（`11401M-E1`），網頁會顯示成「1141 牙醫 非選第 1 題」；`id` 仍然等於 `src[0]`，發布後不可改。\n\n作答方式：看題幹 → 自己答 →「看參考答案」→ 自評「我答得出來／部分答對／答不出來」。自評寫進和選擇題同一份作答紀錄，所以錯題本、收藏本、記憶曲線、錯題輸出、進度統計全部共用：**「部分答對」與「答不出來」都算答錯**，會進錯題本、隔天再出現。\n\n首頁「選擇範圍」卡下面會自動出現「題型：全部／只選擇題／只非選題」。**資料裡沒有任何 `w:1` 的題目時，這排不會出現**，舊科目的網站外觀完全不變。\n\n### topics（觀念卡）\n`{\"key\":{\"t\":\"卡片標題\",\"s\":\"L03 單元名\",\"k\":[\"一次看懂的知識點\",…],\"c\":[\"易混淆點\",…]}}`；四個欄位都要有，`k`、`c` 是陣列。\n\n### theme.css（風格）\n只放 CSS 變數，模板不用改。淺色寫在 `:root{}`，深色寫兩次：`@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){…}}` 與 `:root[data-theme=\"dark\"]{…}`。\n| 變數 | 用途 |\n|---|---|\n| --bg、--grid | 頁面底色、背景格線 |\n| --surface、--surface2、--line | 卡片底、次要底、框線 |\n| --ink、--muted | 主文字、次要文字 |\n| --hema、--hema-soft | 主色（主要按鈕、選取） |\n| --eosin、--eosin-soft | 第二強調色（題號、觀念） |\n| --label、--label-ink、--label-soft | 標籤帶、輸出按鈕與倒數方塊的強調色 |\n| --good/-soft、--bad/-soft、--warn/-soft | 答對、答錯、提醒 |\n| --hand、--body、--mono | 標題字、內文字、數字字型 |\n| --r | 卡片圓角 |\n"/*/PROMPT*/;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function inYears(q){return q.ys.some(y=>state.years.has(y));}
function srcOf(s){
  const [y,n]=s.split("-");const w=/^E\d+$/.test(n);
  return `${YFULL[y]||y}${PSUF[y]||""} ${w?"非選第 "+n.slice(1)+" 題":"第 "+n+" 題"}`;}

/* ---------- exams & spaced review ---------- */
const EXAMS={},EORDER=[],UEXAM={};for(const e of D.exams){EXAMS[e.key]={n:e.name,d:e.date};EORDER.push(e.key);for(const u of (e.units||UORDER))UEXAM[u]=e.key;}
const LADDER=[1,2,4,7,14,30,60];
const WD="日一二三四五六";
const DAY=864e5;
function today(){const n=new Date();return Math.floor((n.getTime()-n.getTimezoneOffset()*6e4)/DAY);}
function dn(ms){const n=new Date(ms);return Math.floor((ms-n.getTimezoneOffset()*6e4)/DAY);}
function dnStr(s){const [y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY);}
function dnLabel(d){const x=new Date(d*DAY);return `${x.getUTCMonth()+1}/${x.getUTCDate()}（${WD[x.getUTCDay()]}）`;}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function examDate(k){return (X[k])||EXAMS[k].d;}
function examDay(k){return dnStr(examDate(k));}
function lastExam(){return EORDER.reduce((a,k)=>examDay(k)>=examDay(a)?k:a);}
function nextExam(){const T=today();return EORDER.find(k=>examDay(k)>=T)||null;}
function scopeQs(k){return QS.filter(q=>UEXAM[q.u]===k);}
function nextIv(iv,slow){const f=LADDER.find(x=>x>iv)||Math.round(iv*2);return slow?Math.min(f,Math.max(iv+1,Math.ceil(iv*1.25))):f;}
function sched(p){/* old records (before v3) have no schedule: derive one */
  if(p.due!=null) return {iv:p.iv||0,due:p.due};
  const at=dn(p.t||Date.now());
  if(p.l!==1) return {iv:0,due:at};
  const iv=LADDER[Math.min(Math.max((p.c||1)-1,0),LADDER.length-1)];return {iv,due:at+iv};}
function effDue(q){const p=P[q.id];if(!p)return null;let due=sched(p).due;
  const ed=examDay(UEXAM[q.u]),T=today();
  if(ed>T&&due>ed-1){const lo=dn(p.t||Date.now())+1,hi=ed-1;due=hi<lo?hi:lo+hash(q.id)%(hi-lo+1);}
  return due;}
function capDue(q,iv){const T=today(),ed=examDay(UEXAM[q.u]),E=ed-T;
  if(E>=2) return Math.min(T+Math.min(iv,Math.max(1,Math.floor(E/2))),ed-1);
  if(E===1) return T+Math.min(iv,1);
  return T+iv;}
function isDue(q){const d=effDue(q);return d!=null&&d<=today();}
function weak(q){const p=P[q.id];if(!p)return 2;if(p.l===0)return 5;if(p.g)return 4;if(p.sl)return 3;if((p.c||0)<=1)return 1;return 0;}
function dueText(d){const n=d-today();return n<=0?"今天":n===1?"明天（"+dnLabel(d)+"）":n+" 天後（"+dnLabel(d)+"）";}

/* ---------- progress: db (private per person) + localStorage backup ---------- */
const SK=D.site.storageKey;const LS_KEY=SK+"-progress-v1",FAV_KEY=SK+"-fav-v1",PREF_KEY=SK+"-prefs-v1",X_KEY=SK+"-exam-v1";
let P={},FAV={},X={},docRef=null,saving=false,pendingSave=false,saveTimer=null;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsWrite(){lsSet(LS_KEY,P);lsSet(FAV_KEY,FAV);lsSet(X_KEY,X);}
function merge(a,b){const out={...a};for(const k in b){const x=out[k],y=b[k];if(!x||((y&&y.t)||0)>((x&&x.t)||0))out[k]=y;}return out;}
async function initStore(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u) return;
    const uid=await u.id(); if(!uid) return;
    docRef=d.doc("data/users/"+uid+"/"+D.site.dbDoc);
    const snap=await docRef.get();
    const d0=(snap.exists&&snap.data())||{};const remote=d0.p||{};const rf=d0.f||{};const rx=d0.x||{};
    const before=JSON.stringify([remote,rf,rx]);
    P=merge(remote,P);FAV=Object.assign({},rf,FAV);applyAlias();if((rx.t||0)>(X.t||0))X=rx;lsWrite();
    if(JSON.stringify([P,FAV,X])!==before) save();
    if(state.screen==="setup"){autoCram();render(true);}
  }catch(e){docRef=null;}
}
async function save(){
  lsWrite();
  if(!docRef) return;
  if(saving){pendingSave=true;return;}
  saving=true;
  try{await docRef.set({p:P,f:FAV,x:X,updated:Date.now()});}catch(e){}
  saving=false;
  if(pendingSave){pendingSave=false;save();}
}
function saveSoon(){lsWrite();clearTimeout(saveTimer);saveTimer=setTimeout(save,1200);}

const PG_SITE=SK,PG_BTN={p:"xbtn",s:"ghost"};
const PG_MERGE="兩邊的紀錄都留下，同一題取較新的那次作答（記憶曲線排程跟著它），收藏兩邊加起來，考試日期取較新改的那次。";
function progGet(){return pgClone({p:P,f:FAV,x:X});}
function progCount(d){d=d||{};return `${Object.keys(d.p||{}).length} 題作答紀錄、${Object.keys(d.f||{}).length} 題收藏`;}
function progApply(d,mode){d=pgClone(d);const p=d.p||{},f=d.f||{},x=d.x||{};
  if(mode==="replace"){P=p;FAV=f;X=x;}

function buildList(onlyIds){
  const pool=onlyIds?QS.filter(q=>onlyIds.includes(q.id)):QS.filter(q=>state.units.has(q.u)&&inYears(q)&&inQT(q));
  if(onlyIds) return shuffle(pool).sort((a,b)=>UORDER.indexOf(a.u)-UORDER.indexOf(b.u));
  const unseen=shuffle(pool.filter(q=>!P[q.id]));
  const wrong=shuffle(pool.filter(q=>P[q.id]&&P[q.id].l===0));
  const right=pool.filter(q=>P[q.id]&&P[q.id].l===1).sort((a,b)=>(P[a.id].t||0)-(P[b.id].t||0));
  let ordered;
  if(state.order==="due"){const T=today();ordered=shuffle(pool.filter(q=>P[q.id]&&effDue(q)<=T)).sort((a,b)=>effDue(a)-effDue(b)||weak(b)-weak(a));}
  else if(state.order==="cram") ordered=shuffle(pool.slice()).sort((a,b)=>weak(b)-weak(a)||((P[a.id]||{}).c||0)-((P[b.id]||{}).c||0));
  else if(state.order==="only") ordered=unseen;
  else if(state.order==="new") ordered=[...unseen,...wrong,...right];
  else if(state.order==="wrong") ordered=[...wrong,...unseen,...right];
  else ordered=shuffle(pool.slice());
  const n=state.count==="all"?ordered.length:Math.min(state.count,ordered.length);
  return ordered.slice(0,n).sort((a,b)=>UORDER.indexOf(a.u)-UORDER.indexOf(b.u));

function exportText(qs){
  return qs.map((q,i)=>{
    const lines=[];
    lines.push(`【出處】${q.src.map(srcOf).join("；")}`);
    lines.push(`【單元】${UNITS[q.u][0]} ${UNITS[q.u][1]}`);
    lines.push(`【題幹】${q.q}`);if((q.img||[]).length)lines.push(`【附圖】本題有附圖，請開網站查看`);if((q.ansImg||[]).length)lines.push(`【參考答案附圖】請開網站查看`);
    if(isW(q)){
      lines.push(`【題型】非選題`);
      (q.ans||[]).forEach((a,k)=>lines.push(`【參考答案${k+1}】${a}`));
      if((q.kw||[]).length)lines.push(`【關鍵字】${q.kw.join("、")}`);
      if((q.e||[]).length){lines.push(`【詳解】`);q.e.forEach(e=>lines.push(e));}
    }else{
      OPT(q).forEach((o,k)=>lines.push(`(${LET[k]}) ${o}`));
      lines.push(`【答案】${q.a.join("、")}`);
      lines.push(`【詳解】`);
      (q.e||[]).forEach((e,k)=>lines.push(`(${LET[k]}) ${e}`));
    }
    if(q.n) lines.push(`【註】${q.n}`);
    return "===\n"+lines.join("\n")+"\n===";
  }).join("\n");
}

const PDFF='"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC","Noto Sans CJK TC",sans-serif';
const PDFS={h:[30,800,"#1d3557",46,0],sm:[21,400,"#6b6b6b",32,0],p:[27,500,"#111",42,0],opt:[26,400,"#222",40,18],ok:[26,800,"#17803d",40,18],lab:[25,800,"#a86b00",40,0],ex:[23,400,"#333",35,18],note:[22,400,"#555",34,0],key:[25,700,"#111",44,0]};
function pdfWrap(ctx,s,maxW){const out=[];for(const para of String(s).split("\n")){const tk=para.match(/[A-Za-z0-9À-ɏͰ-Ͽ.,;:%'’+\-\/=<>]+|\s+|[\s\S]/gu)||[""];let line="";
  const pushTok=t=>{if(ctx.measureText(line+t).width<=maxW||!line.trim()){if(ctx.measureText(t).width>maxW&&!line.trim()){for(const c of t){if(ctx.measureText(line+c).width>maxW&&line){out.push(line);line="";}line+=c;}}else line+=t;}else{out.push(line.replace(/\s+$/,""));line=/^\s+$/.test(t)?"":t;}};
  tk.forEach(pushTok);out.push(line.replace(/\s+$/,""));}return out;}
function pdfLoadImg(src){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src;});}
async function pdfRender(items,mode,title,sub,onStep){

  const sep=()=>{ctx.strokeStyle="#d9d9d9";ctx.lineWidth=2;ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(M,y+8);ctx.lineTo(W-M,y+8);ctx.stroke();y+=30;};
  const IMC=new Map(),img=async s=>{if(!IMC.has(s))IMC.set(s,await pdfLoadImg(s));return IMC.get(s);};
  const isz=(im,b)=>{let w=Math.min(CW,im.naturalWidth*1.6),h=im.naturalHeight*w/im.naturalWidth;const mh=(mode==="split"&&b.hs)||b.h||700;if(h>mh){h=mh;w=im.naturalWidth*h/im.naturalHeight;}return [w,h];};

    if(b.t==="imgl"){const im=await img(b.s);if(!im)return lnH(b.lines);const r=Math.min(1,CW*0.56/isz(im,b)[0]);return Math.max(isz(im,b)[1]*r+20,lnH(b.lines));}if(b.t==="line")return (b.s?38:0)+60*(b.n||1)+18;if(b.t==="box")return 80;if(b.t==="cut")return 66;
    ctx.font=font(b.t);return pdfWrap(ctx,b.s,CW-PDFS[b.t][4]).length*PDFS[b.t][3]+(b.t==="h"?2:6);};

      const x0=M+w+36,y0=y;let yy=y;ctx.setLineDash([]);for(const l of b.lines){ctx.font=font("lab");ctx.fillStyle=PDFS.lab[2];ctx.fillText(l.s,x0,yy+28);yy+=38;ctx.strokeStyle="#b5b5b5";ctx.lineWidth=1.5;

      ctx.strokeStyle="#b5b5b5";ctx.lineWidth=1.5;ctx.setLineDash([]);for(let k=0;k<n;k++){y+=lh;ctx.beginPath();ctx.moveTo(M,y);ctx.lineTo(W-M,y);ctx.stroke();}y+=18;return;}
    if(b.t==="box"){if(y+84>BOT)newPage();ctx.font=font("lab");ctx.fillStyle=PDFS.lab[2];const s=b.s+"：";ctx.fillText(s,M,y+46);const tw=ctx.measureText(s).width;ctx.strokeStyle="#9a9a9a";ctx.lineWidth=2;ctx.setLineDash([]);ctx.strokeRect(M+tw+12,y+8,260,58);y+=80;return;}
    if(b.t==="cut"){if(y+70>BOT)newPage();const ly=y+30,tx="以下是答案（摺起或用紙遮住，自己答完再看）";ctx.font=`700 22px ${PDFF}`;const tw=ctx.measureText(tx).width;
      ctx.save();ctx.setLineDash([14,10]);ctx.strokeStyle="#8a8a8a";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W/2-tw/2-18,ly);ctx.moveTo(W/2+tw/2+18,ly);ctx.lineTo(W,ly);ctx.stroke();ctx.restore();

    for(let i=0;i<ls.length;i++){if(y+lh>BOT){newPage();ctx.font=font(b.t);}ctx.fillStyle=col;ctx.fillText(ls[i],M+(i?ind:0),y+fs);y+=lh;}

  ctx.fillStyle="#6b6b6b";ctx.font=`400 24px ${PDFF}`;pdfWrap(ctx,sub,CW).forEach(l=>{ctx.fillText(l,M,y+28);y+=36;});y+=20;

function fmtT(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
setInterval(()=>{if(state.screen!=="quiz"||state.locked)return;const el=document.getElementById("qtimer");if(el)el.textContent="⏱ 作答中 "+fmtT(elapsed());},500);

function elapsed(){return (state.qacc+(state.qt0!=null?performance.now()-state.qt0:0))/1000;}
document.addEventListener("visibilitychange",()=>{if(state.screen!=="quiz"||state.locked)return;

function record(q){
  if(state.recorded.has(q.id)) return;
  state.recorded.add(q.id);
  const secs=elapsed();state.qtime[q.id]=secs;
  const ok=isRight(q,state.ans[q.id]);const o=P[q.id]||{s:0,c:0};
  const base=o.s?sched(o).iv:0;
  const W=isW(q);const valid=secs>0.5&&secs<=(W?300:120),chars=Math.max(20,q.q.length+OPT(q).join("").length),r=secs/chars;
  const sp=X.sp||{r:0,n:0};
  const slow=!W&&ok&&valid&&sp.n>=8&&secs>12&&r>1.8*sp.r;
  if(valid&&!W){X.sp={r:sp.n?sp.r*0.85+r*0.15:r,n:sp.n+1};X.t=Date.now();}
  const iv=ok?nextIv(base,slow):0;
  const due=ok?capDue(q,iv):today()+1;
  const rec={s:o.s+1,c:o.c+(ok?1:0),l:ok?1:0,t:Date.now(),iv,due};
  if(W&&(state.ans[q.id]||[])[0]==="H")rec.h=1;
  if(valid)rec.ts=Math.round(secs);if(slow)rec.sl=1;
  P[q.id]=rec;state.info[q.id]={slow,rec:{...rec}};saveSoon();
}

  if(b.dataset.flip){state.flip.add(b.dataset.flip);render(true);return;}
  if(b.dataset.self){const q=state.list[state.i];if(!q||state.locked||!isW(q))return;state.ans[q.id]=[b.dataset.self];state.locked=true;record(q);render(true);return;}
  if(b.id==="confirm"){const q=state.list[state.i];if(!(state.ans[q.id]||[]).length)return;state.locked=true;record(q);render(true);return;}
  if(b.dataset.nav==="next"){if(state.i<state.list.length-1)goTo(state.i+1);else finish();return;}
  if(b.id==="prev"){if(state.i>0)goTo(state.i-1);return;}
  if(b.dataset.go!==undefined){goTo(+b.dataset.go);return;}
  if(b.id==="quit"){finish();return;}
  if(b.dataset.guess){toggleGuess(b.dataset.guess);return;}
  if(b.id==="cdEdit"){state.cdedit=true;render(true);return;}
  if(b.id==="cdCancel"){state.cdedit=false;render(true);return;}
  if(b.id==="cdSave"){const k=b.dataset.k,v=($("#cdDate")||{}).value;if(!/^\d{4}-\d{2}-\d{2}$/.test(v||"")){toast("請選一個日期");return;}
    if(v===EXAMS[k].d)delete X[k];else X[k]=v;X.t=Date.now();state.cdedit=false;save();render(true);toast("考試日期已更新，排程會照新日期調整");return;}
  if(b.id==="cdReset"){const k=b.dataset.k;delete X[k];X.t=Date.now();state.cdedit=false;save();render(true);toast("已恢復課程大綱的日期");return;}
  if(b.dataset.rf){state.rf=b.dataset.rf;render(true);return;}
  if(b.id==="redoWrong"){startQuiz(state.list.filter(q=>state.ans[q.id]&&!isRight(q,state.ans[q.id])).map(q=>q.id));return;}
  if(b.dataset.home){state.screen="setup";state.bmodal=null;state.xopen={};render();return;}
  if(b.dataset.xq){const q=QS.find(x=>x.id===b.dataset.xq);copyText(exportText([q]),q.id);return;}
  if(b.dataset.xcopy){const k=b.dataset.xcopy;copyText(state.xopen[k],k);return;}
  if(b.dataset.xclose){delete state.xopen[b.dataset.xclose];render(true);return;}
  if(b.id==="exportRound"){const qs=state.list.filter(q=>state.ans[q.id]&&state.ans[q.id].length&&!isRight(q,state.ans[q.id]));copyText(exportText(qs),"round");return;}
  if(b.dataset.wsort){state.wsort=b.dataset.wsort;render(true);return;}
  if(b.id==="openFavs"){state.screen="favs";state.xopen={};render();return;}
  if(b.dataset.fsort){state.fsort=b.dataset.fsort;render(true);return;}
  if(b.id==="fExport"){const qs=QS.filter(q=>state.fsel.has(q.id)).sort((a,b)=>UORDER.indexOf(a.u)-UORDER.indexOf(b.u));if(qs.length)copyText(exportText(qs),"fb");return;}
  if(b.id==="fPractice"){const ids=[...state.fsel];if(ids.length)startQuiz(ids);return;}
  if(b.id==="fRemove"){const batch=[...state.fsel].filter(id=>FAV[id]).map(id=>({id,t:FAV[id]}));if(!batch.length)return;batch.forEach(x=>delete FAV[x.id]);state.favUndo.push(batch);state.fsel=new Set();saveSoon();render(true);toast(`已取消收藏 ${batch.length} 題，可以按「↩ 復原」`,2600);return;}
  if(b.id==="favUndo"){const batch=state.favUndo.pop();if(!batch)return;batch.forEach(x=>{FAV[x.id]=x.t;state.fsel.add(x.id);});saveSoon();render(true);toast(`已復原 ${batch.length} 題收藏`);return;}
  if(b.id==="openBank"){state.screen="bank";state.xopen={};render();return;}
  if(b.dataset.byear){const y=b.dataset.byear;state.byears.has(y)?state.byears.delete(y):state.byears.add(y);render(true);return;}
  if(b.dataset.byall!==undefined){state.byears=b.dataset.byall==="1"?new Set(YEARS):new Set();render(true);return;}
  if(b.dataset.bonly){state.bonly=b.dataset.bonly;render(true);return;}
  if(b.dataset.bqt){state.bqt=b.dataset.bqt;render(true);return;}
  if(b.dataset.bsort){state.bsort=b.dataset.bsort;render(true);return;}
  if(b.dataset.bdup){state.bdup=!state.bdup;render(true);return;}
  if(b.dataset.bview){state.bmodal=b.dataset.bview;state.copen=new Set();render(true);const m=$(".bmodal");if(m)m.scrollTop=0;return;}
  if(b.dataset.bgo!==undefined){const rows=bankRows(),r=rows[+b.dataset.bgo];if(r){state.bmodal=r.s;render(true);const m=$(".bmodal");if(m)m.scrollTop=0;}return;}
  if(b.dataset.bclose){state.bmodal=null;render(true);return;}
  if(b.id==="bClear"){state.bsel=new Set();render(true);return;}
  if(b.id==="bExport"){const order=bankRows().map(r=>r.q.id),sel=[...state.bsel];const ids=[...new Set([...order.filter(id=>state.bsel.has(id)),...sel])];const qs=ids.map(id=>QS.find(q=>q.id===id)).filter(Boolean);if(qs.length)copyText(exportText(qs),"bk");return;}
  if(b.id==="bFav"){let k=0;const now=Date.now();state.bsel.forEach(id=>{if(!FAV[id]){FAV[id]=now;k++;}});saveSoon();render(true);toast(k?`已收藏 ${k} 題，可在收藏本查看`:"勾選的題目都已經收藏了",2200);return;}
  if(b.id==="bUnfav"){const batch=[...state.bsel].filter(id=>FAV[id]).map(id=>({id,t:FAV[id]}));if(!batch.length){toast("勾選的題目都沒有收藏");return;}batch.forEach(x=>delete FAV[x.id]);state.favUndo.push(batch);saveSoon();render(true);toast(`已取消收藏 ${batch.length} 題（收藏本可按「↩ 復原」）`,2600);return;}
  if(b.id==="bPractice"){const ids=[...state.bsel];if(ids.length)startQuiz(ids);return;}
  if(b.id==="openWrongs"){state.screen="wrongs";state.xopen={};render();return;}
  if(b.id==="wPdf"){const qs=QS.filter(q=>state.wsel.has(q.id)).sort((a,b)=>UORDER.indexOf(a.u)-UORDER.indexOf(b.u));pdfExport(pdfBlocksQ(qs),"錯題本",b);return;}
  if(b.id==="fPdf"){const qs=QS.filter(q=>state.fsel.has(q.id)).sort((a,b)=>UORDER.indexOf(a.u)-UORDER.indexOf(b.u));pdfExport(pdfBlocksQ(qs),"收藏本",b);return;}
  if(b.id==="bPdf"){const order=bankRows().map(r=>r.q.id);const ids=[...new Set([...order.filter(id=>state.bsel.has(id)),...state.bsel])];pdfExport(pdfBlocksQ(ids.map(id=>QS.find(q=>q.id===id)).filter(Boolean)),"題庫勾選",b);return;}
  if(b.id==="pdfRound"){const qs=state.list.filter(q=>state.ans[q.id]&&state.ans[q.id].length&&!isRight(q,state.ans[q.id]));pdfExport(pdfBlocksQ(qs),"這輪錯題",b);return;}
  if(b.id==="wExport"){const qs=QS.filter(q=>state.wsel.has(q.id)).sort((a,b)=>UORDER.indexOf(a.u)-UORDER.indexOf(b.u));if(qs.length)copyText(exportText(qs),"wb");return;}
  if(b.id==="wPractice"){const ids=[...state.wsel];if(ids.length)startQuiz(ids);return;}
});
P=lsGet(LS_KEY)||{};FAV=lsGet(FAV_KEY)||{};X=lsGet(X_KEY)||{};applyAlias();
function autoCram(){const k=nextExam();if(!k||!scopeQs(k).length)return;const E=examDay(k)-today();
  if(E<=3&&state.cramFor!==examDate(k)){state.cramFor=examDate(k);state.order="cram";savePrefs();}}
autoCram();
render();
initStore();
