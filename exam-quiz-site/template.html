<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="claude:viewport-fit-sides" content="cover"><title>__TITLE__</title>

<style id="base">
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;margin:0}

h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h2{font-family:var(--hand);font-size:1.3rem;font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;transition:background .15s,border-color .15s,transform .1s}
button:hover{border-color:var(--hema)}

button:focus-visible,label:focus-within,summary:focus-visible{outline:3px solid var(--label);outline-offset:2px}
button.primary{background:var(--hema);border-color:var(--hema);color:var(--surface);font-weight:700;padding:11px 22px}

button.ghost:hover{color:var(--hema);border-color:transparent;background:var(--hema-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:0 1px 0 var(--line)}

/* ---------- slide header ---------- */
.slide{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(20,40,90,.35)}
.slide .band{background:var(--label);color:var(--label-ink);font-family:var(--mono);font-weight:700;font-size:.78rem;letter-spacing:.06em;padding:10px 22px;display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.slide .glass{position:relative;padding:26px 22px 22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.slide h1{font-family:var(--hand);font-weight:700;font-size:clamp(2.1rem,6.4vw,3.4rem);letter-spacing:.02em;line-height:1.1}
.slide h1 em{font-style:normal;color:var(--eosin)}
.slide .lede{margin:10px 0 0;color:var(--muted);max-width:62ch;font-size:.95rem}
.tissue{width:132px;height:132px;border-radius:50%;flex:none;background:
 radial-gradient(circle at 30% 34%,var(--hema) 0 5px,transparent 6px),radial-gradient(circle at 58% 28%,var(--hema) 0 4px,transparent 5px),
 radial-gradient(circle at 70% 56%,var(--hema) 0 6px,transparent 7px),radial-gradient(circle at 40% 66%,var(--hema) 0 4px,transparent 5px),
 radial-gradient(circle at 22% 54%,var(--hema) 0 3px,transparent 4px),radial-gradient(circle at 52% 82%,var(--hema) 0 3px,transparent 4px),
 radial-gradient(circle at 50% 50%,var(--eosin-soft) 0 60%,transparent 61%),var(--surface2);
 box-shadow:inset 0 0 0 6px var(--surface),inset 0 0 0 7px var(--line)}
.slide details{grid-column:1/-1}
.pill{width:132px;height:132px;flex:none;border-radius:50%;background:var(--surface2);box-shadow:inset 0 0 0 6px var(--surface),inset 0 0 0 7px var(--line);display:flex;align-items:center;justify-content:center;transform:rotate(-35deg)}
.pill i{display:block;width:40px;height:34px;background:var(--hema);border-radius:17px 0 0 17px}
.pill i+i{background:var(--label);border-radius:0 17px 17px 0}

/* ---------- setup two-column ---------- */
.board{display:flex;flex-direction:column;gap:18px}
.dock{display:flex;flex-direction:column;gap:18px}

.unit input{position:absolute;top:14px;right:14px;width:18px;height:18px;accent-color:var(--hema)}
.unit.on{border-color:var(--hema);background:var(--hema-soft)}
.unit .date{font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--label-ink);background:var(--label);border-radius:6px;padding:1px 8px;align-self:flex-start}

.opt.sel{border-color:var(--hema);background:var(--hema-soft)}

.nextbar{display:flex;justify-content:flex-end;align-items:center;gap:10px}

/* ---------- review ---------- */
.scorecard{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.scorecard .ring{width:140px;height:140px}.scorecard .ring>div{width:108px;height:108px}.scorecard .ring b{font-size:1.9rem}

.ub{display:flex;flex-direction:column;gap:10px;min-width:0}
.ub .r{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.88rem}
.ub .r .bar{grid-column:1/-1;height:6px}
.ub .r .bar i{background:var(--good)}
.rq{border-left:5px solid var(--line)}
.rq.ok{border-left-color:var(--good)}.rq.no{border-left-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}

.slide h1 .ver{font-family:var(--mono);font-size:.3em;font-weight:700;color:var(--muted);margin-left:.45em;vertical-align:.4em;letter-spacing:0;white-space:nowrap}

<script id="app-code">

/* ---------- 離線版：按下按鈕時把網站內容與全部圖片打包成單一 HTML ---------- */
const OFFLINE=(()=>{try{const e=document.getElementById("offline-data");return e?JSON.parse(e.textContent):null;}catch(e){return null;}})();
function figSrc(n){return (OFFLINE&&OFFLINE.img&&OFFLINE.img[n])||("fig/"+n+".jpg");}
function blobToData(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
function offlineDate(){if(!OFFLINE||!OFFLINE.at)return "";const d=new Date(OFFLINE.at);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function offlineNote(){
  if(OFFLINE)return `這是 <b>${offlineDate()}</b> 下載的離線版，不需要網路。進度只存在這台裝置，不會同步到帳號，也不會和線上版合併；網站之後更新的內容不會出現在這裡，要回線上版重新下載。${(OFFLINE.miss||[]).length?`下載當時有 ${OFFLINE.miss.length} 張圖沒抓到，會顯示成空白。`:""}`;
  const n=new Set(offlineNames().filter(Boolean)).size;
  return `把整個網站${n?`（含 ${n} 張圖）`:""}打包成<b>一個 HTML 檔</b>，圖片多時要等一兩分鐘，按鈕會顯示進度，全部打包完才會跳出下載；網路不穩或伺服器忙時會自動等一下再重試。下載後沒有網路也能用：用瀏覽器打開這個檔案即可（手機請用 Safari 或 Chrome 開，不要用檔案預覽）。離線版的進度只存在那台裝置，不會同步到帳號；網站之後更新要重新下載。`;}
const OFF_IMG={};/* 已抓到的圖留在記憶體，再按一次只補抓缺的 */
const offSleep=ms=>new Promise(r=>setTimeout(r,ms));
/* 抓一張圖：失敗（伺服器嫌太密集、網路不穩）就等一下再試，最多 6 次；等待秒數依 Retry-After 或 1→2→4→8→16 秒 */
async function offFetch(n,onWait){
  let delay=1000;
  for(let k=0;k<6;k++){
    try{const r=await fetch("fig/"+encodeURIComponent(n)+".jpg",k?{cache:"reload"}:{});/* 重試時略過快取，免得拿到快取住的失敗回應 */
      if(r.ok)return await blobToData(await r.blob());
      if(r.status===404)return null;
      const ra=parseFloat(r.headers.get("Retry-After"));if(ra>0)delay=Math.min(ra*1000,30000);
    }catch(e){}
    if(k<5){if(onWait)onWait(Math.ceil(delay/1000));await offSleep(delay);delay=Math.min(delay*2,16000);}
  }
  return null;}
async function offlineHTML(prog){
  const names=[...new Set(offlineNames().filter(Boolean))],img={};let miss=[];
  const N=names.length;let done=0,gap=0;
  const todo=names.filter(n=>!OFF_IMG[n]);done=N-todo.length;
  for(let round=0;round<3;round++){
    const list=round?miss:todo;miss=[];
    if(round&&list.length){for(let s=8*round;s>0;s--){if(prog)prog(done,N,`還有 ${list.length} 張沒抓到，${s} 秒後再試`);await offSleep(1000);}}
    for(const n of list){
      let waited=false;
      const d=await offFetch(n,s=>{waited=true;if(prog)prog(done,N,`伺服器忙，${s} 秒後重試`);});
      if(d){OFF_IMG[n]=d;done++;}else miss.push(n);
      if(waited)gap=Math.max(gap,200);/* 被擋過就放慢一點 */
      if(prog)prog(done,N);
      if(gap)await offSleep(gap);}
    if(!miss.length)break;}
  names.forEach(n=>{if(OFF_IMG[n])img[n]=OFF_IMG[n];});
  const E="</"+"script>";
  const off='<script id="offline-data" type="application/json">'+JSON.stringify({at:new Date().toISOString(),img,miss}).replace(/</g,"\\u003c")+E+"\n";
  const data=document.getElementById("site-data").textContent;
  let h=templateHTML();
  h=h.replace("<title>__TITLE__</title>",()=>"<title>"+esc(document.title)+"（離線版）</title>");
  h=h.replace("__DATA__",()=>data);
  h=h.replace('<script id="app-code">',()=>off+'<script id="app-code">');
  return {html:h,miss};}
async function saveOffline(btnId,label){
  if(OFFLINE)return;
  const set=s=>{const b=document.getElementById(btnId);if(b)b.textContent=s;};
  const reset=ms=>setTimeout(()=>set(label),ms||2400);
  const b0=document.getElementById(btnId);if(b0&&b0.dataset.busy)return;if(b0)b0.dataset.busy="1";
  try{
    set("打包中…");
    const {html,miss}=await offlineHTML((i,n,msg)=>set(msg?`${msg}（${i}／${n}）`:`打包圖片 ${i}／${n}`));
    const fn=String(document.title||"網站").replace(/[\\/:*?"<>|]/g,"_")+"_離線版.html";
    const okMsg=miss.length?`已下載，但有 ${miss.length} 張圖沒抓到，稍後再按一次會只補抓缺的`:"已下載 ✓";
    let dl=null;try{dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;}catch(e){dl=null;}
    if(dl){try{await dl.save({filename:fn,data:html});set(okMsg);}catch(e){set(e&&e.code==="declined"?"已取消":"無法下載，請稍後再試");}reset(miss.length?9000:0);return;}
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download=fn;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);set(okMsg);reset(miss.length?9000:0);
  }catch(e){set("打包失敗，請稍後再試");reset();}
  finally{const b=document.getElementById(btnId);if(b)delete b.dataset.busy;}}

const EXAMS={},EORDER=[],UEXAM={};for(const e of D.exams){EXAMS[e.key]={n:e.name,d:e.date};EORDER.push(e.key);for(const u of (e.units||UORDER))UEXAM[u]=e.key;}
const LADDER=[1,2,4,7,14,30,60];
const WD="日一二三四五六";
const DAY=864e5;
function today(){const n=new Date();return Math.floor((n.getTime()-n.getTimezoneOffset()*6e4)/DAY);}
function dn(ms){const n=new Date(ms);return Math.floor((ms-n.getTimezoneOffset()*6e4)/DAY);}
function dnStr(s){const [y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY);}
function dnLabel(d){const x=new Date(d*DAY);return `${x.getUTCMonth()+1}/${x.getUTCDate()}（${WD[x.getUTCDay()]}）`;}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function examDate(k){return (X[k])||EXAMS[k].d;}
function examDay(k){return dnStr(examDate(k));}
function lastExam(){return EORDER.reduce((a,k)=>examDay(k)>=examDay(a)?k:a);}
function nextExam(){const T=today();return EORDER.find(k=>examDay(k)>=T)||null;}
function scopeQs(k){return QS.filter(q=>UEXAM[q.u]===k);}
function nextIv(iv,slow){const f=LADDER.find(x=>x>iv)||Math.round(iv*2);return slow?Math.min(f,Math.max(iv+1,Math.ceil(iv*1.25))):f;}
function sched(p){/* old records (before v3) have no schedule: derive one */
  if(p.due!=null) return {iv:p.iv||0,due:p.due};
  const at=dn(p.t||Date.now());
  if(p.l!==1) return {iv:0,due:at};
  const iv=LADDER[Math.min(Math.max((p.c||1)-1,0),LADDER.length-1)];return {iv,due:at+iv};}
function effDue(q){const p=P[q.id];if(!p)return null;let due=sched(p).due;
  const ed=examDay(UEXAM[q.u]),T=today();
  if(ed>T&&due>ed-1){const lo=dn(p.t||Date.now())+1,hi=ed-1;due=hi<lo?hi:lo+hash(q.id)%(hi-lo+1);}
  return due;}
function capDue(q,iv){const T=today(),ed=examDay(UEXAM[q.u]),E=ed-T;
  if(E>=2) return Math.min(T+Math.min(iv,Math.max(1,Math.floor(E/2))),ed-1);
  if(E===1) return T+Math.min(iv,1);
  return T+iv;}
function isDue(q){const d=effDue(q);return d!=null&&d<=today();}
function weak(q){const p=P[q.id];if(!p)return 2;if(p.l===0)return 5;if(p.g)return 4;if(p.sl)return 3;if((p.c||0)<=1)return 1;return 0;}
function dueText(d){const n=d-today();return n<=0?"今天":n===1?"明天（"+dnLabel(d)+"）":n+" 天後（"+dnLabel(d)+"）";}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildList(onlyIds){
  const pool=onlyIds?QS.filter(q=>onlyIds.includes(q.id)):QS.filter(q=>state.units.has(q.u)&&inYears(q)&&inQT(q));
  if(onlyIds) return shuffle(pool).sort((a,b)=>UORDER.indexOf(a.u)-UORDER.indexOf(b.u));
  const unseen=shuffle(pool.filter(q=>!P[q.id]));
  const wrong=shuffle(pool.filter(q=>P[q.id]&&P[q.id].l===0));
  const right=pool.filter(q=>P[q.id]&&P[q.id].l===1).sort((a,b)=>(P[a.id].t||0)-(P[b.id].t||0));
  let ordered;
  if(state.order==="due"){const T=today();ordered=shuffle(pool.filter(q=>P[q.id]&&effDue(q)<=T)).sort((a,b)=>effDue(a)-effDue(b)||weak(b)-weak(a));}
  else if(state.order==="cram") ordered=shuffle(pool.slice()).sort((a,b)=>weak(b)-weak(a)||((P[a.id]||{}).c||0)-((P[b.id]||{}).c||0));
  else if(state.order==="only") ordered=unseen;
  else if(state.order==="new") ordered=[...unseen,...wrong,...right];
  else if(state.order==="wrong") ordered=[...wrong,...unseen,...right];
  else ordered=shuffle(pool.slice());
  const n=state.count==="all"?ordered.length:Math.min(state.count,ordered.length);
  return ordered.slice(0,n).sort((a,b)=>UORDER.indexOf(a.u)-UORDER.indexOf(b.u));
}

function record(q){
  if(state.recorded.has(q.id)) return;

  if(valid&&!W){X.sp={r:sp.n?sp.r*0.85+r*0.15:r,n:sp.n+1};X.t=Date.now();}
  const iv=ok?nextIv(base,slow):0;
  const due=ok?capDue(q,iv):today()+1;
  const rec={s:o.s+1,c:o.c+(ok?1:0),l:ok?1:0,t:Date.now(),iv,due};
  if(W&&(state.ans[q.id]||[])[0]==="H")rec.h=1;

  if(b.dataset.flip){state.flip.add(b.dataset.flip);render(true);return;}
  if(b.dataset.self){const q=state.list[state.i];if(!q||state.locked||!isW(q))return;state.ans[q.id]=[b.dataset.self];state.locked=true;record(q);render(true);return;}
  if(b.id==="confirm"){const q=state.list[state.i];if(!(state.ans[q.id]||[]).length)return;state.locked=true;record(q);render(true);return;}
  if(b.dataset.nav==="next"){if(state.i<state.list.length-1)goTo(state.i+1);else finish();return;}
  if(b.id==="prev"){if(state.i>0)goTo(state.i-1);return;}
  if(b.dataset.go!==undefined){goTo(+b.dataset.go);return;}
  if(b.id==="quit"){finish();return;}
  if(b.dataset.guess){toggleGuess(b.dataset.guess);return;}
  if(b.id==="cdEdit"){state.cdedit=true;render(true);return;}
  if(b.id==="cdCancel"){state.cdedit=false;render(true);return;}
  if(b.id==="cdSave"){const k=b.dataset.k,v=($("#cdDate")||{}).value;if(!/^\d{4}-\d{2}-\d{2}$/.test(v||"")){toast("請選一個日期");return;}
    if(v===EXAMS[k].d)delete X[k];else X[k]=v;X.t=Date.now();state.cdedit=false;save();render(true);toast("考試日期已更新，排程會照新日期調整");return;}
  if(b.id==="cdReset"){const k=b.dataset.k;delete X[k];X.t=Date.now();state.cdedit=false;save();render(true);toast("已恢復課程大綱的日期");return;}
  if(b.dataset.rf){state.rf=b.dataset.rf;render(true);return;}
  if(b.id==="redoWrong"){startQuiz(state.list.filter(q=>state.ans[q.id]&&!isRight(q,state.ans[q.id])).map(q=>q.id));return;}
  if(b.dataset.home){state.screen="setup";state.xopen={};render();return;}
  if(b.dataset.xq){const q=QS.find(x=>x.id===b.dataset.xq);copyText(exportText([q]),q.id);return;}
  if(b.dataset.xcopy){const k=b.dataset.xcopy;copyText(state.xopen[k],k);return;}
  if(b.dataset.xclose){delete state.xopen[b.dataset.xclose];render(true);return;}
  if(b.id==="exportRound"){const qs=state.list.filter(q=>state.ans[q.id]&&state.ans[q.id].length&&!isRight(q,state.ans[q.id]));copyText(exportText(qs),"round");return;}
  if(b.dataset.wsort){state.wsort=b.dataset.wsort;render(true);return;}
  if(b.id==="openFavs"){state.screen="favs";state.xopen={};render();return;}
  if(b.dataset.fsort){state.fsort=b.dataset.fsort;render(true);return;}
  if(b.id==="fExport"){const qs=QS.filter(q=>state.fsel.has(q.id)).sort((a,b)=>UORDER.indexOf(a.u)-UORDER.indexOf(b.u));if(qs.length)copyText(exportText(qs),"fb");return;}
  if(b.id==="fPractice"){const ids=[...state.fsel];if(ids.length)startQuiz(ids);return;}
  if(b.id==="fRemove"){const batch=[...state.fsel].filter(id=>FAV[id]).map(id=>({id,t:FAV[id]}));if(!batch.length)return;batch.forEach(x=>delete FAV[x.id]);state.favUndo.push(batch);state.fsel=new Set();saveSoon();render(true);toast(`已取消收藏 ${batch.length} 題，可以按「↩ 復原」`,2600);return;}
  if(b.id==="favUndo"){const batch=state.favUndo.pop();if(!batch)return;batch.forEach(x=>{FAV[x.id]=x.t;state.fsel.add(x.id);});saveSoon();render(true);toast(`已復原 ${batch.length} 題收藏`);return;}
  if(b.id==="openWrongs"){state.screen="wrongs";state.xopen={};render();return;}
  if(b.id==="wExport"){const qs=QS.filter(q=>state.wsel.has(q.id)).sort((a,b)=>UORDER.indexOf(a.u)-UORDER.indexOf(b.u));if(qs.length)copyText(exportText(qs),"wb");return;}
  if(b.id==="wPractice"){const ids=[...state.wsel];if(ids.length)startQuiz(ids);return;}
});
P=lsGet(LS_KEY)||{};FAV=lsGet(FAV_KEY)||{};X=lsGet(X_KEY)||{};applyAlias();
function autoCram(){const k=nextExam();if(!k||!scopeQs(k).length)return;const E=examDay(k)-today();
  if(E<=3&&state.cramFor!==examDate(k)){state.cramFor=examDate(k);state.order="cram";savePrefs();}}
autoCram();
render();
initStore();
