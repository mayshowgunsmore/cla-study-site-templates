<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="claude:viewport-fit-sides" content="cover"><title>__TITLE__</title>
<style id="theme">
__THEME__
</style>
<style id="base">
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
a{color:var(--blue)}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* 頂列 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:2px solid var(--line)}
.top-in{display:flex;align-items:center;gap:8px;min-height:52px;padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-title{font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{min-width:44px;min-height:44px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;white-space:nowrap}
.ibtn.on{background:var(--hi);border-color:var(--hi-ink);color:var(--on-hi)}

/* 外框 */
.shell{display:block}
.side{display:none}
.wrap{max-width:860px;margin:0 auto;padding-block:22px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:22px}

/* 底部分頁 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:2px solid var(--line);
  display:grid;grid-template-columns:repeat(var(--tabs,6),1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{min-height:54px;border:0;background:none;font-size:.82rem;font-weight:700;color:var(--muted);border-top:3px solid transparent;margin-top:-2px}
.tabs button.on{color:var(--blue);border-top-color:var(--blue)}

/* 卡片 */
.card{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;box-shadow:2px 3px 0 var(--line);padding:18px 16px}
.tape::before{content:"";position:absolute;top:-11px;left:22px;width:76px;height:22px;background:var(--tape);opacity:.85;transform:rotate(-2.5deg);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 5px,transparent 5px 10px)}
.hero h1{font-size:1.7rem;font-weight:900;letter-spacing:.01em}
.hero h1 .mk{background:linear-gradient(transparent 62%,var(--hi) 62%,var(--hi) 92%,transparent 92%)}
.eyebrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:.74rem;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.hero p{margin:8px 0 0;color:var(--muted)}
.folds{margin-top:12px;display:flex;flex-direction:column}
.folds details{border-top:1.5px dashed var(--line)}
.folds summary{min-height:44px;display:flex;align-items:center;font-weight:800;cursor:pointer;list-style:none}
.folds summary::-webkit-details-marker{display:none}
.folds summary::before{content:"＋";color:var(--blue);margin-right:8px;font-family:var(--mono)}
.folds details[open] summary::before{content:"－"}
.folds .body{padding:0 0 14px;font-size:.95rem}
.folds .body ul{margin:6px 0;padding-left:1.2em}
.prompt{white-space:pre-wrap;font-family:var(--mono);font-size:.78rem;line-height:1.6;background:var(--surface2);border:1.5px solid var(--line);border-radius:4px;padding:12px;max-height:320px;overflow:auto;margin:8px 0 0}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat .lab{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.05em}
.stat .num{font-family:var(--mono);font-weight:800;font-size:2.1rem;line-height:1.15;color:var(--red);font-variant-numeric:tabular-nums}
.stat .num.b{color:var(--blue)}
.stat .sub{font-size:.8rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;min-height:44px;color:var(--blue);font-weight:700;font-size:.85rem;text-decoration:underline}
.daterow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.daterow input{font:inherit;min-height:44px;padding:0 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);max-width:100%}

.pill{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem}
.pill.on{background:var(--hi);border-color:var(--hi-ink);color:var(--on-hi)}
.pill.primary{background:var(--main);border-color:var(--main);color:var(--on-main)}
.pill.off{color:var(--muted);background:var(--surface2);border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.chlist{display:grid;gap:14px;grid-template-columns:1fr}
.chcard{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;box-shadow:2px 3px 0 var(--line);padding:14px 16px}
.chcard .no{font-family:var(--hand);font-weight:800;color:var(--red);font-size:.85rem}
.chcard .t{font-weight:800;font-size:1.08rem;display:block}
.chcard .en{display:block;font-size:.8rem;color:var(--muted)}
.chcard .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bar{height:6px;background:var(--surface2);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}

.tag{display:inline-block;border-radius:4px;font-size:.7rem;font-weight:800;padding:1px 7px;line-height:1.7;white-space:normal}
.tag.hl{background:var(--hi-soft);color:var(--hi-ink)}
.tag.hw{background:var(--blue-soft);color:var(--blue)}
.tag.rd{background:var(--red-soft);color:var(--red)}
.tag.gn{background:var(--green-soft);color:var(--green)}
.tag.pg{background:var(--surface2);color:var(--muted);font-family:var(--mono)}

.pagehead h2{font-size:1.4rem;font-weight:900}
.pagehead .en{color:var(--muted);font-size:.85rem}
.plain{border-left:5px solid var(--blue);background:var(--blue-soft);border-radius:0 4px 4px 0;padding:10px 14px;font-size:.95rem}
.plain b{color:var(--blue)}
body.mask .plain{display:none}
.note{border-left:5px solid var(--red);background:var(--red-soft);border-radius:0 4px 4px 0;padding:8px 12px;font-size:.88rem;margin-top:10px}
.note.g{border-color:var(--green);background:var(--green-soft)}
.note.b{border-color:var(--blue);background:var(--blue-soft)}

/* 器械卡 */
.inst{display:grid;gap:12px;grid-template-columns:1fr}
.photo{display:block;width:100%;padding:8px;border:1.5px solid var(--line);border-radius:4px;background:var(--photo);min-height:44px}
.photo img{display:block;margin:0 auto;max-width:100%;height:auto;max-height:230px;width:auto}
.inst h3{font-size:1.12rem;font-weight:800}
.inst h3 .zh{font-weight:700}
.inst dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.inst dt{font-weight:800;color:var(--muted);font-size:.8rem;padding-top:3px;white-space:nowrap}
.inst dd{margin:0;min-width:0}
.inst dd ul{margin:0;padding-left:1.1em}
.inst .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.inst details{margin-top:8px;font-size:.85rem}
.inst details summary{min-height:44px;display:flex;align-items:center;color:var(--blue);font-weight:700;cursor:pointer}
.inst details p{margin:0 0 6px;color:var(--muted)}
.star{min-height:44px;min-width:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:700;padding:0 12px}
.star.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.k{border-radius:3px;padding:0 2px;background:linear-gradient(transparent 68%,var(--hi-soft) 68%)}
body.mask .k{background:var(--mask);color:transparent;cursor:pointer;user-select:none}
body.mask .k *{color:transparent}
body.mask .k.show{background:var(--hi-soft);color:inherit}
body.mask .k.show *{color:inherit}

/* 口訣 */
.mn{border:2px solid var(--hi);border-radius:4px;background:var(--surface);overflow:hidden}
.mn .h{background:var(--hi-soft);color:var(--hi-ink);font-weight:800;font-size:.82rem;padding:4px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mn .m{font-family:var(--hand);font-weight:800;font-size:1.3rem;color:var(--red);padding:8px 12px 0}
.mn .a{padding:4px 12px 10px;font-size:.92rem}

/* 托盤 */
.tray .photo img{max-height:none;width:100%}
.tlist{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr;gap:0}
.tlist li{display:grid;grid-template-columns:2.2em 1fr;gap:6px;padding:7px 4px;border-bottom:1px dashed var(--line);align-items:start;min-width:0}
.tlist .n{font-family:var(--mono);font-weight:800;color:var(--red);text-align:right}
.tlist .b{min-width:0}
.tlist li.hl .nm{background:linear-gradient(transparent 55%,var(--hi) 55%,var(--hi) 95%,transparent 95%)}
.tlist .x{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.jump{background:none;border:0;padding:0;color:var(--blue);font-size:.8rem;font-weight:700;text-decoration:underline;min-height:28px}

/* 圖 */
figure{margin:0}
figcaption{font-size:.84rem;color:var(--muted);margin-top:6px}
.diag svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.diag ol{margin:8px 0 0;padding-left:1.4em;font-size:.92rem}
.tblwrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface2);font-size:.8rem;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td .jump{font-size:.92rem;text-align:left}

/* 測驗 */
.quiz>summary{min-height:48px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;cursor:pointer}
.q{border-top:1.5px dashed var(--line);padding:14px 0}
.q .src{font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.q .stem{font-weight:700;margin:4px 0 8px}
.q .photo{max-width:420px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:block;width:100%;text-align:left;min-height:48px;padding:8px 12px;background:var(--surface2);border:1.5px solid var(--line);border-radius:8px}
.opt.ok{background:var(--green-soft);border-color:var(--green)}
.opt.no{background:var(--red-soft);border-color:var(--red)}
.opt.lock{cursor:default}
.opt .ex{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.verdict{font-weight:800;margin-top:8px}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}

/* 跑考練習 */
.drillcard{text-align:center}
.drillcard .photo img{max-height:300px}
.timer{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;background:var(--red);width:100%}
.flip{min-height:120px;border:1.5px dashed var(--line);border-radius:8px;padding:14px;background:var(--surface2);width:100%;text-align:center}
.flip .big{font-size:1.25rem;font-weight:800}
.rowc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.lab2{font-size:.8rem;font-weight:800;color:var(--muted);margin:10px 0 6px}

.pill.good{background:var(--green-soft);border-color:var(--green);color:var(--good)}
.pill.bad{background:var(--red-soft);border-color:var(--red);color:var(--bad)}
.pill.out{background:var(--red);border-color:var(--red);color:var(--surface)}
.pill.wb{border-color:var(--red);color:var(--red)}
.clock{font-family:var(--mono);font-weight:800;font-size:.9rem;color:var(--muted);text-align:left;margin-bottom:8px;font-variant-numeric:tabular-nums}
.next{font-size:.85rem;color:var(--muted);margin-top:6px}
.flip{display:block}
.pbox{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center}
.ring{position:relative;width:96px;height:96px}
.ring svg{display:block;width:100%;height:100%}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .rc b{font-family:var(--mono);font-size:1.5rem;color:var(--blue)}
.ring .rc span{font-size:.72rem;color:var(--muted);font-family:var(--mono)}
.pinfo .lab{font-weight:900;font-size:1.08rem}
.pinfo .sub{font-size:.84rem;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.dot.b{background:var(--blue)}.dot.g{background:var(--green)}
.wlist{display:flex;flex-direction:column}
.tablebox{overflow-x:auto}
.wtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.wtools h2{margin:0}
.wtable{width:100%;min-width:0;border-collapse:collapse;font-size:.9rem}
.wtable th{position:sticky;top:0;background:var(--surface2);font-size:.78rem;color:var(--muted);font-weight:700;text-align:left;padding:9px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.wtable td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.wtable tr.on td{background:var(--hi-soft)}
.wtable td.ck{padding:4px 2px;width:44px}
.wtable td.ck label,.wtable th.ck label{display:flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;cursor:pointer}
.wtable input{width:20px;height:20px;accent-color:var(--hi-ink);cursor:pointer;margin:0}
.wtable .u{white-space:nowrap}
.wtable .nm b{display:block}
.wtable .nm .jump{margin-top:4px}
.wtable .cnt{font-family:var(--mono);font-weight:700;color:var(--bad);text-align:center;white-space:nowrap}
.wtable .fix{text-align:center;font-weight:900;font-size:1.05rem}
.wtable .due{font-size:.8rem;color:var(--muted);white-space:nowrap}
.wtable tr.grp td{background:var(--surface);font-family:var(--hand);font-weight:700;font-size:1rem;color:var(--red);padding-top:14px}
.okm{color:var(--good)}.nom{color:var(--bad)}
@media (max-width:360px){.wtable col.c0{width:34px}.wtable col.c1{width:36px}.wtable col.c5{width:50px}.wtable td.ck label,.wtable th.ck label{min-width:32px}}
@media (max-width:560px){.wtable{font-size:.8rem;table-layout:fixed}.wtable th,.wtable td{padding:7px 4px}.wtable th{white-space:normal;font-size:.7rem}.wtable col.c0{width:44px}.wtable col.c1{width:46px}.wtable col.c3,.wtable col.c4{width:42px}.wtable col.c5{width:58px}.wtable .u .tag{padding:1px 5px;font-size:.68rem}.wtable .due{white-space:normal}}
.wrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 2px;border-bottom:1px dashed var(--line);text-align:left;cursor:pointer}
.wrow:not(label){grid-template-columns:minmax(0,1fr);cursor:default}
.wrow input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--hi-ink)}
.wrow .b{min-width:0}.wrow .b b{display:block}
.wrow .x{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
.pill.sm{min-height:36px;padding:0 12px;font-size:.82rem}
.pill.wide{min-width:200px}
.pill.rec{border-color:var(--hi-ink)}
.pill .rt{font-size:.68rem;background:var(--hi);color:var(--on-hi);border-radius:999px;padding:0 6px;margin-left:6px}
.starb.on{background:var(--hi-soft);border-color:var(--hi-ink);color:var(--hi-ink)}
.ghost{background:none;border:0;color:var(--muted);font-weight:700;font-size:.88rem;min-height:44px;padding:0 10px;border-radius:999px}
.ghost:hover{color:var(--hi-ink);background:var(--hi-soft)}
.spread{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .pill{white-space:nowrap;padding:0 8px}
.card>h3,.card .spread>h3{font-size:1.12rem;font-weight:900}
.dp>.card{display:flex;flex-direction:column;gap:12px}
.dp>.card>*{min-width:0}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--red);color:var(--surface);font-family:var(--hand);font-size:.85rem;margin-right:8px;vertical-align:2px}
.wb-entry{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wb-entry h3{font-size:1.12rem;font-weight:900}
.wb-entry>b{font-family:var(--mono);font-size:1.6rem;color:var(--red)}
details.info summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--blue);font-weight:800;font-size:.92rem}
ol.howto{margin:4px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.units{display:grid;gap:10px;grid-template-columns:1fr}
.unit{position:relative;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);box-shadow:2px 3px 0 var(--line);cursor:pointer;min-width:0}
.unit.on{border-color:var(--hi-ink);background:var(--hi-soft)}
.unit input{position:absolute;top:12px;right:12px;width:22px;height:22px;accent-color:var(--hi-ink)}
.unit .date{align-self:flex-start;font-family:var(--hand);font-weight:800;font-size:.76rem;color:var(--red)}
.unit b{padding-right:30px;line-height:1.4}
.unit small{color:var(--muted);font-size:.76rem}
.unit .count{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.unit .bar{margin-top:4px;background:var(--surface2)}
.unit.on .bar{background:var(--surface)}
.pagehead h2 .mk,.card h3 .mk{background:linear-gradient(transparent 62%,var(--hi) 62%,var(--hi) 92%,transparent 92%)}
.verdict.ok,.verdict.no{font-family:var(--hand)}
.flip{border-radius:4px}
.drillcard .photo,.rq .photo{border-radius:4px}
.xbox{border-radius:4px}
.bd{color:var(--bad)}.bl{color:var(--blue)}
.selbox{background:var(--hi-soft);border:1.5px dashed var(--hi-ink);border-radius:4px;padding:10px 14px;font-size:.92rem}
.selbox b{font-family:var(--mono);font-size:1.1rem}
.startcard{border:1.5px solid var(--line)}
.actions{display:flex;flex-direction:column;gap:8px}
.actions .pill{width:100%}
.actions .pill[aria-disabled="true"]{opacity:.45}
.confirm{background:var(--red-soft);border:1.5px solid var(--red);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;background:var(--paper);padding-block:6px;display:flex;flex-direction:column;gap:4px;margin-bottom:-10px}
.dots{display:flex;gap:2px}
.dots button{flex:1;min-width:0;height:26px;padding:9px 0;margin:0;border:0;background:none}
.dots button::before{content:"";display:block;height:8px;border-radius:4px;background:var(--line)}
.dots button.ok::before{background:var(--good)}.dots button.no::before{background:var(--bad)}.dots button.cur::before{background:var(--hi)}
.dots button.at::before{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.drillcard{text-align:left}
.drillcard .clock{margin:0}
.qhead{display:flex;gap:12px;align-items:center}
.qno{font-family:var(--hand);font-weight:800;font-size:2rem;line-height:1;color:var(--red)}
.flip .ans{font-size:.92rem;margin-top:6px;text-align:left}

<script id="site-data" type="application/json">__DATA__</script>
<script id="app-code">
(function(){
"use strict";
const SD=JSON.parse(document.getElementById("site-data").textContent);
/* ---------- 離線版：按下按鈕時把網站內容與全部圖片打包成單一 HTML ---------- */
const OFFLINE=(()=>{try{const e=document.getElementById("offline-data");return e?JSON.parse(e.textContent):null;}catch(e){return null;}})();
function figSrc(n){return (OFFLINE&&OFFLINE.img&&OFFLINE.img[n])||("fig/"+n+".jpg");}
function blobToData(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
function offlineDate(){if(!OFFLINE||!OFFLINE.at)return "";const d=new Date(OFFLINE.at);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function offlineNote(){
  if(OFFLINE)return `這是 <b>${offlineDate()}</b> 下載的離線版，不需要網路。進度只存在這台裝置，不會同步到帳號，也不會和線上版合併；網站之後更新的內容不會出現在這裡，要回線上版重新下載。${(OFFLINE.miss||[]).length?`下載當時有 ${OFFLINE.miss.length} 張圖沒抓到，會顯示成空白。`:""}`;
  const n=new Set(offlineNames().filter(Boolean)).size;
  return `把整個網站${n?`（含 ${n} 張圖）`:""}打包成<b>一個 HTML 檔</b>，圖片多時要等一兩分鐘，按鈕會顯示進度，全部打包完才會跳出下載；網路不穩或伺服器忙時會自動等一下再重試。下載後沒有網路也能用：用瀏覽器打開這個檔案即可（手機請用 Safari 或 Chrome 開，不要用檔案預覽）。離線版的進度只存在那台裝置，不會同步到帳號；網站之後更新要重新下載。`;}
const OFF_IMG={};/* 已抓到的圖留在記憶體，再按一次只補抓缺的 */
const offSleep=ms=>new Promise(r=>setTimeout(r,ms));
/* 抓一張圖：失敗（伺服器嫌太密集、網路不穩）就等一下再試，最多 6 次；等待秒數依 Retry-After 或 1→2→4→8→16 秒 */
async function offFetch(n,onWait){
  let delay=1000;
  for(let k=0;k<6;k++){
    try{const r=await fetch("fig/"+encodeURIComponent(n)+".jpg",k?{cache:"reload"}:{});/* 重試時略過快取，免得拿到快取住的失敗回應 */
      if(r.ok)return await blobToData(await r.blob());
      if(r.status===404)return null;
      const ra=parseFloat(r.headers.get("Retry-After"));if(ra>0)delay=Math.min(ra*1000,30000);
    }catch(e){}
    if(k<5){if(onWait)onWait(Math.ceil(delay/1000));await offSleep(delay);delay=Math.min(delay*2,16000);}
  }
  return null;}
async function offlineHTML(prog){
  const names=[...new Set(offlineNames().filter(Boolean))],img={};let miss=[];
  const N=names.length;let done=0,gap=0;
  const todo=names.filter(n=>!OFF_IMG[n]);done=N-todo.length;
  for(let round=0;round<3;round++){
    const list=round?miss:todo;miss=[];
    if(round&&list.length){for(let s=8*round;s>0;s--){if(prog)prog(done,N,`還有 ${list.length} 張沒抓到，${s} 秒後再試`);await offSleep(1000);}}
    for(const n of list){
      let waited=false;
      const d=await offFetch(n,s=>{waited=true;if(prog)prog(done,N,`伺服器忙，${s} 秒後重試`);});
      if(d){OFF_IMG[n]=d;done++;}else miss.push(n);
      if(waited)gap=Math.max(gap,200);/* 被擋過就放慢一點 */
      if(prog)prog(done,N);
      if(gap)await offSleep(gap);}
    if(!miss.length)break;}
  names.forEach(n=>{if(OFF_IMG[n])img[n]=OFF_IMG[n];});
  const E="</"+"script>";
  const off='<script id="offline-data" type="application/json">'+JSON.stringify({at:new Date().toISOString(),img,miss}).replace(/</g,"\\u003c")+E+"\n";
  const data=document.getElementById("site-data").textContent;
  let h=templateHTML();
  h=h.replace("<title>__TITLE__</title>",()=>"<title>"+esc(document.title)+"（離線版）</title>");
  h=h.replace("__DATA__",()=>data);
  h=h.replace('<script id="app-code">',()=>off+'<script id="app-code">');
  return {html:h,miss};}
async function saveOffline(btnId,label){
  if(OFFLINE)return;
  const set=s=>{const b=document.getElementById(btnId);if(b)b.textContent=s;};
  const reset=ms=>setTimeout(()=>set(label),ms||2400);
  const b0=document.getElementById(btnId);if(b0&&b0.dataset.busy)return;if(b0)b0.dataset.busy="1";
  try{
    set("打包中…");
    const {html,miss}=await offlineHTML((i,n,msg)=>set(msg?`${msg}（${i}／${n}）`:`打包圖片 ${i}／${n}`));
    const fn=String(document.title||"網站").replace(/[\\/:*?"<>|]/g,"_")+"_離線版.html";
    const okMsg=miss.length?`已下載，但有 ${miss.length} 張圖沒抓到，稍後再按一次會只補抓缺的`:"已下載 ✓";
    let dl=null;try{dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;}catch(e){dl=null;}
    if(dl){try{await dl.save({filename:fn,data:html});set(okMsg);}catch(e){set(e&&e.code==="declined"?"已取消":"無法下載，請稍後再試");}reset(miss.length?9000:0);return;}
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download=fn;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);set(okMsg);reset(miss.length?9000:0);
  }catch(e){set("打包失敗，請稍後再試");reset();}
  finally{const b=document.getElementById(btnId);if(b)delete b.dataset.busy;}}
function offlineNames(){const s=new Set(Object.keys(SD.dims||{}));const add=o=>{if(o&&o.img)s.add(o.img);if(o&&o.orig)s.add(o.orig);};
  Object.values(SD.items||{}).forEach(add);Object.values(SD.groups||{}).forEach(add);Object.values(SD.quiz||{}).forEach(a=>(a||[]).forEach(add));return [...s];}
const I=SD.items,T=SD.groups||{},CH=SD.chapters,MN=SD.mnemonics||[],CMP=SD.cmp||[],DOUBT=SD.doubt||[],QZ=SD.quiz||{},DIM=SD.dims||{},EXAM=SD.site.examDefault;
const PROMPT=/*PROMPT*/""/*/PROMPT*/;
const F=Object.assign({atlas:true,drill:true,modes:["flash"]},SD.features||{});
const LBL=Object.assign({item:"器械",f:"功能",c:"特徵",group:"組合",groupsTitle:"",groupsEn:"",source:"講義",nameOrder:"en",question:"",searchHint:""},SD.labels||{});
CH.forEach(c=>{c.items=c.items||[];c.trays=c.trays||[];});
const GCH=CH.find(c=>c.trays.length&&!c.items.length)||null;
const NM=it=>LBL.nameOrder==="zh"?`${esc(it.z)}(${esc(it.n)})`:`${esc(it.n)}(${esc(it.z)})`;

const fillN=t=>String(t).replace(/\{(\w+)\}/g,(m,k)=>{const v={items:Object.keys(I).length,groups:Object.keys(T).length,mn:MN.length,diag:Object.keys(DG).length,cmp:CMP.length,chapters:CH.length}[k];return v==null?m:v;});

  return '<!doctype html>\n<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="claude:viewport-fit-sides" content="cover"><title>__TITLE__</title>\n<style id="theme">'+g("theme")+'</style>\n<style id="base">'+g("base")+'</style>\n</head><body>\n<script id="site-data" type="application/json">__DATA__'+E+'\n<script id="app-code">'+g("app-code")+E+'\n</body></html>\n';}

async function cloudInit(){try{if(!SD.site.dbDoc||!window.claude||!window.claude.use)return;const u=await window.claude.use("user");if(!u)return;UID=await u.id();if(!UID)return;DB=await window.claude.use("db");if(!DB)return;

/* ---------- 路由 ---------- */
const TABS=[["home","首頁"],["key","必考"]].concat(F.drill?[["drill","跑考"]]:[],GCH?[["trays",LBL.group]]:[],CMP.length?[["cmp","對照"]]:[],MN.length?[["mn","口訣"]]:[]);

function examDate(){return S.exam||EXAM;}
function twToday(){const n=new Date(Date.now()+8*3600e3);return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())/864e5;}

/* ---------- 記憶曲線 ---------- */
const LADDER=[1,2,4,7,14,30], WD="日一二三四五六";
function examDay(){const [y,m,d]=examDate().split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);}
function nextIv(iv,slow){const f=LADDER.find(x=>x>iv)||30;return slow?Math.min(f,Math.max(iv+1,Math.ceil(iv*1.25))):f;}
function capDue(iv){const T=twToday(),ed=examDay(),E=ed-T;
  if(E>=2)return Math.min(T+Math.min(iv,Math.max(1,Math.floor(E/2))),ed-1);
  if(E===1)return T+Math.min(iv,1);
  return T+iv;}
function effDue(id){const p=S.rec[RK(id)];if(!p)return null;const T=twToday(),ed=examDay();let due=p.due;
  if(ed>T&&due>ed)due=Math.max(ed-1,T);return due;}
function isDue(id){const d=effDue(id);return d!=null&&d<=twToday();}
function dueLabel(d){const n=d-twToday();const x=new Date(d*864e5);
  return (n<=0?"今天":n===1?"明天":n+" 天後")+`（${x.getUTCMonth()+1}/${x.getUTCDate()} ${WD[x.getUTCDay()]}）`;}
function fmtMs(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function record(id,ok,ms){const T=twToday();const p=Object.assign({c:0,w:0,iv:0},S.rec[RK(id)]||{});
  const valid=ms>0&&ms<=120000;let slow=false;const a=Object.assign({n:0,s:0},S.tavg||{});
  if(ok&&valid&&a.n>=5){slow=ms>a.s/a.n*1.8&&ms>12000;}
  if(valid){a.n++;a.s+=ms;S.tavg=a;}
  if(ok){p.c++;p.l=1;p.iv=nextIv(p.iv||0,slow);p.due=capDue(p.iv);p.sl=slow?1:0;if(D.mode!=="choice")S.known[id]=1;}
  else{p.w++;p.l=0;p.iv=0;p.due=T+1;p.sl=0;if(D.mode!=="choice")delete S.known[id];}
  p.g=0;p.t=Date.now();p.ms=Math.round(ms);S.rec[RK(id)]=p;save();return p;}
const allIds=()=>Object.keys(I).filter(i=>D.mode!=="choice"||I[i].mc);
const RK=id=>D.mode==="choice"?"C:"+id:id;
const modeKeys=()=>Object.keys(S.rec).filter(k=>k.startsWith("C:")===(D.mode==="choice"));
const wrongSet=()=>allIds().filter(i=>S.rec[RK(i)]&&S.rec[RK(i)].w>0);
const nowWrong=()=>allIds().filter(i=>S.rec[RK(i)]&&S.rec[RK(i)].l===0);
const dueSet=()=>allIds().filter(isDue);
const starSet=()=>allIds().filter(i=>S.star[i]);
const chNo=id=>CH.indexOf(chOf(id))+1;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function copyText(t){const ok=()=>toast("已複製",500,"copied"),no=()=>toast("已展開文字，請自行選取複製");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok).catch(no);else no();}

  return `===\n【章節】第 ${chNo(id)} 章 ${c.t}\n【${LBL.item}】${NMp(it)}\n【${LBL.f}】${plainTxt(it.f.join("；"))}\n【${LBL.c}】${plainTxt(it.c.join("；"))}\n【紀錄】${p?`錯 ${p.w} 次，最近一次${p.l===1?"答對":"答錯"}`:"還沒練過"}\n===`;}).join("\n");}

function ringSVG(a,b,tot,inner,big){const R=34,C=2*Math.PI*R,arc=(v,col)=>`<circle cx="42" cy="42" r="${R}" fill="none" stroke="var(${col})" stroke-width="9" stroke-linecap="${v?'round':'butt'}" stroke-dasharray="${tot?C*v/tot:0} ${C}" transform="rotate(-90 42 42)"/>`;
  return `<div class="ring${big?' big':''}"><svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="9"/>${arc(a,"--blue")}${b!=null?arc(b,"--green"):""}</svg><div class="rc">${inner}</div></div>`;}

/* ---------- 跑考練習：設定 ---------- */
const DCH=CH.filter(c=>c.items.length);
let D={mode:F.modes[0]||"flash",units:new Set(DCH.map(c=>c.id)),count:20,order:"new",must:false,sec:0,run:null,rf:"all",confirm:false,undo:null};
const HASMUST=Object.values(I).some(x=>x.must);
function weak(id){const p=S.rec[RK(id)];if(!p)return 2;if(p.l===0)return 5;if(p.g)return 4;if(p.sl)return 3;if((p.c||0)<=1)return 1;return 0;}
function unitIds(){return allIds().filter(i=>D.units.has(chOf(i).id));}
function selIds(){const ids=unitIds();return D.must&&HASMUST?ids.filter(i=>I[i].must):ids;}
function buildList(){let ids=shuffle(selIds());const o=D.order,rank=f=>ids.sort((a,b)=>f(a)-f(b));
  if(o==="due")ids=ids.filter(isDue);
  else if(o==="only")ids=ids.filter(i=>!S.rec[RK(i)]);
  else if(o==="cram")rank(i=>-weak(i));
  else if(o==="new")rank(i=>!S.rec[RK(i)]?0:S.rec[RK(i)].l===0?1:2);
  else if(o==="wrong")rank(i=>S.rec[RK(i)]&&S.rec[RK(i)].l===0?0:!S.rec[RK(i)]?1:2);
  return D.count==="all"?ids:ids.slice(0,D.count);}

  D.run={q:ids.map(id=>({id,flip:false,ok:null,ms:0,g:false})),i:0,done:false,label:label||"",x:{}};D.rf="all";

let tick=null,lastTick=0;
function curQ(){const r=D.run;return r&&!r.done?r.q[r.i]:null;}
function isOpen(cur){return !cur.flip;}
function stopTimer(){if(tick){clearInterval(tick);tick=null;}}
function startTimer(){stopTimer();lastTick=Date.now();
  tick=setInterval(()=>{const cur=curQ();if(!cur||!isOpen(cur)||route!=="drill"){stopTimer();return;}
    const now=Date.now(),dt=Math.min(now-lastTick,1000);lastTick=now;if(document.hidden)return;
    cur.ms+=dt;const el=$("#elapsed");if(el)el.textContent="⏱ 作答中 "+fmtMs(cur.ms);
    if(D.sec){const left=D.sec*1000-cur.ms,bar=$("#tbar"),lab=$("#tleft");
      if(bar)bar.style.width=Math.max(0,left/(D.sec*10))+"%";if(lab)lab.textContent="剩 "+Math.max(0,Math.ceil(left/1000))+" 秒";
      if(left<=0){stopTimer();cur.flip=true;cur.late=true;if(D.mode==="choice"&&cur.ok==null){cur.ok=false;cur.pick=-1;record(cur.id,false,cur.ms);}render();}}},100);}

function buildCount(){const sel=selIds();let m=sel.length;if(D.order==="due")m=sel.filter(isDue).length;else if(D.order==="only")m=sel.filter(i=>!S.rec[RK(i)]).length;

/* ---------- 跑考練習：作答與總檢討 ---------- */
function answerHTML(it){return `<div class="flip"><div class="big">${NM(it)}</div><div class="ans"><b>${LBL.f}：</b>${esc(plainTxt(it.f.join("；")))}<br><b>${LBL.c}：</b>${esc(plainTxt(it.c.join("；")))}</div></div>`;}

     <div class="row sched" id="nextdue"><span>下次複習：<b>${dueLabel(effDue(cur.id))}</b>${cur.g?'（用猜的，當成答錯）':cur.ok?(p&&p.sl?'（這題答得比較久，間隔縮短）':''):'（已進錯題本）'}</span>${cur.ok?`<button class="pill sm${cur.g?' on':''}" data-act="dguess" aria-pressed="${!!cur.g}">🎲 用猜的</button>`:''}</div>

/* ---------- 錯題本與收藏本 ---------- */
let W={sel:{},sort:"ch",out:""}, B={sel:{},sort:"ch",out:"",undo:[]};
const byCh=(a,b)=>CH.indexOf(chOf(a))-CH.indexOf(chOf(b));
function wrongIds(){const ids=wrongSet();

  else if(W.sort==="due")ids.sort((a,b)=>effDue(a)-effDue(b)||byCh(a,b));
  else ids.sort(byCh);return ids;}

function bookHead(pre,ids,sel,cols){const allOn=ids.length&&sel.length===ids.length;

function bookRows(pre,ids,selMap,grouped,cells){let last=null;const n=cells(ids[0]||"").length+3;

function wrongPage(){const ids=wrongIds(),sel=ids.filter(i=>W.sel[i]),n=sel.length,fixed=ids.filter(i=>S.rec[RK(i)].l===1).length;
  const cells=id=>{if(!id)return ["","",""];const p=S.rec[RK(id)];return [`<td class="cnt">${p.w}</td>`,`<td class="fix">${p.l===1?'<span class="okm" title="最近一次答對">✓</span>':'<span class="nom" title="最近一次答錯">✗</span>'}${p.g?'<div class="due">用猜的</div>':''}</td>`,`<td class="due">${dueLabel(effDue(id))}</td>`];};

   ${xbox(W.out,"wouttxt")}

     <li>答對後按「🎲 用猜的」：當成答錯來排，明天再出。</li><li>複習日最晚排在跑考前一天，間隔最長約剩餘天數的一半。</li></ul></section></div>`;}
function starPage(){const ids=starIds(),sel=ids.filter(i=>B.sel[i]),n=sel.length;const u=B.undo.length?B.undo[B.undo.length-1]:null;
  const cells=id=>{if(!id)return ["",""];const p=S.rec[RK(id)];return [`<td class="cnt">${p&&p.w?p.w:0}</td>`,`<td class="fix">${!p?'<span class="muted" title="還沒練過">—</span>':p.l===1?'<span class="okm" title="最近一次答對">✓</span>':'<span class="nom" title="最近一次答錯">✗</span>'}</td>`];};
  return `<div class="stack dp">

   <div class="chips"><button class="pill" data-act="go" data-r="drill">← 回跑考練習</button><button class="pill" data-act="go" data-r="wrongbook">錯題本 ${wrongSet().length}</button></div>
   ${u?`<div class="note g" id="starundo">剛才取消收藏了 ${Object.keys(u).length} 個${B.undo.length>1?`（還可以再往回復原 ${B.undo.length-1} 次）`:''}　<button class="jump" data-act="bundo" style="min-height:44px">↩ 復原</button></div>`:''}
   <div class="chips"><span class="muted" style="font-size:.88rem;align-self:center">排列方式</span>${[["ch","照章節"],["t","照收藏時間（新→舊）"]].map(s=>`<button class="pill${B.sort===s[0]?' on':''}" data-act="bsort" data-v="${s[0]}">${s[1]}</button>`).join("")}</div>
   ${xbox(B.out,"bouttxt")}
   <section class="card" style="padding:0;overflow:hidden">
    ${ids.length?`<div class="tablebox"><table class="wtable">${bookHead("b",ids,sel,["","章節",LBL.item,"錯的次數","最近作答"])}<tbody>${bookRows("b",ids,B.sel,B.sort==="ch",cells)}</tbody></table></div>`
     :`<p class="muted" style="padding:20px;margin:0">還沒有收藏。在跑考練習作答時按右上的「☆ 收藏」，或在各章的${LBL.item}卡按「☆ 收藏」，答對的也可以收藏，收藏的${LBL.item}會出現在這裡。</p>`}
   </section>
   <small class="muted">「最近作答」：✓ 最近一次答對、✗ 最近一次答錯、— 還沒練過。取消收藏後可以按「↩ 復原」，連續取消多次可以一次一次往回復原（重新整理網頁前有效）。</small></div>`;}
function practiceBox(){const tot=allIds().length,done=allIds().filter(i=>S.rec[RK(i)]).length,good=allIds().filter(i=>S.rec[RK(i)]&&S.rec[RK(i)].l===1&&!S.rec[RK(i)].g).length;

const root=document.createElement("div");root.id="app";document.body.appendChild(root);
function shell(){
  const c=CH.find(x=>x.id===route);
  const title=c?c.t:route==="wrongbook"?"錯題本":route==="starbook"?"收藏本":(TABS.find(t=>t[0]===route)||TABS[0])[1];
  root.innerHTML=`<header class="top"><div class="top-in">
    ${route!=="home"?'<button class="ibtn" data-act="go" data-r="home" aria-label="回首頁">← 首頁</button>':''}
    <div class="top-title">${route==="home"?esc(SD.site.topTitle||SD.site.h1):esc(title)}</div>
    <button class="ibtn" data-act="search" aria-label="搜尋">搜尋</button>
    <button class="ibtn${S.mask?' on':''}" data-act="mask" aria-pressed="${S.mask}">${S.mask?'遮重點：開':'遮重點'}</button></div></header>
   <div class="shell"><nav class="side" aria-label="目錄">
     <div class="cd">距離跑考 ${cdText()}${cdUnit()}</div>
     <button data-act="go" data-r="home" class="${route==="home"?'on':''}">首頁</button>
     ${F.atlas?`<div class="sec">章節</div>${CH.map((x,i)=>`<button data-act="go" data-r="${x.id}" class="${route===x.id||(GCH&&x.id===GCH.id&&route==="trays")?'on':''}">${i+1}. ${esc(x.t)}${S.done[x.id]?' ✓':''}</button>`).join("")}`:""}
     <div class="sec">複習工具</div>${[["key","講義標記（必考）"],["drill","跑考練習"],["wrongbook","錯題本"],["starbook","收藏本"],["mn","口訣總表"],["cmp","易混淆對照"]].filter(t=>(F.drill||!["drill","wrongbook","starbook"].includes(t[0]))&&(t[0]!=="mn"||MN.length)&&(t[0]!=="cmp"||CMP.length)).map(t=>`<button data-act="go" data-r="${t[0]}" class="${route===t[0]?'on':''}">${t[1]}</button>`).join("")}
   </nav><main class="wrap" id="main"></main></div>
   <nav class="tabs" aria-label="分頁" style="--tabs:${TABS.length}">${TABS.map(t=>`<button data-act="go" data-r="${t[0]}" class="${route===t[0]||(t[0]==="trays"&&GCH&&route===GCH.id)||(t[0]==="drill"&&(route==="wrongbook"||route==="starbook"))?'on':''}">${t[1]}</button>`).join("")}</nav>`;}
function render(){
  stopTimer();
  document.body.classList.toggle("mask",!!S.mask);
  document.body.classList.toggle("imgonly",imgOnly);
  document.body.classList.toggle("nodrill",!F.drill);document.body.classList.toggle("noatlas",!F.atlas);
  shell();
  const c=CH.find(x=>x.id===route);
  let h;
  if((GCH&&route===GCH.id)||route==="trays")h=traysPage();
  else if(c)h=chapter(c);
  else if(route==="key")h=keyPage();
  else if(route==="drill")h=drillPage();
  else if(route==="wrongbook")h=wrongPage();
  else if(route==="starbook")h=starPage();
  else if(route==="cmp")h=cmpPage();
  else if(route==="mn")h=mnPage();
  else h=home();
  $("#main").innerHTML=h;
  if(pendingScroll){const el=document.getElementById(pendingScroll);pendingScroll=null;if(el){el.scrollIntoView({block:"start"});window.scrollBy(0,-70);}}
  if(route==="drill"){const cur=curQ();if(cur&&isOpen(cur))startTimer();}
}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y);}
function toast(t,ms,cls){const o=$(".toast");if(o)o.remove();const d=document.createElement("div");d.className="toast"+(cls?" "+cls:"");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2200);}

let LB=null;
function openLB(btn){const list=[...document.querySelectorAll('#main [data-act="zoom"]')];
  LB={list:list.map(b=>({img:b.dataset.img,cap:b.dataset.cap||""})),i:Math.max(0,list.indexOf(btn)),z:1};drawLB();}
function drawLB(){let el=$(".lb");if(!el){el=document.createElement("div");el.className="lb";document.body.appendChild(el);}
  const cur=LB.list[LB.i],d=DIM[cur.img];const hide=S.mask||route==="drill"||/測驗/.test(cur.cap);
  el.innerHTML=`<div class="lb-bar"><button data-act="lbprev" aria-label="上一張">‹</button><button data-act="lbout" aria-label="縮小">－</button><button data-act="lbin" aria-label="放大">＋</button><button data-act="lbnext" aria-label="下一張">›</button><button data-act="lbclose">關閉</button></div>
   <div class="lb-view"><img src="${figSrc(cur.img)}" alt="" style="width:${Math.round(LB.z*100)}%;max-width:${Math.round(d[0]*1.6*LB.z)}px"></div>
   <div class="lb-cap">${hide?'':esc(cur.cap)+'　'}${LB.i+1} / ${LB.list.length}</div>`;}
function closeLB(){const el=$(".lb");if(el)el.remove();LB=null;}

/* ---------- 搜尋 ---------- */
function openSearch(){const el=document.createElement("div");el.className="sheet";el.id="sheet";
  el.innerHTML=`<div class="sheet-in"><div class="srow"><input id="sq" type="search" placeholder="${esc(LBL.searchHint||"輸入英文或中文")}" aria-label="搜尋"><button class="pill" data-act="sclose">關閉</button></div><div id="shits"></div></div>`;
  document.body.appendChild(el);const q=$("#sq");q.addEventListener("input",()=>drawHits(q.value));q.focus();drawHits("");}
function drawHits(v){v=v.trim().toLowerCase();const box=$("#shits");if(!box)return;
  if(!v){box.innerHTML='<p class="muted">可搜尋'+LBL.item+'名稱、'+LBL.f+'、'+LBL.c+'、'+LBL.group+'清單與口訣。</p>';return;}
  const hits=[];
  Object.entries(I).forEach(([id,it])=>{const txt=[it.n,it.z,it.f.join(" "),it.c.join(" "),it.ef||"",it.ec||"",it.hw||""].join(" ").toLowerCase();
    if(txt.includes(v))hits.push(`<button class="hit" data-act="jump" data-id="${id}"><b>${NM(it)}</b><small>${esc(chOf(id).t)}｜${esc(plainTxt(it.f[0]))}</small></button>`);});
  Object.entries(T).forEach(([tid,t])=>t.list.forEach(r=>{if((r[1]+" "+r[2]+" "+r[4]+" "+r[6]).toLowerCase().includes(v))hits.push(`<button class="hit" data-act="gotray" data-id="${tid}"><b>${esc(r[1])}(${esc(r[2])})</b><small>${esc(t.z)} ${r[0]} 號</small></button>`);}));
  MN.forEach(m=>{if((m.topic+m.mn+m.ans).toLowerCase().includes(v))hits.push(`<button class="hit" data-act="gomn" data-id="${m.id}"><b>口訣：${esc(m.mn)}</b><small>${esc(plainTxt(m.topic))}</small></button>`);});
  box.innerHTML=hits.length?hits.slice(0,60).join(""):'<p class="muted">找不到符合的內容。</p>';}
function closeSearch(){const el=$("#sheet");if(el)el.remove();}

/* ---------- 事件 ---------- */
document.addEventListener("click",ev=>{try{
  const k=ev.target.closest(".k");
  if(k&&S.mask&&!ev.target.closest("[data-act]")){k.classList.toggle("show");return;}
  if(k&&S.mask&&ev.target.closest('[data-act="jump"],[data-act="go"]')===null&&ev.target.closest("[data-act]")&&!k.classList.contains("show")){/* 交給下方 */}
  const b=ev.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="go"){closeSearch();chFilter="all";go(b.dataset.r);window.scrollTo(0,0);}
  else if(a==="mask"){S.mask=!S.mask;save();keepScroll(render);}
  else if(a==="search")openSearch();
  else if(a==="sclose")closeSearch();
  else if(a==="jump"){closeSearch();closeLB();const id=b.dataset.id,c=chOf(id);chFilter="all";go(c.id,"i-"+id);}
  else if(a==="gotray"){closeSearch();go("trays",b.dataset.id);}
  else if(a==="gomn"){closeSearch();mnFilter="all";go("mn",b.dataset.id);}
  else if(a==="scroll"){const el=document.getElementById(b.dataset.id);if(el){el.scrollIntoView({block:"start"});window.scrollBy(0,-70);}}
  else if(a==="star"){const id=b.dataset.id;if(S.star[id])delete S.star[id];else S.star[id]=Date.now();save();keepScroll(render);}
  else if(a==="chf"){chFilter=b.dataset.f;keepScroll(render);}
  else if(a==="imgonly"){imgOnly=!imgOnly;keepScroll(render);}
  else if(a==="keyf"){keyFilter=b.dataset.f;keepScroll(render);}
  else if(a==="mnf"){mnFilter=b.dataset.f;keepScroll(render);}
  else if(a==="zoom")openLB(b);
  else if(a==="lbclose")closeLB();
  else if(a==="lbin"){LB.z=Math.min(4,LB.z+0.5);drawLB();}
  else if(a==="lbout"){LB.z=Math.max(0.5,LB.z-0.5);drawLB();}
  else if(a==="lbprev"){LB.i=(LB.i-1+LB.list.length)%LB.list.length;LB.z=1;drawLB();}
  else if(a==="lbnext"){LB.i=(LB.i+1)%LB.list.length;LB.z=1;drawLB();}
  else if(a==="ans"){const key=b.dataset.c+"#"+b.dataset.i;if(S.quiz[key]!=null)return;S.quiz[key]=+b.dataset.j;save();
    keepScroll(()=>{render();const d=document.getElementById("quiz-"+b.dataset.c);if(d)d.open=true;});}
  else if(a==="requiz"){const c=b.dataset.c;Object.keys(S.quiz).forEach(k=>{if(k.startsWith(c+"#"))delete S.quiz[k];});save();
    keepScroll(()=>{render();const d=document.getElementById("quiz-"+c);if(d)d.open=true;});}
  else if(a==="done"){const c=b.dataset.c;const qs=QZ[c]||[];const nA=qs.filter((_,i)=>S.quiz[c+"#"+i]!=null).length;
    if(nA<qs.length){toast(`還有 ${qs.length-nA} 題沒作答`);const d=document.getElementById("quiz-"+c);if(d)d.open=true;return;}
    if(S.done[c])delete S.done[c];else S.done[c]=1;save();keepScroll(render);}
  else if(a==="copy"){const t=PROMPT;const ok=()=>toast("已複製提示詞");
    const fb=()=>{const p=$("#prompt");const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("已選取文字，請按複製");};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok).catch(fb);else fb();}
  else if(a==="editdate"){const r=$("#daterow");if(r)r.hidden=!r.hidden;}
  else if(a==="savedate"){const v=$("#examdate").value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)){S.exam=v;save();render();toast("已更新跑考日期");}else toast("請選一個日期");}
  else if(a==="resetdate"){S.exam="";save();render();toast("已恢復預設日期");}
  else if(a==="dunit"){if(b.checked)D.units.add(b.dataset.id);else D.units.delete(b.dataset.id);keepScroll(render);}
  else if(a==="dall"){D.units=new Set(b.dataset.v==="1"?DCH.map(c=>c.id):[]);keepScroll(render);}
  else if(a==="dcount"){D.count=b.dataset.v==="all"?"all":+b.dataset.v;keepScroll(render);}
  else if(a==="dorder"){D.order=b.dataset.v;keepScroll(render);}
  else if(a==="dmust"){D.must=b.dataset.v==="1";keepScroll(render);}
  else if(a==="dsec"){D.sec=+b.dataset.v;keepScroll(render);}
  else if(a==="dstart"){const ids=buildList();if(!ids.length){toast(selIds().length?"這個順序目前沒有可出的題目":"請至少選一個章節");return;}startRun(ids,"");}
  else if(a==="dfav"){startRun(shuffle(starSet()),"收藏");}
  else if(a==="dwrong"){startRun(shuffle(nowWrong()),"錯題");}
  else if(a==="dquick"){startRun(shuffle(dueSet()),"今天到期");}
  else if(a==="dredo"){startRun(shuffle(D.run.q.filter(x=>x.ok===false).map(x=>x.id)),"重練錯題");}
  else if(a==="dquit"){D.run.done=true;render();window.scrollTo(0,0);}
  else if(a==="dhome"){D.run=null;route="drill";try{location.hash="drill";}catch(e){}render();window.scrollTo(0,0);}
  else if(a==="drf"){D.rf=b.dataset.v;keepScroll(render);}
  else if(a==="dgo"){D.run.i=+b.dataset.i;render();}
  else if(a==="dprev"){if(D.run.i>0){D.run.i--;render();window.scrollTo(0,0);}}
  else if(a==="dnext"){const r=D.run;if(r.q[r.i].ok==null)return;if(r.i===r.q.length-1)r.done=true;else r.i++;render();window.scrollTo(0,0);}
  else if(a==="dflip"){const cur=curQ();if(cur&&!cur.flip){cur.flip=true;keepScroll(render);}}
  else if(a==="dopt"){const cur=curQ();if(!cur||cur.ok!=null)return;const it=I[cur.id];cur.pick=+b.dataset.v;cur.flip=true;cur.ok=cur.pick===it.mc.a;record(cur.id,cur.ok,cur.ms);keepScroll(render);}
  else if(a==="dmode"){D.mode=b.dataset.v;D.run=null;D.confirm=false;D.undo=null;W.sel={};W.out="";B.sel={};B.out="";keepScroll(render);}
  else if(a==="dloff"){saveOffline("dloff","下載離線版");}
  else if(a==="dltpl"){(async()=>{let dl=null;try{dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;}catch(e){dl=null;}
    if(dl){try{await dl.save({filename:"template.html",data:templateHTML()});toast("已下載 template.html");}catch(e){toast(e&&e.code==="declined"?"已取消下載":"無法下載，請改按「複製模板」");}return;}
    try{const x=document.createElement("a");x.href=URL.createObjectURL(new Blob([templateHTML()],{type:"text/html"}));x.download="template.html";document.body.appendChild(x);x.click();setTimeout(()=>{URL.revokeObjectURL(x.href);x.remove();},1000);toast("已下載 template.html");}catch(e){toast("無法下載，請改按「複製模板」");}})();}
  else if(a==="copytpl"){const t=templateHTML();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("模板已複製",800,"copied")).catch(()=>toast("複製失敗，請改用下載"));else toast("複製失敗，請改用下載");}
  else if(a==="dcard"){const cur=curQ();if(!cur||!cur.flip||cur.ok!=null)return;cur.ok=b.dataset.v==="ok";record(cur.id,cur.ok,cur.ms);keepScroll(render);}
  else if(a==="dguess"){const cur=curQ(),p=cur&&S.rec[RK(cur.id)];if(!cur||!cur.ok||!p)return;
    if(!cur.g){cur.prev={iv:p.iv,due:p.due};p.iv=0;p.due=twToday()+1;p.g=1;cur.g=true;}
    else{p.iv=cur.prev.iv;p.due=cur.prev.due;p.g=0;cur.g=false;}save();keepScroll(render);}
  else if(a==="dstar"){const id=b.dataset.id;if(S.star[id]){delete S.star[id];toast("已取消收藏");}else{S.star[id]=Date.now();toast("已收藏，可在收藏本查看");}save();keepScroll(render);}
  else if(a==="dx"){const t=outText([b.dataset.id]);D.run.x[b.dataset.id]=t;keepScroll(render);copyText(t);}
  else if(a==="dxround"){const ids=D.run.q.filter(x=>x.ok===false).map(x=>x.id);const t=outText(ids);D.run.x.round=t;keepScroll(render);copyText(t);}
  else if(a==="wsort"){W.sort=b.dataset.v;keepScroll(render);}
  else if(a==="wsel"){W.sel[b.dataset.id]=b.checked;keepScroll(render);}
  else if(a==="wall"){const ids=wrongSet();const all=ids.every(i=>W.sel[i]);ids.forEach(i=>W.sel[i]=!all);keepScroll(render);}
  else if(a==="wgo"){const ids=wrongIds().filter(i=>W.sel[i]);if(!ids.length){toast("先勾選要練習的"+LBL.item+"");return;}startRun(shuffle(ids),"錯題本勾選");}
  else if(a==="wout"){const ids=wrongIds().filter(i=>W.sel[i]);if(!ids.length){toast("先勾選要輸出的"+LBL.item+"");return;}W.out=outText(ids);keepScroll(render);copyText(W.out);}
  else if(a==="bsort"){B.sort=b.dataset.v;keepScroll(render);}
  else if(a==="bsel"){B.sel[b.dataset.id]=b.checked;keepScroll(render);}
  else if(a==="ball"){const ids=starSet();const all=ids.every(i=>B.sel[i]);ids.forEach(i=>B.sel[i]=!all);keepScroll(render);}
  else if(a==="bgo"){const ids=starIds().filter(i=>B.sel[i]);if(!ids.length){toast("先勾選要練習的"+LBL.item+"");return;}startRun(shuffle(ids),"收藏本勾選");}
  else if(a==="bout"){const ids=starIds().filter(i=>B.sel[i]);if(!ids.length){toast("先勾選要輸出的"+LBL.item+"");return;}B.out=outText(ids);keepScroll(render);copyText(B.out);}
  else if(a==="bun"){const ids=starIds().filter(i=>B.sel[i]);if(!ids.length){toast("先勾選要取消收藏的"+LBL.item+"");return;}
    const u={};ids.forEach(i=>{u[i]=S.star[i];delete S.star[i];});B.undo.push(u);B.out="";save();keepScroll(render);toast(`已取消收藏 ${ids.length} 個，可以按「↩ 復原」`);}
  else if(a==="bundo"){const u=B.undo.pop();if(!u)return;Object.keys(u).forEach(i=>{S.star[i]=u[i];B.sel[i]=true;});save();keepScroll(render);toast("已復原收藏");}
  else if(a==="wclear"){if(!modeKeys().length){toast("目前沒有作答紀錄");return;}D.confirm=true;keepScroll(render);}
  else if(a==="wcancel"){D.confirm=false;keepScroll(render);}
  else if(a==="wclear2"){const drop={},keep={};Object.keys(S.rec).forEach(k=>{(k.startsWith("C:")===(D.mode==="choice")?drop:keep)[k]=S.rec[k];});D.undo={rec:drop,tavg:S.tavg,known:S.known,sel:W.sel,n:Object.keys(drop).length};S.rec=keep;S.tavg={n:0,s:0};if(D.mode!=="choice")S.known={};W.sel={};W.out="";D.confirm=false;save();keepScroll(render);toast("已清除，可以按「↩ 復原紀錄」救回");}
  else if(a==="wundo"){if(!D.undo)return;Object.assign(S.rec,D.undo.rec);S.tavg=D.undo.tavg;S.known=D.undo.known;W.sel=D.undo.sel;D.undo=null;save();keepScroll(render);toast("已復原作答紀錄");}
}catch(e){console.error(e);toast("發生錯誤："+(e&&e.message||e));}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeLB();closeSearch();}});

route=parseHash();render();cloudInit();
})();
</script>
