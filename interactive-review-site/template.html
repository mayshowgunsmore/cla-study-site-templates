<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="claude:viewport-fit-sides" content="cover"><title>__TITLE__</title>
<style id="theme">
__THEME__
</style>
<style id="base">
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(78px + env(safe-area-inset-top,0px))}
body{margin:0;color:var(--ink);font:400 16.5px/1.75 var(--sans);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{line-height:1.35;text-wrap:balance;margin:0}
.en{font-family:var(--mono);font-size:.88em;letter-spacing:-.01em}

/* 骨架 */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.side{display:none}
.main{min-width:0;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);
  border-bottom:2px solid var(--line);display:flex;align-items:center;gap:8px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:60px}
.top-title{flex:1;min-width:0;font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title small{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted);line-height:1.2}
.icon-btn{min-width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:0 10px;background:var(--surface2);border:1.5px solid var(--line);font-weight:600;font-size:.86rem;white-space:nowrap}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon-btn[aria-pressed="true"]{background:var(--hi);border-color:var(--hi-ink);color:#2E2A24}
.wrap{max-width:800px;margin:0 auto;padding-block:18px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:2px solid var(--line);
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;text-decoration:none;
  color:var(--muted);font-size:.72rem;font-weight:600;min-height:56px}
.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:var(--blue)}
@media (min-width:980px){
  .app{grid-template-columns:292px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;
    background:var(--surface);border-right:2px solid var(--line);padding:16px 12px 24px;padding-left:max(12px,env(safe-area-inset-left,0px))}
  .tabs{display:none}
  .main{padding-bottom:40px}
  .wrap{max-width:880px;padding-block:24px 10px}
  .side h2{font-size:1.05rem;padding:4px 10px 12px}
  .side h2 small{display:block;font:500 .72rem var(--mono);color:var(--muted);margin-top:3px}
  .nav-link{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);
    font-size:.94rem;min-height:42px;line-height:1.3}
  .nav-link:hover{background:var(--surface2)}
  .nav-link.on{background:var(--hi-soft);color:var(--hi-ink);font-weight:700}
  .nav-link b{font:600 .74rem var(--mono);color:var(--muted);flex:none;width:30px}
  .nav-link.on b{color:var(--hi-ink)}
  .nav-link i{margin-left:auto;font:500 .72rem var(--mono);color:var(--muted);flex:none;font-style:normal}
  .side hr{border:0;border-top:1px solid var(--line);margin:8px 6px;width:calc(100% - 12px)}
}

/* 紙膠帶卡片 */
details.xcard>summary{list-style:none;cursor:pointer}
details.xcard>summary::-webkit-details-marker{display:none}
details.xcard>summary .xhint{display:inline-block;margin-top:6px;font-size:.8rem;color:var(--blue)}
details.xcard[open]>summary .xhint{color:var(--muted)}
details.xcard .xbody:not(:empty){margin-top:10px}
details.xcard .xbody .sec{margin:0}
details.xcard .xgo{display:block;text-align:right;font-size:.82rem;margin-top:6px}
.card{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;
  box-shadow:2px 3px 0 var(--line);padding:18px 18px 16px}
.card.tape::before{content:"";position:absolute;top:-11px;left:22px;width:76px;height:22px;background:var(--tape);
  opacity:.85;transform:rotate(-2.5deg);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 5px,transparent 5px 10px)}
.hero h1{font-size:clamp(1.4rem,6vw,2.1rem);font-weight:900;letter-spacing:.01em;margin-top:6px}
.hero h1 .u{background:linear-gradient(transparent 62%,var(--hi) 62%,var(--hi) 92%,transparent 92%);padding:0 2px}
.hero .ver{font:600 .78rem var(--mono);color:var(--muted);margin-left:6px}
.hero p{margin:8px 0 0;font-size:.95rem;color:var(--muted);line-height:1.65}
/* hero 方塊：直向排列，開闔欄位內嵌其中 */
.hero{display:flex;flex-direction:column;gap:11px;padding:20px 18px 16px}
.hero>p{margin:0}
.hero .fold{background:transparent;border:0;border-radius:0;box-shadow:none;padding:0}
.hero .fold>summary{min-height:40px;font-size:.92rem}
.hero .fold .body{padding:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:4px;box-shadow:2px 3px 0 var(--line);padding:14px}
.stat b{display:block;font:700 1.9rem/1.1 var(--mono);color:var(--blue)}
.stat span{font-size:.82rem;color:var(--muted)}
.stat.cnt b{color:var(--red)}
.cd-edit{display:flex;align-items:center;min-height:44px;margin-top:2px;font-size:.8rem;font-weight:700;color:var(--blue);text-decoration:underline;text-underline-offset:3px}
.cd-form{display:grid;gap:6px;margin-top:2px}
.cd-form[hidden]{display:none}
.cd-form input{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface2);font-size:16px}
.cd-row{display:flex;flex-wrap:wrap;gap:6px}
.cd-row .btn{min-height:40px;padding:6px 11px;font-size:.8rem}
.bar{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--hi);border-radius:9px;transition:width .25s}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:640px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
details.fold{background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:2px 14px}
details.fold>summary{min-height:46px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;list-style:none;font-size:.95rem}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";color:var(--muted);font-size:.9rem}
details.fold[open]>summary::before{content:"▾"}
.fold .body{padding:0 0 14px;font-size:.92rem;line-height:1.7;color:var(--ink)}
.fold .body p{margin:8px 0}
.fold .body ul{margin:6px 0;padding-left:1.2em}
pre.prompt{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border:1px solid var(--line);
  border-radius:4px;padding:12px;font:400 .82rem/1.6 var(--sans);max-height:300px;overflow:auto;margin:8px 0}
.ch-card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:4px;box-shadow:2px 3px 0 var(--line);padding:14px 16px;text-decoration:none;color:var(--ink)}
.ch-card:active{background:var(--surface2)}
.ch-card header{display:flex;align-items:baseline;gap:10px}
.ch-card header b{font:700 1rem var(--hand);color:var(--red);font-size:1.05rem}
.ch-card header span{margin-left:auto;font:500 .76rem var(--mono);color:var(--muted)}
.ch-card h3{font-size:1.05rem;font-weight:700}
.ch-card p{margin:0;font-size:.85rem;color:var(--muted);line-height:1.5}
h2.h{font-size:1.15rem;font-weight:800;margin-top:12px;display:flex;align-items:center;gap:8px}
h2.h::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--hi);border:2px solid var(--hi-ink);flex:none}
.lead{margin:0;color:var(--muted);font-size:.92rem;line-height:1.65}
.pill-link{display:flex;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);
  border-radius:4px;box-shadow:2px 3px 0 var(--line);padding:11px 14px;text-decoration:none;color:var(--ink);min-height:54px}
.pill-link span{min-width:0;flex:1;font-size:.95rem;font-weight:600}
.pill-link span small{display:block;color:var(--muted);font-size:.8rem;font-weight:400;margin-top:1px}
.pill-link em{font:600 .74rem var(--mono);color:var(--muted);font-style:normal;flex:none}

/* 章節頁 */
.ch-head{display:grid;gap:6px}
.ch-head h1{font-size:clamp(1.35rem,5.4vw,1.85rem);font-weight:900}
.ch-head h1 b{font-family:var(--hand);color:var(--red);font-size:1.1em;margin-right:6px}
.ch-head .sub{font:500 .8rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:42px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);
  font-weight:600;font-size:.86rem;line-height:1.3}
.btn:active{filter:brightness(.97)}
.btn.on{background:var(--hi);border-color:var(--hi-ink);color:#2E2A24}
.btn.primary{background:var(--main);border-color:var(--main);color:var(--on-main)}
.sec{background:var(--surface);border:1.5px solid var(--line);border-radius:4px;box-shadow:2px 3px 0 var(--line);overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 26px;gap:4px 8px;
  padding:13px 14px 13px 16px;align-items:start;min-height:58px}
.sec>summary::-webkit-details-marker{display:none}
.sec h3{font-size:1.03rem;font-weight:700;line-height:1.4}
.sec.read h3{color:var(--muted)}
.sec.read h3::before{content:"✓ ";color:var(--green);font-weight:900}
.sec .meta{grid-column:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:3px}
.sec .chev{grid-row:1;grid-column:2;width:22px;height:22px;margin-top:4px;fill:none;stroke:var(--muted);
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.sec[open] .chev{transform:rotate(180deg)}
.sec-body{padding:2px 16px 16px;border-top:1px dashed var(--line)}
.sec-body>*:first-child{margin-top:12px}
.sec-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.sec-foot .btn[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.sec .cardfav{margin-left:auto;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;
  min-width:36px;height:30px;padding:0 10px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;line-height:1}
.sec .cardfav[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--hi-ink);color:var(--hi-ink)}
.favch{margin:18px 0 8px;font-size:1rem}
.sec-foot .star[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--hi-ink);color:var(--hi-ink)}
.sec-foot .done[disabled]{opacity:.55;cursor:default}
.chip{display:inline-block;font-size:.7rem;font-weight:700;line-height:1;padding:4px 7px;border-radius:4px;white-space:nowrap}
.chip.must{background:var(--red-soft);color:var(--red)}
.chip.tone-blue{background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 0 0 1.5px currentColor}.chip.tone-green{background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 1.5px currentColor}.chip.tone-red{background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 1.5px currentColor}.chip.tone-gold{background:var(--hi-soft);color:var(--hi-ink);box-shadow:inset 0 0 0 1.5px currentColor}.chip.tone-gray{background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 1.5px currentColor}
.chip.nat{background:var(--blue-soft);color:var(--blue)}
.chip.past{background:var(--hi-soft);color:var(--hi-ink)}
.chip.freq{background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.chip.imp{background:var(--green-soft);color:var(--green)}
.chip.teach{background:var(--surface2);color:var(--muted)}
.chip.skip{background:var(--surface2);color:var(--muted)}
.chip.quiz{background:var(--blue-soft);color:var(--blue)}
.chip.page{background:none;color:var(--muted);font:500 .72rem var(--mono);padding:4px 0}
.sec-body h4{font-size:.98rem;font-weight:800;margin:18px 0 4px;color:var(--ink);
  display:inline-block;background:linear-gradient(transparent 60%,var(--hi-soft) 60%)}
.sec-body p{margin:8px 0}
.sec-body ul,.sec-body ol{margin:6px 0;padding-left:1.25em}
.sec-body li{margin:4px 0}
.sec-body li>ul{margin:2px 0}
.plain{background:var(--hi-soft);border-left:5px solid var(--hi);border-radius:0 4px 4px 0;padding:11px 13px;margin:12px 0;
  font-size:.93rem;line-height:1.7}
.plain b{display:block;font-size:.76rem;color:var(--hi-ink);margin-bottom:2px;letter-spacing:.04em}
body.recall .plain .pl{visibility:hidden}
.note{padding:11px 13px;border-radius:0 4px 4px 0;font-size:.9rem;line-height:1.65;margin:12px 0;border-left:5px solid}
.note b:first-child{display:block;font-size:.78rem;margin-bottom:2px}
.note.fix{background:var(--red-soft);border-color:var(--red)}
.note.fix b:first-child{color:var(--red)}
.note.tip{background:var(--blue-soft);border-color:var(--blue)}
.note.tip b:first-child{color:var(--blue)}
.note.teach{background:var(--green-soft);border-color:var(--green)}
.note.teach b:first-child{color:var(--green)}
.tw{overflow-x:auto;margin:12px 0;border:1.5px solid var(--line);border-radius:4px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.89rem;line-height:1.55}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td,tr:last-child th{border-bottom:0}
thead th{background:var(--surface2);font-weight:700;font-size:.82rem;white-space:nowrap}
tbody th{font-weight:700;background:color-mix(in srgb,var(--surface2) 50%,transparent);min-width:6em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gl{font-size:.86em;color:var(--muted)}
/* 遮重點 */
.k{font-weight:700;color:var(--blue)}
body.recall .k{color:transparent;background:var(--mask);border-radius:4px;cursor:pointer;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px;user-select:none}
body.recall .k.shown{color:var(--blue);background:var(--hi-soft)}
body.recall svg .lbl{opacity:0}
body.recall svg .lbl.shown{opacity:1}

/* 原圖 */
figure.orig{margin:14px 0;background:var(--surface2);border:1.5px solid var(--line);border-radius:4px;padding:8px}
figure.orig img{display:block;width:100%;height:auto;border-radius:3px;cursor:zoom-in;background:#fff}
figure.orig figcaption{font-size:.82rem;color:var(--muted);line-height:1.55;margin-top:7px}
figure.orig figcaption i{font-style:normal;font-family:var(--mono);font-size:.92em}
figure.dg{margin:14px 0;background:var(--surface);border:1.5px dashed var(--line);border-radius:4px;padding:10px}
figure.dg figcaption{font-size:.82rem;color:var(--muted);line-height:1.55;margin-top:6px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(20,16,10,.93);display:flex;flex-direction:column}
.lb img{flex:1;min-height:0;object-fit:contain;width:100%;touch-action:pinch-zoom}
.lb .lbbar{display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px));
  padding-top:calc(10px + env(safe-area-inset-top,0px));color:#F5EEDC}
.lb .lbcap{flex:1;font-size:.84rem;line-height:1.5}
.lb button{color:#F5EEDC;border:1.5px solid rgba(245,238,220,.5);border-radius:999px;min-width:44px;height:44px;padding:0 12px;font-weight:700}

/* 口訣 */
.mn{margin:14px 0;background:var(--surface);border:2px solid var(--hi);border-radius:4px;overflow:hidden;
  box-shadow:2px 3px 0 var(--hi-soft)}
.mn .mh{background:var(--hi-soft);padding:8px 12px;font-size:.78rem;font-weight:700;color:var(--hi-ink);
  display:flex;gap:6px;align-items:center}
.mn .mb{padding:10px 12px 12px}
.mn .mq{font-size:.82rem;color:var(--muted)}
.mn .mm{font-family:var(--hand);font-size:1.3rem;line-height:1.4;color:var(--red);margin:4px 0 8px;font-weight:700}
.mn .me{font-size:.9rem;line-height:1.7}

/* 互動圖 */
.wg{margin:14px 0;border:2px solid var(--blue);border-radius:4px;overflow:hidden;background:var(--surface)}
.wg-h{display:flex;gap:8px;align-items:center;padding:9px 12px;background:var(--blue-soft);font-weight:700;
  font-size:.88rem;line-height:1.35;color:var(--blue)}
.wg-h>svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wg-b{padding:12px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.wg-b.split{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.wg svg.fig{display:block;width:100%;max-width:440px;margin:0 auto;height:auto;overflow:visible}
figure.dg svg.fig{display:block;width:100%;max-width:440px;margin:0 auto;height:auto;overflow:visible}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:42px;min-width:44px;padding:6px 11px;border-radius:999px;background:var(--surface2);
  border:1.5px solid var(--line);font-weight:600;font-size:.85rem;line-height:1.25}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.info{font-size:.92rem;line-height:1.65;min-width:0;background:var(--surface2);border-radius:4px;padding:10px 12px}
.info h5{font-size:.98rem;font-weight:700;margin:0 0 4px}
.info ul{margin:4px 0;padding-left:1.15em}
.info li{margin:3px 0}
.fig .pt{fill:var(--surface);stroke:var(--blue);stroke-width:2.4;cursor:pointer}
.fig .pt.on{fill:var(--red);stroke:var(--red)}
.fig text{font-family:var(--sans)}

/* 本節測驗 */
.quiz{margin:16px 0 0;border:2px solid var(--blue);border-radius:4px;overflow:hidden;background:var(--surface)}
.quiz>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 13px;
  background:var(--blue-soft);font-weight:700;color:var(--blue);font-size:.92rem;min-height:46px}
.quiz>summary::-webkit-details-marker{display:none}
.quiz>summary::before{content:"▸";font-size:.85rem}
.quiz[open]>summary::before{content:"▾"}
.quiz>summary .qstat{margin-left:auto;font:500 .76rem var(--mono);color:var(--blue)}
.quiz-body{padding:6px 13px 14px}
.qitem{padding:14px 0;border-bottom:1px dashed var(--line)}
.qitem:last-child{border-bottom:0}
.qsrc{font:500 .74rem var(--mono);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px}

const PROMPT=/*PROMPT*/"# 互動式複習網站（通用版提示詞）\n\n請用我附上的 **template.html**（複習網站「網頁提示詞」裡按「下載網站模板」取得）加上我的教材（今年上課講義、共筆等）與題庫，做出同一套互動式複習網站，只是換成我的科目。全站用台灣繁體中文，英文專有名詞後面加（中文）；測驗的題幹與選項例外（見「本節測驗」）。請在可以執行程式、上傳檔案的環境使用。\n\n**做法：模板已經包含全部功能與版面，不要重寫或修改模板程式。** 你只要準備：\n- `data.json`：這一科的內容與設定，格式照最下方「data.json 規範」。\n- `theme.css`：配色風格，只放 CSS 變數。\n- `fig/` 資料夾：從教材裁切的原圖（JPEG）。\n\n再用程式把 data.json 與 theme.css 填進模板，輸出成網站，連同 fig/ 一起發布。\n\n## 開始前一次問完\n1. **科目與考試**：科目名稱、考試名稱與日期、考試範圍對應哪些檔案。\n2. **資料**：請我上傳今年上課講義、共筆，以及題庫或考古題（有的話）。我附的每一份都是有效來源，**主要依據預設是今年上課講義**，共筆與其他資料補充；內容不一致時以主要依據為準並標出另一邊的說法。我也可能直接在對話裡口述補充或指定重點，那也算來源。沒有 template.html 或沒有教材，就先跟我要，不要自己編內容。\n3. **風格**：請我用文字描述想要的感覺（例如簡潔清爽、柔和粉彩、沉穩專業），或給顏色碼、參考網站；先整理成配色摘要（主色、強調色、背景、主要按鈕色、深色模式）給我確認再開工。\n4. **標題區**：學校、系級、學期、作者署名；不想寫的留空，網站上就不顯示。\n5. **版本號**：沒指定就用 v1.0。\n\n## 內容原則\n1. 讀完範圍內每一份資料（講義、共筆、老師補充檔），包含圖片裡的文字、螢光筆與手寫註記（PDF 抽字抽不到的要把頁面轉成圖片看過）。依章節整理成好掃讀的重點與表格，每節標出 PDF 頁碼（用程式搜尋標題算實際頁碼，不用頁尾數字）。\n2. 抽查各份資料之間的差異。不一致處不要直接改掉，保留主要依據的寫法，用提示框附上另一份的說法和頁碼，也列進不一致清單；是自己推論的要講明。\n3. 主要依據以外、但其他資料或考古題考過的內容可以放，要標示來源，不可混進主要依據的內容裡。\n\n## 讓內容好懂\n- **白話說**：每節開頭 2～5 句白話說明，不超出提供的資料，可用比喻。\n- **中文註解**：把用到的英文專有名詞與中文譯名整理成 `gloss`，網頁會自動加註。\n- **口訣**：要背的考點都設計口訣，放在該段內文旁；每則有考點、口訣、解開，標明是自編。\n- **示意圖**：重要但沒有好原圖的敘述，自己畫 SVG 示意圖，註明非實際比例，答案文字可被遮住，不要為了數量硬做。圖上的數字與敘述都要是資料裡有寫的。\n- **互動圖**：挑最需要空間想像、分類、步驟或數字比較的主題，做成點按鈕或點圖會換說明的 SVG。\n\n## 教材原圖\n**優先用今年講義的圖**，講義沒有或畫質太差才用共筆或其他資料的圖。把資料裡的圖片與圖片形式的表格取出來：**能用原始圖檔就用原始圖檔**（PDF 用 PyMuPDF 取內嵌圖、docx 用 `pandoc --extract-media`），畫質最好也不會截歪；每頁都出現的背景、校徽略過。圖上另外疊了標註、箭頭、引線，或一張圖由好幾塊拼成時，原始圖檔缺了這些，改用 PyMuPDF 依圖在頁面上的位置（連同貼著它的標註一起框進來）以原圖解析度、至少 200 dpi 渲染那一區；掃描檔與向量繪圖也這樣渲染裁切。最後一律存成寬度上限 1300px、JPEG 品質 80，穿插在它所說明的段落旁，不要集中在節末。每張附自己寫的圖說，頁碼要註明是哪一份資料（例 `講義 L03 p.12`），完成後做一張總覽圖逐張核對位置與圖說。\n\n## 必考篩選\n**我附的每一份資料都可以有標記**，不要只找共筆：講義或共筆的文字標記（必考、必背、很重要、重要、國考、老師提到、可先略過）、講義上的螢光筆或手寫註記、老師上課說的、以及我在對話裡直接口述指定的，都算明寫的標記，要自己判斷並註明出處（我口述的就寫「使用者指定」）。引用原文並附是哪一份資料的第幾頁。不可把你自己判斷的重點標成必考；標可略過但考古題考過的，要註明不建議略過。某一份資料幾乎沒有標記時要提醒別因此跳過。\n\n- **高頻必考（內建）**：除了資料明寫的必考標記，另外依考古題重複出現的次數標「高頻必考」：同一考點（正解相同）出現在 3 份以上考卷（含國考）的，該節 `tags` 加 `freq`，並在 `key` 加一筆 `t:\"freq\"`（`q` 寫考點、`p` 列出所有考卷）。這是依頻率判定，不是老師說的，和明寫的必考分開標、可以並存；門檻不同時改 `labels.freqTip` 說明。\n- **自訂標籤**：某一科需要另一種篩選（例如實驗課跑考、口試、臨床相關）時，用 `tagDefs` 定義標籤名稱並開篩選鈕，在相關的節 `tags` 加上代號，不要改模板。必考標記頁需要新分類時（例如換老師後的「講義重點」，或考古題常考、但今年講義沒教到而降級的「舊課考點」），一樣在 `tagDefs` 定義（可給 `tone`、`tip`、`plain`），`key` 的 `t` 寫這個代號。\n\n## 本節測驗\n每節後面放小測驗，目的是幫助記住該節的知識點。先列出該節要記的知識點（必考與考古題考過的優先），題數依知識點多寡決定，通常 3～8 題：每個重要知識點至少一題，同一個知識點不重複出題。題目先從我提供的考題挑（答案與詳解沿用來源），題庫沒涵蓋到的重要知識點再依提供的資料自編，題庫題與自編題的比例由你判斷。\n- 模板已內建**錯題本**（答錯自動收進來）與**複習卡收藏**（每一節是一張複習卡，節標題右邊的「☆」收進來，收藏頁顯示整節內容）；題目本身不另做收藏，也不做記憶曲線。\n- **題庫題的題幹與選項完全照原文**：不改寫、不翻譯、不加也不刪中文、不換選項順序。只有合併重複題（採最舊那卷的原文）與原文缺漏時可以動；缺漏先用同一題的其他卷別補，沒有再依資料補，補上的字用〔 〕括起來，在 `doubt` 寫明補了什麼、依據哪份資料第幾頁。\n- **自編題的專有名詞只寫英文**：題幹與選項裡的藥名、受體、構造、病名等一律只寫英文、不加中文，題幹其餘用中文；中文只放在答完後的詳解，寫成「英文(中文)」。模板不會在題幹與選項加註，不要改模板。\n- 自編題標「自編」並寫明依據的資料名稱與頁碼，正解位置分散，不出資料裡沒寫的內容。要看圖但沒有圖的題目、多選題、和網站內容互相矛盾的題目先略過，記進 `doubt`。\n\n## 組裝\n`site.storageKey` 與 `site.dbDoc` 取這個網站專用的名字（英數小寫加連字號），發布後永遠不要改，否則大家的進度會接不上。寫好後用這段程式組成網站：\n\n```python\nimport json,re\nt=open('template.html',encoding='utf-8').read()\nD=json.load(open('data.json',encoding='utf-8'))\ndata=json.dumps(D,ensure_ascii=False,separators=(',',':')).replace('<\/','<\\\\/').replace('\u003c!--','\\\\u003c!--').replace('\u003cscript','\\\\u003cscript')\ntheme=open('theme.css',encoding='utf-8').read()\ndef put(pat,new):\n    global t; t,n=re.subn(pat,lambda m:new,t,count=1,flags=re.S); assert n==1,pat\nput(r'(?<=\u003cscript id=\"site-data\" type=\"application/json\">).*?(?=<\/script>)',data)\nput(r'(?<=<style id=\"theme\">).*?(?=<\/style>)','\\n'+theme+'\\n')\nput(r'(?<=<title>).*?(?=<\/title>)',D['site']['pageTitle'])\nopen('index.html','w',encoding='utf-8').write(t)\n```\n\n發布時把 index.html 和 fig/ 一起放上去（在 Claude 發布時，要開啟儲存進度的 db、user，以及「下載網站模板」「下載離線版」用的 downloads 權限）。首頁的「下載離線版」會把網站和 figCaptions 列到的全部原圖打包成一個 HTML 檔，斷網也能用，模板已內建，不用另外做，所以每張原圖都要列在 figCaptions。首頁的「進度備份」可以把作答紀錄、收藏與考試日期下載成一個 .json 檔，上傳時選「合併」或「取代」（可復原，別的網站的進度檔會被拒收），用來換裝置或在線上版與離線版之間搬進度，同樣是模板內建、用同一個 downloads 權限，不用另外做。\n\n## 完成前檢查\n1. 用程式檢查 data.json：節 id 不重複、每個穿插錨點在該節剛好出現一次、每張原圖都放到且只放一次、口訣與示意圖代號不重複、每節測驗 3～8 題、答案在選項內、詳解數等於選項數。\n2. 用手機、平板、寬螢幕尺寸實際操作：互動圖、每一題測驗、複習卡收藏與取消收藏（節標題的☆按下不會開合該節）、錯題本與複習卡收藏頁、標記完成（要答完才能按）、底部分頁、修改倒數日期、篩選、原圖放大、遮重點和搜尋、進度備份的下載與上傳（合併、取代、復原），確認都有反應、圖片載得出來、沒有錯誤訊息、沒有左右捲動，淺色與深色模式都好讀。\n3. 之後要修改時只改 data.json、theme.css 或圖片再重新組裝，並先問我新的版本號。\n4. 回報：最後附一張**編號的「待你確認」清單**（每條寫遇到什麼、你怎麼處理、要改會變成怎樣），我才能直接回第幾項要改；另外列資料不一致清單、哪些內容不在主要依據內（註明來源）、必考標記各自來自哪一份資料、題庫題與自編題各有多少、哪些是自編內容（白話說、譯名、口訣、示意圖），以及測試過和沒測到的部分。\n\n## data.json 規範（interactive-review-site/1）\n\n網站＝模板（固定程式與版面）＋ data.json（這一科的內容）＋ theme.css（風格）＋ fig/ 資料夾（共筆原圖，檔名＝原圖代號.jpg）。只寫 data.json、theme.css 與圖片，不改模板。全站台灣繁體中文。\n\n文字欄位的格式：\n- **HTML**：可用一般標籤（`<ul> <ol> <li> <p> <h4> <b> <table>`、`<div class=\"tw\">` 包表格、`<div class=\"note fix|tip|teach\"><b>標題<\/b>內容<\/div>` 提示框）。\n- **==關鍵字==**：遮重點時會蓋住的字，可用在內文、口訣解開、互動圖說明。\n- 一般文字欄位（標題、出處、圖說）不要放 HTML。\n\n用工具組 build 時，`build.py` 會先跑 `scripts/validate.py` 檢查這份規範：❌ 錯誤（網站會壞掉或違反規範）就不輸出網站；⚠️ 提醒（例如測驗題數不在 3～8、正解詳解沒以「正確」開頭）照樣輸出，確認是故意的就可以留著。\n\n### 最上層\n```json\n{\"schema\":\"interactive-review-site/1\",\"site\":{},\"labels\":{},\"tagDefs\":{},\"info\":[],\"howto\":[],\"keyTip\":\"\",\"sprint\":{},\"css\":\"\",\n \"chapters\":[],\"figSize\":{},\"figCaptions\":{},\"mnemonics\":{},\"diagrams\":{},\"widgets\":{},\"place\":{},\n \"key\":[],\"fix\":[],\"extra\":[],\"hot\":[],\"doubt\":[],\"cmp\":[],\"num\":[],\"gloss\":{},\"quiz\":{},\n \"features\":{},\"favNote\":\"\",\"wrongNote\":\"\",\"verdictPatterns\":[]}\n```\n**必填**：`site`、`chapters`。其餘可省略（省略時當成空的）。\n\n### site（網站設定）\n| 欄位 | 說明 |\n|---|---|\n| pageTitle | **必填**。網頁名稱（分頁與 Artifact 標題），例 `學校_科目期末複習_學期_作者_v1.0` |\n| name / version | **必填**。首頁小字的網站名稱與版本，例 `學校_科目期末複習_學期_作者`、`v1.0` |\n| title / sub | **必填**。左側目錄頂端的短標題與小字，例 `病理 期末複習`、`1151 ・ 作者 ・ v1.0` |\n| h1 | **必填**。首頁大標，例 `病理學期末複習` |\n| heroLine | 接在網站名稱後的一行說明（可空），例 `　1151 學年・醫學系　範圍：共筆 n01–n08` |\n| examName / examDefault | **必填**。考試名稱與預設日期 `YYYY-MM-DD`，倒數用 |\n| storageKey / dbDoc | **必填**。存檔名稱（英數小寫加連字號，例 `school-patho-fin`、`progress`）。**發布後永遠不可改**，否則進度會不見 |\n| contentVersion | 可選。**內容大改版、節的切法變動時才換一個新值**（例 `2026-11-15`）。值一變，使用者下次開啟會做一次性進度搬移：有 `secMap` 就只保留 map 裡對應得到的節，沒有就只保留仍存在的節 id；題目集合會變所以測驗與錯題一律清掉，考試倒數日期保留。本機與雲端兩條路徑都會搬。沒設這個欄位的網站完全不受影響 |\n| secMap | 可選，搭配 `contentVersion` 用：`{\"舊節 id\":\"新節 id\"}`。節重新切分或改代號時給它，進度才對得上；沒給就只留仍存在的節 id |\n| chapterHeading / foot | 首頁章節區標題、頁尾小字（可放版權提醒） |\n| tabs | 可選。底部分頁與順序，只能用 `home`、`key`、`sprint`、`cmp`、`num`、`mn`、`wrong`、`fav`；沒給就是這八個全開（沒有內容的自動隱藏） |\n\n**改到既有的測驗題時不必動 `contentVersion`**：作答存成「節 id#題號」，但模板會一併存題幹＋選項的指紋，下次開啟比對不符就只丟掉那一題的作答與錯題。所以在節中間插題、調換題序、改寫題目都不會讓使用者看到別題的舊答案，不必刻意只往後加題；題目沒動的作答完全保留。\n\n### labels（教材來源字樣，可省略）\n模板預設把教材統稱「教材」。主要依據是共筆、講義或其他教材時，用這裡改成實際的名稱，整站說明才會正確。沒給就用預設。\n\n| 欄位 | 預設 | 說明 |\n|---|---|---|\n| must | `教材標必考` | 章節頁「必考」篩選鈕與必考標籤的字 |\n| keySub | `只收教材明寫的字樣，引用原文並附頁碼；不含本站自行判斷的重點` | 必考標記頁副標 |\n| sprintSub | `考古題重複出現的考點、教材疑誤、教材以外但考過的內容` | 考前衝刺頁副標 |\n| mnSub | `全部為本站自編，不是教材或老師提供；開啟遮重點可以蓋住解答來默背` | 口訣總表頁副標 |\n| freq | `高頻必考` | 內建「高頻必考」標籤、章節頁篩選鈕與必考標記頁分類的字 |\n| freqTip | `依考古題重複出現的次數判定（同一考點出現在 3 份以上考卷），只代表常考，不等於教材或老師標的必考。` | 必考標記頁「高頻必考」的判定說明；判定門檻不同時要改 |\n\n疑誤表自己的標題與表頭另外用 `sprint.fixTitle`、`sprint.fixHead`、`sprint.extraTitle` 改。\n\n例：以共筆為主 → `{\"must\":\"共筆標必考\",\"keySub\":\"只收共筆明寫的字樣…\"}`。依考古題頻率判定的重點不要塞進 `must`，改用內建的 `freq`（見下方 tags 與 key），兩種標記可以並存。\n\n### 首頁文字\n- `info`：「網頁說明」段落 `[{\"h\":\"範圍\",\"t\":\"HTML\"}]`。可用代換：`{chapters}` 份數、`{secs}` 節數、`{figs}` 原圖、`{keys}` 必考標記、`{quizSecs}` 有測驗的節、`{qTotal}` 題數、`{qSelf}` 自編題、`{gloss}` 註解、`{mn}` 口訣、`{diag}` 示意圖、`{wg}` 互動圖。\n- `howto`：「怎麼用」每一條（HTML），可用 `{examDefaultMD}`（預設考試日 M/D）。\n- `keyTip`：必考頁「全部／可先略過」時顯示的提示框 HTML，可空。\n- `sprint`：`{\"hotTitle\":\"重複考點標題（預設「考古題重複出現的考點」）\",\"hotLead\":\"考過的考點來源說明\",\"fixLead\":\"教材疑誤的說明\",\"fixTitle\":\"疑誤表標題（預設「教材疑誤」）\",\"fixHead\":[\"教材寫法\",\"對照\",\"怎麼記\"],\"extraTitle\":\"教材以外、但考古題考過的內容\",\"doubtTitle\":\"doubt 清單標題（預設「沒有收進測驗、或答案要再確認的考古題」）\"}`，每個都可省；`fixHead` 要剛好三格。\n- `favNote`、`wrongNote`：收藏頁、錯題本頁標題下的說明文字（純文字），可省，沒給用模板預設。\n- `css`：這一科專用的 CSS，例如示意圖的組織色 token（淺色、深色各一組），可空。\n\n### chapters（各份共筆）\n```json\n{\"id\":\"n01\",\"no\":\"n01\",\"t\":\"細胞損傷\",\"en\":\"Cell Injury\",\"teacher\":\"老師\",\"date\":\"9/10\",\"pdf\":\"共筆 n01（20 頁）\",\"note\":\"\",\n \"secs\":[{\"id\":\"n01-1\",\"t\":\"節標題\",\"src\":\"n01 p.1–5\",\"tags\":[\"must\",\"past\"],\"plain\":\"白話說 2～5 句\",\"html\":\"<ul><li>…==關鍵字==…<\/li><\/ul>\"}]}\n```\n- 章節的 `id`、`no`、`t`、`secs` 必填，節的 `id`、`t`、`src`、`html` 必填；`plain`、`tags` 可省。\n- 節 `id` 是進度存檔的 key，發布後不可改。`tags`：`must` 教材標必考、`freq` 高頻必考（考古題重複出現，預設門檻 3 份以上考卷）、`past` 考過、`nat` 國考、`imp` 很重要。任一節標了 `freq`，章節頁就多一顆「高頻必考」篩選鈕；沒用到時不出現。\n- `note`：這一章要注意的事（紅色提示框），可空。\n\n### tagDefs（自訂節標籤，可省略）\n`{\"run\":{\"name\":\"跑考\",\"filter\":true}}`（`name` 必填；代號不可和內建標籤 `must`、`freq`、`past`、`nat`、`imp`、`teach`、`skip` 重複）：除了內建的 `must`、`freq`、`past`、`nat`、`imp`，還可以自訂標籤代號（英數小寫），節的 `tags` 裡寫這個代號就會顯示 `name` 的字。`filter:true` 時章節頁的篩選鈕會多一顆，只留有這個標籤的節。標籤顏色可直接給 `tone`（`blue`、`green`、`red`、`gold`、`gray`，跟著配色自動適應淺色與深色），要更細的樣式再用 `css` 寫 `.chip.代號{…}`；配套的提示框可用 `<div class=\"note 代號\">`，同樣在 `css` 定義樣式。例：實驗課跑考、口試、臨床相關。\n\n**自訂必考標記**：`key` 的 `t` 也可以寫 tagDefs 的代號，必考標記頁就自動多一個以 `name` 命名的分類（排在「高頻必考」後面）。可另給 `tip`（該分類的判定說明，選到這個分類或「全部」時顯示）與 `plain:true`（卡片文字不加引號，用在不是引用原文、而是本站整理的標記）。例：\n`{\"lec\":{\"name\":\"講義重點\",\"tone\":\"blue\",\"plain\":true,\"tip\":\"今年講義用整頁、整張表或投影片標題在講的內容…\"},\"old\":{\"name\":\"舊課考點\",\"tone\":\"gray\",\"plain\":true,\"tip\":\"考古題常考、但今年講義沒教到的考點…\"}}`\n\n### 原圖\n- `figCaptions`：`{\"n01-p3-1\":[\"圖說（自己依圖與前後文寫）\",\"n01 p.3\"]}`，代號＝檔名，圖片放 `fig/n01-p3-1.jpg`。每張原圖都要列在這裡，「下載離線版」靠它找出要打包的圖。\n- `figSize`：`{\"n01-p3-1\":[\"n01-p3-1\",寬,高]}`，用來預留空間；每張原圖都要有。\n\n### 口訣、示意圖、互動圖\n- `mnemonics`：`{\"m1\":{\"sec\":\"n01-1\",\"p\":\"考點\",\"m\":\"口訣本身\",\"e\":\"解開（==關鍵字==）\"}}`\n- `diagrams`：`{\"d1\":{\"sec\":\"n01-2\",\"cap\":\"圖說（自繪示意圖，非實際比例）\",\"svg\":\"<svg class=\\\"fig\\\" viewBox=\\\"0 0 440 200\\\">…<\/svg>\"}}`；答案文字加 `class=\"lbl\"`，遮重點時會蓋住。顏色用 theme 或 `css` 裡的 token。\n- `widgets`：`{\"w1\":{\"sec\":\"n01-3\",\"t\":\"標題\",\"svg\":\"<svg class=\\\"fig\\\" …>…<circle class=\\\"pt\\\" data-k=\\\"a\\\" …/>…<\/svg>\",\"opts\":[[\"a\",\"按鈕文字\",\"說明 HTML\"],…]}}`；圖上可點的元素加 `class=\"pt\" data-k=\"代號\"`，和 opts 的代號對應；`opts` 每一項剛好三格 `[代號,按鈕文字,說明 HTML]`，至少一項。\n- 代號（原圖、口訣、示意圖、互動圖）全站不可重複。\n\n### place（穿插位置）\n`{\"n01-1\":[[\"錨點文字\",\"n01-p3-1\"],[\"錨點文字\",\"m1\"],[\"@end\",\"d1\"]]}`：項目插在該節 html 裡錨點文字所在的那段（`<\/li>`、`<\/p>` 等）後面；`@end` 放節末；項目寫 `@skip` 表示這一列先不放（暫時保留）。錨點要在該節剛好出現一次；同一段要放好幾個項目時沿用同一個錨點。每張原圖都要放到且只放一次。\n\n### 必考、衝刺、對照、數字\n- `key`、`fix`、`extra`、`hot` 的 **`sec` 必填**，而且要是存在的節 id（網頁靠它顯示章節編號，少了會整頁壞掉）；`num` 的 `sec` 可省（給了就能點一列跳到該節）。下面列出的其他欄位都必填。\n- `key`：`[{\"t\":\"must|imp|nat|teach|skip|freq|tagDefs 代號\",\"sec\":\"n01-2\",\"q\":\"引用共筆原文\",\"p\":\"n01 p.4\"}]`\n  - `t:\"freq\"`（高頻必考）：`q` 寫考點（可寫成「題幹　答：正解」），`p` 寫出現過的考卷（例 `1141-16、1132-15、1122-15（3 卷）`）。有 `freq` 項目時，必考標記頁多一個「高頻必考」分類並顯示 `labels.freqTip`；這類卡片不加引號，因為不是引用原文。\n- `fix`（共筆疑誤）：`[{\"sec\",\"t\":\"項目\",\"n\":\"共筆寫法\",\"h\":\"對照（講義頁碼）\",\"r\":\"怎麼記\"}]`\n- `extra`（共筆以外但考過）：`[{\"sec\",\"t\",\"s\":\"來源\",\"d\":\"內容\"}]`\n- `hot`（考古題重複考點）：`[{\"sec\",\"t\",\"n\":\"出處\"}]`\n- `doubt`：沒收進測驗或答案待確認的題目說明（文字陣列，每筆一段純文字）\n- `cmp`（易混淆對照）：`[{\"g\":\"分組\",\"t\":\"標題\",\"h\":[\"表頭\",…],\"rows\":[[\"格\",…],…]}]`，每列格數＝表頭數，格內可用簡單 HTML\n- `num`（數字速查）：`[{\"g\":\"分組\",\"v\":\"數字\",\"d\":\"是什麼\",\"sec\":\"n01-1\"}]`\n\n### features（功能開關）\n`{\"wrong\":true,\"fav\":true,\"quizSource\":\"section\"}`，都可省略；`wrong`、`fav` 預設開啟。`quizSource` 決定測驗詳解下方「出處」顯示什麼：`section`（預設）顯示該節的 `src`，`question` 改顯示每題自己的 `s`（題庫題來自不同考卷時用）。`wrong` 錯題本：答錯的題目自動收進來，只在網站有測驗時出現；`fav` 複習卡收藏：每一節就是一張複習卡，節標題右邊的「☆」（或節末「☆ 收藏這張卡」）收進來，收藏頁照章分組顯示整節內容（含原圖、跑考卡、測驗），可依章篩選、搜尋。題目本身不另做收藏。兩者都跟著帳號同步（複習卡收藏沿用存檔的 star 欄位，舊網站的「待複習」標記會直接變成收藏）。`site.tabs` 沒給時底部分頁預設是首頁、必考、衝刺、對照、數字、口訣、錯題、收藏（沒有內容的自動隱藏）；有自訂 `site.tabs` 時要把 `wrong`、`fav` 放進去才會出現在底部分頁（左側目錄一律有）。\n\n### gloss（中文註解）\n`{\"biofilm\":\"生物膜\"}`：英文專有名詞 → 中文，網頁會自動在英文後面加（中文），同一節只註第一次。\n\n### quiz（本節測驗）\n`{\"n01-1\":[{\"s\":\"出處\",\"q\":\"題幹\",\"o\":[\"選項\",…],\"a\":0,\"e\":[\"正確答案。…\",\"錯。…\",…],\"k\":\"重點\",\"t\":\"易錯（可省略）\",\"self\":false}]}`\n- 每節題數依知識點多寡，通常 3～8 題（每個重要知識點至少一題，不重複考同一點）；`a` 是 0 起算的正解索引；`e` 與 `o` 數量相同，正解那項以「正確」開頭。\n- 自編題 `self:true`，`s` 寫依據的共筆頁碼；正解位置要分散。題幹與選項的專有名詞只寫英文、不加中文，`e` 裡第一次出現時寫成「英文(中文)」。\n- 題庫題的 `q`、`o` 照原文，不改寫、不翻譯；模板不會在題幹與選項加中文註解。\n- `s`、`q`、`o`、`a`、`e`、`k` 必填，至少 2 個選項；`a` 是整數。\n\n### verdictPatterns（詳解判定語，可省略）\n詳解開頭的判定語（例「正確答案。」「錯。」）會被抽出來變成小標籤，避免和內文重複。預設 `[[\"^正確答案。\\\\s*\",\"正解\"],[\"^對的敘述。\\\\s*\",\"正確敘述\"],[\"^錯。\\\\s*\",\"錯\"]]`。這一科的詳解用別的寫法時，自己列：每筆 `[\"正規表示式\",\"標籤\"]`，標籤可用 `$1` 帶入括號內的字，寫 `null` 表示只刪掉判定語、不顯示標籤；依序比對，第一個符合的生效。有給 `verdictPatterns` 時，正解詳解就不必以「正確」開頭。\n\n### theme.css（風格）\n只放 CSS 變數；淺色寫在 `:root{}`，深色寫兩次：`@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){…}}` 與 `:root[data-theme=\"dark\"]{…}`。\n| 變數 | 用途 |\n|---|---|\n| --paper、--grid | 頁面底色、背景格線 |\n| --surface、--surface2、--line | 卡片底、次要底、框線 |\n| --ink、--muted | 主文字、次要文字 |\n| --blue、--blue-soft | 連結、測驗、互動圖、關鍵字顏色 |\n| --main、--on-main | 主要按鈕底色與字色 |\n| --red/-soft、--green/-soft | 章節編號與疑誤框、白話與完成 |\n| --hi、--hi-soft、--hi-ink | 螢光筆強調、口訣框、遮重點按鈕 |\n| --tape、--mask | 卡片紙膠帶、遮重點色塊 |\n| --good、--bad | 答對、答錯 |\n| --sans、--hand、--mono | 內文、標題與口訣、數字字型 |\n"/*/PROMPT*/;

/* ---------- 中文註解 ---------- */
const GKEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
function annotate(root,reject){
  const rej=reject||'svg,code,pre,.gl,.chip,.sbar,.tabs,.side,select,option,.lbbar,.src,figcaption,.quiz,.qsrc,.qfoot,.qlab,.qq,.qo';
  const seen=new Set();
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const p=n.parentElement;if(!p)return NodeFilter.FILTER_REJECT;
    if(p.closest(rej))return NodeFilter.FILTER_REJECT;
    return n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    let txt=node.nodeValue,out=null;
    for(const term of GKEYS){
      if(seen.has(GLOSS[term]))continue;
      const caps=/^[A-Z0-9:\-]+$/.test(term);
      const re=new RegExp('(^|[^A-Za-z0-9\\-])('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![A-Za-z0-9\\-])',caps?'':'i');
      const m=re.exec(txt);if(!m)continue;
      const after=txt.slice(m.index+m[0].length);
      if(/^\s*[（(]/.test(after))continue;
      const before=txt.slice(0,m.index);
      if((before.split('（').length-1)>(before.split('）').length-1))continue;
      const box=node.parentElement.closest('.sec-body,.info,.mn,.card,.qitem,.qres');
      if(box&&(box.textContent||'').includes(GLOSS[term])){seen.add(GLOSS[term]);continue}
      seen.add(GLOSS[term]);
      out=document.createDocumentFragment();
      out.appendChild(document.createTextNode(txt.slice(0,m.index+m[0].length)));
      const sp=document.createElement('span');sp.className='gl';sp.textContent='（'+GLOSS[term]+'）';
      out.appendChild(sp);out.appendChild(document.createTextNode(after));
      break;
    }
    if(out)node.parentNode.replaceChild(out,node);
  });
}

function buildSec(sec){
  let html=sec.html;const list=(PLACE[sec.id]||[]).filter(x=>x[1]!=='@skip');const tail=[];
  const groups=[];const map={};
  list.forEach(([a,id])=>{const h=itemHTML(id);if(!h)return;
    if(a==='@end'){tail.push(h);return}
    if(!map[a]){map[a]={a,h:[]};groups.push(map[a])}map[a].h.push(h)});
  const close=['</li>','</p>','</ol>','</ul>','</div>','</td></tr>'];
  groups.forEach(g=>{
    const i=html.indexOf(g.a);if(i<0){tail.push(...g.h);return}
    const j=i+g.a.length;let best=-1;
    if(close.some(c=>html.slice(0,j).endsWith(c)&&c!=='</td></tr>'))best=j;
    else{['</li>','</p>','</ol>','</ul>','</div>'].forEach(c=>{const k=html.indexOf(c,j);if(k>=0&&(best<0||k+c.length<best))best=k+c.length})}
    if(best<0){tail.push(...g.h);return}
    html=html.slice(0,best)+g.h.join('')+html.slice(best);
  });
  return mark(html+tail.join(''));
}

const VPAT=(SD.verdictPatterns||[["^正確答案。\\s*","正解"],["^對的敘述。\\s*","正確敘述"],["^錯。\\s*","錯"]])

  let tag='',t=String(txt);
  for(const [re,f] of VPAT){const m=t.match(re);if(m){if(!f)break;tag=f(m);t=t.slice(m[0].length);break}}

}

}
function qItemHTML(secId,i,wrongPage){
  const id=qid(secId,i),ans=ST.quiz[id];
  const show = wrongPage ? REVEAL.has(id) : (ans!==undefined && !REDO.has(id));
  const sel = show ? (ans===undefined?null:ans) : null;
  return `<div class="qitem" data-qitem="${id}">${qItemInner(secId,i,show,sel)}</div>`;
}
function quizHTML(secId){
  const a=Q[secId];if(!a||!a.length)return '';
  const n=a.length,na=quizAnsweredCount(secId);
  const correct=a.filter((q,i)=>ST.quiz[qid(secId,i)]===q.a).length;
  return `<details class="quiz"><summary>本節測驗　${n} 題<span class="qstat">已答 ${na}／${n}・答對 ${correct}</span></summary>
    <div class="quiz-body">${a.map((_,i)=>qItemHTML(secId,i)).join('')}</div></details>`;
}
/* 作答 */
function doAnswer(secId,i,k){
  const id=qid(secId,i),q=Q[secId][i];
  ST.quiz[id]=k;{const f=lsGet(LS.qfp,{});f[id]=qfp(secId,i);lsSet(LS.qfp,f);}
  if(k!==q.a){const w=ST.wrong[id]||{n:0};w.n=(w.n||0)+1;ST.wrong[id]=w;}
  REDO.delete(id);REVEAL.delete(id);
  save();
}

function chip(t){const d=TAGDEF[t];return `<span class="chip ${t}${d&&d.tone?' tone-'+d.tone:''}">${esc(TAGN[t]||t)}</span>`}
function pct(ids){const n=ids.filter(i=>ST.done[i]).length;return ids.length?Math.round(n*100/ids.length):0}
/* 以台灣時間的日曆天計算：考試當天＝0，已過為負數 */
function days(){const t=new Date(Date.now()+8*3600e3);
  const today=Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate());
  const[y,m,d]=examStr().split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-today)/864e5)}
function cdShort(){const d=days();return d>0?`考前 ${d} 天`:(d===0?'今天考試':'考試已結束')}
function cdHTML(){
  const d=days(),s=examStr(),md=s.slice(5).replace('-','/');
  const big=d>0?d:(d===0?'今天':'—');
  const EN=esc(SD.site.examName||'考試');const lab=d>0?`天後${EN}（${md}）`:(d===0?`${EN}（${md}）`:`${EN}已結束（${md}）`);
  return `<div class="stat cnt"><b class="num">${big}</b><span>${lab}${ST.exam?'・自訂日期':''}</span>
    <button type="button" class="cd-edit" data-cdedit>修改日期</button>
    <div class="cd-form" hidden><input type="date" id="cdinput" value="${s}" aria-label="${EN}日期">
      <div class="cd-row"><button type="button" class="btn" data-cdsave>儲存</button><button type="button" class="btn" data-cdreset>恢復預設</button></div></div></div>`;
}

function wrongTop(id,s){return `<div class="wr-top"><span class="wr-n">答錯 ${(ST.wrong[id]&&ST.wrong[id].n)||1} 次</span>`
  +`<a class="chip past" href="#${s}" style="text-decoration:none">${SECS[s].ch.no}　${esc(SECS[s].t)}</a></div>`}
function wrongFoot(id,s){return `<div class="qfoot"><button type="button" class="btn" data-reveal="${id}">看答案</button>`
  +`<a class="btn" href="#${s}">跳到該節</a><button type="button" class="btn" data-rmwrong="${id}">移出錯題本</button></div>`}
function wrongCount(){return Object.keys(ST.wrong).filter(id=>{const s=id.split('#')[0];return SECS[s]&&Q[s]}).length}
function pageWrong(){
  const q=(ST.wrongQ||'').trim().toLowerCase(), cf=ST.wrongCh||'all';
  const live=id=>{const s=id.split('#')[0];return SECS[s]&&Q[s]};
  let ids=Object.keys(ST.wrong).filter(live);
  const total=ids.length;
  if(cf!=='all')ids=ids.filter(id=>SECS[id.split('#')[0]].ch.id===cf);
  if(q)ids=ids.filter(id=>{const[s,i]=id.split('#');const it=Q[s][+i];return (it.q+' '+it.o.join(' ')).toLowerCase().includes(q)});
  ids.sort((a,b)=>{const[sa,ia]=a.split('#'),[sb,ib]=b.split('#');return ALLSECS.indexOf(sa)-ALLSECS.indexOf(sb)||(+ia)-(+ib)});
  const chs=[...new Set(Object.keys(ST.wrong).filter(live).map(id=>SECS[id.split('#')[0]].ch.id))];
  return `<div class="ch-head"><h1>錯題本</h1><div class="sub">${esc(SD.wrongNote||'答錯的題目會自動收進來，重新作答也不會消失')}</div></div>
  ${total===0?'<p class="empty">還沒有錯題。到各節的「本節測驗」作答，答錯的會自動出現在這裡。</p>':`
  <input class="wr-search" type="search" id="wrsearch" placeholder="搜尋題幹或選項…" value="${esc(ST.wrongQ||'')}" autocomplete="off">
  <div class="wr-filter">${[['all','全部章']].concat(CH.filter(c=>chs.includes(c.id)).map(c=>[c.id,c.no])).map(([k,n])=>`<button class="btn${cf===k?' on':''}" data-wc="${k}">${n}</button>`).join('')}</div>
  <p class="lead">共 ${total} 題錯題${q||cf!=='all'?`，顯示 ${ids.length} 題`:''}</p>
  ${ids.length?ids.map(id=>{const s=id.split('#')[0];
    return `<div class="wrong-card" data-qitem="${id}">${wrongTop(id,s)}${qItemHTML(s,+id.split('#')[1],true).replace(/^<div class="qitem"[^>]*>|<\/div>$/g,'')}${wrongFoot(id,s)}</div>`}).join(''):'<p class="empty">這個條件下沒有錯題</p>'}`}`;
}

  const total=ids.length,chs=[...new Set(ids.map(id=>SECS[id].ch.id))];
  if(cf!=='all')ids=ids.filter(id=>SECS[id].ch.id===cf);
  if(q)ids=ids.filter(id=>{const x=SECS[id];return (x.t+' '+(x.plain||'')+' '+String(x.html||'').replace(/<[^>]+>/g,' ')).toLowerCase().includes(q)});
  const groups=CH.map(c=>[c,ids.filter(id=>SECS[id].ch.id===c.id)]).filter(g=>g[1].length);
  return `<div class="ch-head"><h1>複習卡收藏</h1><div class="sub">${esc(SD.favNote||'每一節就是一張複習卡：按節標題右邊的「☆」或節末的「☆ 收藏這張卡」就會收進來，考前集中複習')}</div></div>
  ${total===0?'<p class="empty">還沒有收藏的複習卡。到各章，在想再看的節按標題右邊的「☆」。</p>':`
  <input class="wr-search" type="search" id="favsearch" placeholder="搜尋卡片標題或內容…" value="${esc(ST.favQ||'')}" autocomplete="off">
  <div class="wr-filter">${[['all','全部章']].concat(CH.filter(c=>chs.includes(c.id)).map(c=>[c.id,c.no])).map(([k,n])=>`<button class="btn${cf===k?' on':''}" data-fc="${k}">${n}</button>`).join('')}</div>
  <p class="lead">共 ${total} 張複習卡${q||cf!=='all'?`，顯示 ${ids.length} 張`:''}</p>
  ${groups.length?groups.map(([c,l])=>`<h2 class="favch">${esc(c.no)}　${esc(c.t)}</h2><div class="grid">${l.map(id=>secHTML(SECS[id],false)).join('')}</div>`).join(''):'<p class="empty">這個條件下沒有收藏的複習卡</p>'}`}`;
}
/* ---------- 路由 ---------- */
const TABDEF={home:['首頁',I.home],key:['必考',I.key],sprint:['衝刺',I.fire],cmp:['對照',I.cmp],num:['數字',I.num],mn:['口訣',I.mn],wrong:['錯題',I.wrong],fav:['收藏',I.fav]};
const LEN=x=>Array.isArray(x)?x.length:(x&&typeof x==='object'?Object.keys(x).length:0);
const TABS=((SD.site.tabs&&SD.site.tabs.length?SD.site.tabs:['home','key','sprint','cmp','num','mn','wrong','fav'])
  .filter(k=>TABDEF[k]&&(k!=='wrong'||(F.wrong&&LEN(Q)))&&(k!=='fav'||F.fav)&&(k!=='mn'||LEN(MN))&&(k!=='cmp'||LEN(CMP))&&(k!=='num'||LEN(NUM)))).map(k=>[k,TABDEF[k][0],TABDEF[k][1]]);
function route(){
  const h=(location.hash||'#home').slice(1);
  let body='',title='',sub='';
  if(CH.find(c=>c.id===h)){const c=CH.find(c=>c.id===h);body=pageCh(h);title=c.no+'　'+c.t;sub=c.en}
  else if(SECS[h]){const s=SECS[h];body=pageCh(s.ch.id);title=s.ch.no+'　'+s.ch.t;sub=s.ch.en}
  else if(h==='key'){body=pageKey();title='必考標記'}
  else if(h==='sprint'){body=pageSprint();title='考前衝刺'}
  else if(h==='cmp'){body=pageCmp();title='易混淆對照'}
  else if(h==='num'){body=pageNum();title='數字速查'}
  else if(h==='mn'){body=pageMn();title='口訣總表'}
  else if(h==='wrong'&&F.wrong){body=pageWrong();title='錯題本'}
  else if(h==='fav'&&F.fav){body=pageFav();title='複習卡收藏'}
  else {body=pageHome();title=SITE.title;sub=SITE.sub}
  const isHome=!(h&&h!=='home');
  SHELL.innerHTML=`
  <nav class="side">${sideHTML(h)}</nav>
  <div class="main">
    <header class="top">
      ${isHome?'':`<button class="icon-btn" id="gohome" aria-label="回首頁">${icon(I.back)}</button>`}
      <div class="top-title">${esc(title)}${sub?`<small>${esc(sub)}</small>`:''}</div>
      <button class="icon-btn" id="dosearch" aria-label="搜尋">${icon(I.search)}</button>
      <button class="icon-btn" id="dorecall" aria-pressed="${ST.pref.recall}" aria-label="遮重點">${icon(I.eye)}<span>遮</span></button>
    </header>
    <div class="wrap">${body}</div>
  </div>
  <nav class="tabs">${TABS.map(([k,n,p])=>`<a href="#${k}" class="${(h===k||(k==='home'&&isHome))?'on':''}">${icon(p)}${n}</a>`).join('')}</nav>`;
  document.body.classList.toggle('recall',!!ST.pref.recall);
  initWidgets();
  const wrap=SHELL.querySelector('.wrap');
  annotate(wrap);
  annotateQuiz(wrap);
  if(SECS[h]){const d=document.getElementById(h);if(d){d.open=true;setTimeout(()=>d.scrollIntoView({block:'start'}),30)}}
  else window.scrollTo(0,0);
}
function sideHTML(h){
  const all=pct(ALLSECS);
  return `<h2><a href="#home" style="text-decoration:none;color:inherit">${SITE.title}</a>
    <small>${SITE.sub}　${cdShort()}　${all}%</small></h2>
  ${CH.map(c=>{const ids=c.secs.map(s=>s.id);
    return `<a class="nav-link${h===c.id||(SECS[h]&&SECS[h].ch.id===c.id)?' on':''}" href="#${c.id}">
    <b>${c.no}</b>${esc(c.t)}<i>${pct(ids)}%</i></a>`}).join('')}
  <hr>
  ${[['key','必考標記'],['sprint','考前衝刺'],['mn','口訣總表'],['cmp','易混淆對照'],['num','數字速查']]
    .concat(F.wrong&&LEN(Q)?[['wrong','錯題本（'+wrongCount()+'）']]:[])
    .concat(F.fav?[['fav','複習卡收藏（'+favCount()+'）']]:[])
    .map(([k,n])=>`<a class="nav-link${h===k?' on':''}" href="#${k}"><b></b>${n}</a>`).join('')}`;
}

/* ---------- 互動圖 ---------- */
function initWidgets(){
  SHELL.querySelectorAll('[data-wg]').forEach(el=>{
    const w=WG[el.dataset.wg];if(!w||el.dataset.wgon)return;el.dataset.wgon='1';
    const info=el.querySelector('[data-info]');
    const pick=k=>{
      const o=w.opts.find(x=>x[0]===k);if(!o)return;
      info.innerHTML=mark(o[2]);
      el.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
      el.querySelectorAll('svg .pt').forEach(p=>p.classList.toggle('on',p.dataset.k===k));
      annotate(info);
    };
    el.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.k)));
    el.querySelectorAll('svg .pt').forEach(p=>p.addEventListener('click',()=>pick(p.dataset.k)));
    pick(w.opts[0][0]);
  });
}

/* ---------- 放大檢視 ---------- */
let lbList=[],lbIdx=0;
function openLB(id){
  lbList=Array.from(SHELL.querySelectorAll('img[data-fig]')).map(i=>i.dataset.fig);
  lbIdx=Math.max(0,lbList.indexOf(id));
  const box=document.createElement('div');box.className='lb';box.id='lightbox';
  box.innerHTML=`<div class="lbbar"><button type="button" data-lb="prev">‹</button><button type="button" data-lb="next">›</button>
    <div class="lbcap"></div><button type="button" data-lb="close">關閉</button></div><img alt="">`;
  document.body.appendChild(box);drawLB();
  box.addEventListener('click',e=>{
    const a=e.target.closest('[data-lb]');if(!a)return;
    if(a.dataset.lb==='close')box.remove();
    else{lbIdx=(lbIdx+(a.dataset.lb==='next'?1:-1)+lbList.length)%lbList.length;drawLB()}
  });
}
function drawLB(){
  const box=document.getElementById('lightbox');if(!box)return;
  const f=FIG[lbList[lbIdx]];
  box.querySelector('img').src=figSrc(f[0]);
  box.querySelector('img').alt=f[1];
  box.querySelector('.lbcap').textContent=`${lbIdx+1}／${lbList.length}　${f[1]}（${f[2]}）`;
}

/* ---------- 搜尋（測驗內容不列入） ---------- */
function openSearch(){
  const box=document.createElement('div');box.className='sbox';box.id='sbox';
  box.innerHTML=`<div class="sbar"><input type="search" id="sq" placeholder="搜尋內容、白話說、口訣、圖說…" autocomplete="off">
    <button class="icon-btn" type="button" id="sclose">關閉</button></div><div class="sres" id="sres"></div>`;
  document.body.appendChild(box);
  const inp=box.querySelector('#sq'),res=box.querySelector('#sres');
  const strip=h=>String(h).replace(/<[^>]+>/g,'').replace(/==/g,'');
  const idx=[];
  CH.forEach(c=>c.secs.forEach(s=>{
    let t=strip(s.html)+' '+s.plain+' '+s.t;
    (PLACE[s.id]||[]).forEach(([,id])=>{
      if(FIG[id])t+=' '+FIG[id][1];
      if(DIAG[id])t+=' '+DIAG[id].cap;
      if(MN[id])t+=' '+MN[id].p+' '+MN[id].m+' '+strip(MN[id].e);
      if(WG[id])t+=' '+WG[id].t+' '+WG[id].opts.map(o=>o[1]+' '+strip(o[2])).join(' ');
    });
    idx.push({id:s.id,t:s.t,ch:c.no+'　'+c.t,text:t});
  }));
  const run=()=>{
    const q=inp.value.trim();
    if(q.length<1){res.innerHTML='<p class="empty">輸入關鍵字開始搜尋</p>';return}
    const low=q.toLowerCase();
    const hits=idx.filter(x=>x.text.toLowerCase().includes(low)).slice(0,60);
    res.innerHTML=hits.length?hits.map(x=>{
      const i=x.text.toLowerCase().indexOf(low);
      const s=Math.max(0,i-30),frag=x.text.slice(s,i)+'<mark>'+esc(x.text.slice(i,i+q.length))+'</mark>'+x.text.slice(i+q.length,i+q.length+60);
      return `<a href="#${x.id}" data-go><b>${esc(x.t)}</b><span>${esc(x.ch)}</span><span>…${esc(frag).replace(/&lt;mark&gt;/g,'<mark>').replace(/&lt;\/mark&gt;/g,'</mark>')}…</span></a>`
    }).join(''):'<p class="empty">找不到</p>';
  };
  inp.addEventListener('input',run);run();
  box.querySelector('#sclose').addEventListener('click',()=>box.remove());
  res.addEventListener('click',e=>{if(e.target.closest('[data-go]'))box.remove()});
  setTimeout(()=>inp.focus(),50);
}

/* ---------- 重繪單一題目 ---------- */
function rerenderQitem(id,wrongPage){
  const el=SHELL.querySelector(`[data-qitem="${CSS.escape(id)}"]`);if(!el)return;
  const[s,i]=id.split('#');
  if(wrongPage){
    const show=REVEAL.has(id);
    const top=wrongPage==='fav'?favTop:wrongTop,foot=wrongPage==='fav'?favFoot:wrongFoot;
    el.innerHTML=top(id,s)+qItemInner(s,+i,show,show?null:(ST.quiz[id]===undefined?null:ST.quiz[id]))+foot(id,s);
    annotate(el,QREJ);return;
  }
  const ans=ST.quiz[id],show=ans!==undefined&&!REDO.has(id);
  el.innerHTML=qItemInner(s,+i,show,show?ans:null);
  annotate(el,QREJ);
}
function refreshSecFoot(secId){
  const det=document.getElementById(secId);if(!det)return;
  const foot=det.querySelector('.sec-foot');if(!foot)return;
  const old=foot.querySelector('[data-done]');if(old)old.outerHTML=doneBtnHTML(SECS[secId]);
  const qd=det.querySelector('.quiz>summary .qstat');
  if(qd){const a=Q[secId],na=quizAnsweredCount(secId),correct=a.filter((q,i)=>ST.quiz[qid(secId,i)]===q.a).length;
    qd.textContent=`已答 ${na}／${a.length}・答對 ${correct}`}
}

/* ---------- 事件 ---------- */
document.addEventListener('toggle',e=>{const c=e.target;if(c&&c.matches&&c.matches('details.xcard'))try{fillX(c)}catch(err){console.error(err)}},true);
document.addEventListener('click',e=>{
  try{
    const t=e.target;
    // 測驗作答
    const ans=t.closest('[data-ans]');
    if(ans&&!ans.disabled){const[s,i,k]=ans.dataset.ans.split('|');doAnswer(s,+i,+k);
      rerenderQitem(qid(s,+i));refreshSecFoot(s);
      const side=document.querySelector('.side');if(side)side.innerHTML=sideHTML(location.hash.slice(1));return}
    const wc=t.closest('[data-wc]');if(wc){ST.wrongCh=wc.dataset.wc;route();return}
    const fc=t.closest('[data-fc]');if(fc){ST.favCh=fc.dataset.fc;route();return}
    const fv=t.closest('[data-fav]');if(fv){const id=fv.dataset.fav;toggleFav(id);
      if(location.hash==='#fav'&&!ST.fav[id]){route();return}
      SHELL.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach(b=>{b.outerHTML=favBtn(id)});
      const side=document.querySelector('.side');if(side)side.innerHTML=sideHTML(location.hash.slice(1));return}
    const rev=t.closest('[data-reveal]');if(rev){REVEAL.add(rev.dataset.reveal);rerenderQitem(rev.dataset.reveal,location.hash==='#fav'?'fav':true);return}
    const rmw=t.closest('[data-rmwrong]');if(rmw){delete ST.wrong[rmw.dataset.rmwrong];save();route();return}
    const rmf=t.closest('[data-rmfav]');if(rmf){delete ST.fav[rmf.dataset.rmfav];save();route();return}
    const redo=t.closest('[data-redo]');
    if(redo){const[s,i]=redo.dataset.redo.split('|');REDO.add(qid(s,+i));rerenderQitem(qid(s,+i));return}
    // 考試倒數：修改日期
    if(t.closest('[data-cdedit]')){const f=SHELL.querySelector('.cd-form');
      if(f){f.hidden=!f.hidden;if(!f.hidden){const i=f.querySelector('input');if(i)i.focus()}}return}
    if(t.closest('[data-cdsave]')){const v=(document.getElementById('cdinput')||{}).value||'';
      if(/^\d{4}-\d{2}-\d{2}$/.test(v)){ST.exam=v===EXAM_DEFAULT?'':v;save();route()}return}
    if(t.closest('[data-cdreset]')){ST.exam='';save();route();return}

    if(t.closest('#gohome')){location.hash='#home';return}
    if(t.closest('#dosearch')){openSearch();return}
    if(t.closest('#dorecall')){ST.pref.recall=!ST.pref.recall;save();
      document.body.classList.toggle('recall',ST.pref.recall);
      const b=document.getElementById('dorecall');if(b)b.setAttribute('aria-pressed',ST.pref.recall);
      document.querySelectorAll('.k.shown,svg .lbl.shown').forEach(x=>x.classList.remove('shown'));return}
    if(document.body.classList.contains('recall')){
      const k=t.closest('.k');if(k){k.classList.toggle('shown');return}
      if(t.closest('svg')&&t.classList&&t.classList.contains('lbl')){t.classList.toggle('shown');return}
      const fg=t.closest('figure.dg,.wg');
      if(fg&&t.tagName!=='BUTTON'){fg.querySelectorAll('svg .lbl').forEach(l=>l.classList.toggle('shown'));return}
    }
    const img=t.closest('img[data-fig]');if(img){openLB(img.dataset.fig);return}
    const d=t.closest('[data-done]');if(d){if(d.disabled)return;const id=d.dataset.done;
      if(ST.done[id])delete ST.done[id];else ST.done[id]=1;save();
      const det=document.getElementById(id);if(det){det.classList.toggle('read',!!ST.done[id]);const open=det.open;
        d.setAttribute('aria-pressed',!!ST.done[id]);d.textContent=ST.done[id]?'✓ 已完成':'標記完成';det.open=open}
      const side=document.querySelector('.side');if(side)side.innerHTML=sideHTML(location.hash.slice(1));
      return}
    const s=t.closest('[data-star]');if(s){e.preventDefault();e.stopPropagation();const id=s.dataset.star;
      if(ST.star[id])delete ST.star[id];else ST.star[id]=1;save();
      if(location.hash==='#fav'&&!ST.star[id]){route();return}
      SHELL.querySelectorAll(`[data-star="${CSS.escape(id)}"]`).forEach(b=>{const on=!!ST.star[id];b.setAttribute('aria-pressed',on);
        b.textContent=b.classList.contains('cardfav')?(on?'★':'☆'):(on?'★ 已收藏':'☆ 收藏這張卡');b.title=on?'取消收藏':'收藏這張複習卡'});
      const side=document.querySelector('.side');if(side)side.innerHTML=sideHTML(location.hash.slice(1));return}
    const f=t.closest('[data-filter]');if(f){ST.filter=f.dataset.filter;route();return}
    const kt=t.closest('[data-kt]');if(kt){ST.keyType=kt.dataset.kt;route();return}
    const kc=t.closest('[data-kc]');if(kc){ST.keyCh=kc.dataset.kc;route();return}
    const cc=t.closest('[data-cc]');if(cc){ST.cmpCh=cc.dataset.cc;route();return}
    const nc=t.closest('[data-nc]');if(nc){ST.numCh=nc.dataset.nc;route();return}
    const mc=t.closest('[data-mc]');if(mc){ST.mnCh=mc.dataset.mc;route();return}
    if(t.closest('#openall')){SHELL.querySelectorAll('details.sec').forEach(x=>x.open=true);return}
    if(t.closest('#closeall')){SHELL.querySelectorAll('details.sec').forEach(x=>x.open=false);return}
    if(t.closest('#dloff')){saveOffline('dloff','下載離線版');return}
    if(t.closest('#dltpl')){(async()=>{let dl=null;try{dl=(window.claude&&claude.use)?await claude.use('downloads'):null}catch(e){dl=null}
      const msg=s=>{const b=document.getElementById('dltpl');if(b){b.textContent=s;setTimeout(()=>{const x=document.getElementById('dltpl');if(x)x.textContent='下載網站模板'},1800)}};
      if(dl){try{await dl.save({filename:'template.html',data:templateHTML()});msg('已下載 ✓')}catch(e){msg(e&&e.code==='declined'?'已取消':'無法下載，請改按複製模板')}return}
      try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([templateHTML()],{type:'text/html'}));a.download='template.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);msg('已下載 ✓')}catch(e){msg('無法下載，請改按複製模板')}})();return}
    if(t.closest('#copytpl')){const b=t.closest('#copytpl');navigator.clipboard?.writeText(templateHTML()).then(()=>{b.textContent='模板已複製 ✓';setTimeout(()=>b.textContent='複製模板',1600)}).catch(()=>{b.textContent='複製失敗，請改用下載'});return}
    if(t.closest('#copyprompt')){
      const btn=t.closest('#copyprompt');
      navigator.clipboard?.writeText(PROMPT).then(()=>{btn.textContent='已複製 ✓';setTimeout(()=>btn.textContent='複製提示詞',1600)})
        .catch(()=>{const p=document.getElementById('promptbox');const r=document.createRange();r.selectNodeContents(p);
          const sel=getSelection();sel.removeAllRanges();sel.addRange(r);btn.textContent='已選取，請手動複製'});
      return}
  }catch(err){
    const w=SHELL.querySelector('.wrap');
    if(w){const n=document.createElement('div');n.className='note fix';n.innerHTML='<b>這個動作出了狀況</b>'+esc(err.message)+'　重新整理後再試一次。';w.prepend(n)}
  }
});
document.addEventListener('input',e=>{
  const fi=e.target.closest&&e.target.closest('#favsearch');
  if(fi){ST.favQ=fi.value;route();const ni=document.getElementById('favsearch');if(ni){ni.focus();ni.setSelectionRange(ni.value.length,ni.value.length)}return}
  const inp=e.target.closest&&e.target.closest('#wrsearch');if(!inp)return;
  ST.wrongQ=inp.value;route();
  const ni=document.getElementById('wrsearch');if(ni){ni.focus();ni.setSelectionRange(ni.value.length,ni.value.length)}
});
window.addEventListener('hashchange',route);
function start(){document.body.appendChild(SHELL);loadLocal();route();cloudInit();}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
</script>
